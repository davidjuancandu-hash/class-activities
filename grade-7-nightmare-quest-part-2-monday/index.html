<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nightmare Quest Part 2 — Haunted Story Builder</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#3b235f,#0d0b1b 70%);color:#f9f0ff;font:17px system-ui,sans-serif}main{max-width:850px;margin:25px auto;padding:14px}section{background:#211a3a;border:1px solid #705596;border-radius:23px;padding:clamp(18px,4vw,32px)}h1{font-size:clamp(28px,5vw,43px);color:#f0b9ff;margin:16px 0}h2{color:#f5c8ff}p{line-height:1.55}.top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.progress{height:12px;background:#48365f;border-radius:10px;overflow:hidden;margin:20px 0}.progress div{height:100%;background:#cf96ff;transition:width .2s}.hint{background:#3a2c53;border-left:4px solid #cf96ff;padding:15px;border-radius:9px;margin:15px 0}input,textarea,select{width:100%;background:#fff;color:#171128;border:0;border-radius:10px;padding:13px;font:inherit;margin:7px 0 15px}textarea{min-height:120px;resize:vertical}label{font-weight:750}button{background:#c891ff;color:#20112c;border:0;border-radius:11px;padding:12px 17px;font-weight:800;font-size:1rem;cursor:pointer;margin:5px}button:disabled{opacity:.45;cursor:not-allowed}.nav{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:16px}.small{font-size:.9rem;color:#d9c7ec}.warning{color:#ffe1a0}.success{color:#b5f6d4}.stats{display:flex;gap:10px;flex-wrap:wrap}.stats span{background:#392b50;padding:8px 12px;border-radius:10px}canvas{width:100%;height:auto;background:#15223f;border-radius:13px;touch-action:none}.gamebuttons{display:flex;flex-wrap:wrap;gap:8px}.gamebuttons button{flex:1 1 190px}.gamecontrols{display:flex;justify-content:center}.gamecontrols button{min-width:105px}details{background:#302343;border-radius:10px;padding:12px;margin:10px 0}summary{cursor:pointer;font-weight:750}blockquote{border-left:3px solid #e2bbff;padding-left:12px;margin-left:0;color:#f3defe}@media(max-width:500px){button{font-size:.93rem}} </style></head><body><main><section><div class="top"><strong>🌙 GRADE 7 · THE MYSTERY OF DREAMS PBL</strong><span id="counter">WELCOME</span></div><h1>👻 Nightmare Quest Part 2</h1><p><strong>THE HAUNTED STORY BUILDER</strong> · Monday · Steps 6–7</p><div class="progress"><div id="fill"></div></div><p class="small">Your mission: write Paragraph 1 (Beginning) and Paragraph 2 (Middle). Save your work for Tuesday's ending!</p><div id="area"></div><div class="nav" id="nav"><button id="prev">← Previous</button><button id="next">Next →</button></div></section></main><script>
"use strict";
const KEY="nightmareQuestPart2Monday_v1",PART1="nightmareQuest7Github";
const prompts=[
{part:1,title:"Sentence 1 — Introduce the dream or nightmare",question:"Introduce your dream or nightmare.",starter:"One strange dream I had was…",example:"One strange nightmare I had was about an abandoned school that floated above the clouds."},
{part:1,title:"Sentence 2 — Explain the kind of dream",question:"What kind of dream was it, and when did it begin?",starter:"It was a… dream, and it began when…",example:"It was a frightening nightmare, and it began when I heard a mysterious bell at midnight."},
{part:1,title:"Sentence 3 — Describe the setting and characters",question:"Where were you, and who or what appeared?",starter:"In my dream, I was… with…",example:"In my dream, I stood in an empty classroom with my best friend and a strange shadow."},
{part:2,title:"Sentence 4 — Describe the first event",question:"What happened first?",starter:"First, I…",example:"First, I opened the classroom door and discovered a dark hallway with no windows."},
{part:2,title:"Sentence 5 — Describe the next strange event",question:"What surprising event happened next?",starter:"Suddenly, I…",example:"Suddenly, the desks started flying through the air, and the lights turned bright green."},
{part:2,title:"Sentence 6 — Add a vivid dream detail",question:"Describe something you saw, heard, or noticed.",starter:"I saw… / I heard… / I noticed…",example:"I heard quiet whispers coming from the walls and noticed tiny glowing footprints on the floor."},
{part:2,title:"Sentence 7 — Explain a feeling and its reason",question:"How did you feel, and why?",starter:"I felt… because…",example:"I felt terrified because the shadow was following us, but I knew we had to escape."}
];
let state={student:"",className:"",date:new Date().toLocaleDateString("en-CA"),answers:Array(7).fill(""),page:-1,completed:false,notes:"",...JSON.parse(localStorage.getItem(KEY)||"{}")};
if(!Array.isArray(state.answers)||state.answers.length!==7)state.answers=Array(7).fill("");
const area=document.getElementById("area"),counter=document.getElementById("counter"),fill=document.getElementById("fill"),prev=document.getElementById("prev"),next=document.getElementById("next"),nav=document.getElementById("nav");
const escapeHTML=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const words=s=>(String(s||"").match(/[\p{L}\p{N}]+(?:['’\-][\p{L}\p{N}]+)*/gu)||[]);
const count=s=>words(s).length;
const meaningful=s=>count(s)>=8&&new Set(words(s).map(w=>w.toLowerCase())).size>=5&&!/^(?:idk|i don.t know|no idea|asdf|blah|test|none)[\s.!?]*$/i.test(s.trim());
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function capture(){if(state.page===-1){for(const [k,id] of [["student","student"],["className","className"],["date","date"],["notes","notes"]]){const el=document.getElementById(id);if(el)state[k]=el.value.trim()}}else if(state.page>=0&&state.page<7){const el=document.getElementById("answer");if(el)state.answers[state.page]=el.value.trim()}save()}
function part1Notes(){try{const p=JSON.parse(localStorage.getItem(PART1)||"{}");return [["Dream idea",p.idea],["Dream type",p.type],["When",p.when],["Where",p.where],["Who",p.who],["First event",p.first],["Next event",p.next],["Strange detail",p.detail],["Feelings",p.during]].filter(x=>x[1]).map(x=>x.join(": ")).join("\n")}catch(e){return""}}
function render(){counter.textContent=state.page<0?"START":state.page<7?"WRITING MISSION "+(state.page+1)+" / 7":"MISSION COMPLETE";fill.style.width=(state.page<0?0:state.page<7?(state.page+1)/7*100:100)+"%";prev.style.display=state.page<=-1?"none":"inline-block";next.style.display=state.page>=7?"none":"inline-block";nav.style.display=state.page>=8?"none":"flex";
if(state.page===-1){area.innerHTML='<h2>🚪 Enter the Haunted Story Builder</h2><div class="hint"><strong>✍️ TODAY: WRITE TWO PARAGRAPHS</strong><p>Paragraph 1: three sentences (aim for 30–35 words). Paragraph 2: four sentences (aim for 45–50 words). Write <strong>8 or more meaningful words in EACH sentence</strong>. No “IDK,” repeated filler, or copying the examples!</p></div><label for="student">Student name</label><input id="student" value="'+escapeHTML(state.student)+'"><label for="className">Class / Section</label><input id="className" value="'+escapeHTML(state.className)+'"><label for="date">Date</label><input type="date" id="date" value="'+escapeHTML(state.date)+'"><details open><summary>📝 Your notes from Part 1</summary><p class="small">If you used the same browser for Part 1, your planning notes appear below. Otherwise, paste or type your notes here.</p><textarea id="notes" placeholder="Dream idea, setting, characters, events, feelings…">'+escapeHTML(state.notes||part1Notes())+'</textarea></details><p class="small">Your answers save automatically on this browser. You may invent a dream; share only what you feel comfortable sharing.</p>';next.textContent="START MY WRITING QUEST →";return}
if(state.page<7){const p=prompts[state.page],isMiddle=p.part===2;const total=count(state.answers.slice(0,state.page+1).join(" "));area.innerHTML='<h2>'+(isMiddle?"🌘 PARAGRAPH 2 — MIDDLE":"🌒 PARAGRAPH 1 — BEGINNING")+'</h2><h3>'+p.title+'</h3><div class="hint"><strong>YOUR TASK:</strong> '+p.question+'<p><strong>Optional sentence starter:</strong> '+p.starter+'</p><details><summary>💡 See an example for inspiration</summary><blockquote>'+p.example+'</blockquote><p class="small">Do not copy the example. Make your own dream story!</p></details></div><label for="answer">Write your own complete sentence (at least 8 meaningful words):</label><textarea id="answer" placeholder="Write a complete sentence using your own ideas…">'+escapeHTML(state.answers[state.page])+'</textarea><div class="stats"><span id="wordcount">Words: '+count(state.answers[state.page])+' / minimum 8</span><span>Words so far: <span id="totalcount">'+total+'</span></span></div><p class="small">Use past tense, capitals, punctuation, and specific details. You can return and improve earlier sentences.</p><details><summary>📖 My dream notes</summary><p style="white-space:pre-wrap">'+escapeHTML(state.notes||part1Notes()||"No notes saved. Use your original Part 1 planner.")+'</p></details>';document.getElementById("answer").addEventListener("input",e=>{state.answers[state.page]=e.target.value;save();document.getElementById("wordcount").textContent="Words: "+count(e.target.value)+" / minimum 8";document.getElementById("totalcount").textContent=count(state.answers.join(" "))});next.textContent=state.page===6?"FINISH MONDAY'S WRITING →":"NEXT WRITING MISSION →";return}
if(state.page===7){const p1=state.answers.slice(0,3).join(" "),p2=state.answers.slice(3).join(" ");area.innerHTML='<h2>🏆 Monday Writing Complete!</h2><p>Great work, <strong>'+escapeHTML(state.student)+'</strong>! You have written your beginning and middle.</p><div class="stats"><span>Paragraph 1: '+count(p1)+' words</span><span>Paragraph 2: '+count(p2)+' words</span><span>Total: '+count(p1+" "+p2)+' words</span></div><div class="hint"><strong>Review your writing:</strong><p>'+escapeHTML(p1)+'</p><hr><p>'+escapeHTML(p2)+'</p><p class="small">Targets: Paragraph 1 ≈30–35 words; Paragraph 2 ≈45–50 words. These are guides, not strict limits. Tuesday: Paragraph 3 and your final 100–120-word essay.</p></div><button onclick="downloadDoc()">⬇️ SAVE & DOWNLOAD MY MONDAY PLANNER (.DOC)</button><button onclick="copyWork()">📋 COPY MY WRITING (BACKUP)</button><h2>🎮 Unlock Your Flying Dream Arcade!</h2><p>Pick any of the three flying games below. Dodge obstacles and collect eight magical objects!</p><div class="gamebuttons"><button onclick="startGame(0)">🧙‍♀️ WITCH FLIGHT</button><button onclick="startGame(1)">🐉 DRAGON ESCAPE</button><button onclick="startGame(2)">🦄 UNICORN DREAMLAND</button></div><p class="small">Your writing is saved on this device. Download it before switching devices or clearing browser data.</p>';next.style.display="none";return}
if(state.page===8)drawGamePage()
}
function go(delta){if(state.page===8){stopGame();state.page=7;save();render();return}capture();if(delta>0){if(state.page===-1&&(!state.student||!state.className||!state.date)){alert("Enter your name, class, and date first.");return}if(state.page>=0&&state.page<7&&!meaningful(state.answers[state.page])){alert("✍️ Please write a complete sentence with at least 8 meaningful words. “IDK” and repeated filler do not count.");document.getElementById("answer")?.focus();return}}state.page=Math.max(-1,Math.min(7,state.page+delta));if(state.page===7)state.completed=true;save();render();window.scrollTo(0,0)}
prev.addEventListener("click",()=>go(-1));next.addEventListener("click",()=>go(1));
function docHTML(){const safe=escapeHTML,p1=state.answers.slice(0,3).map(s=>safe(s)).join(" "),p2=state.answers.slice(3).map(s=>safe(s)).join(" ");return '<!doctype html><html><head><meta charset="utf-8"><title>Mystery of Dreams Monday Planner</title><style>body{font:12pt Arial,sans-serif;color:#111;margin:35px}h1{font-size:20pt}h2{font-size:15pt;border-bottom:1px solid #999;padding-bottom:5px}p{line-height:1.5}li{margin:10px 0}</style></head><body><p><b>GRADE 7 | THE MYSTERY OF DREAMS PBL</b></p><h1>The Mystery of Dreams — Monday Writing Planner</h1><p><b>Name:</b> '+safe(state.student)+' &nbsp; <b>Class:</b> '+safe(state.className)+' &nbsp; <b>Date:</b> '+safe(state.date)+'</p><p><b>Part 2: Steps 6–7. Beginning and Middle.</b></p><h2>Step 6 — Paragraph 1: Beginning</h2><ol>'+state.answers.slice(0,3).map(s=>'<li>'+safe(s)+'</li>').join("")+'</ol><p><b>Complete Paragraph 1 ('+count(p1)+' words):</b> '+p1+'</p><h2>Step 7 — Paragraph 2: Middle</h2><ol start="4">'+state.answers.slice(3).map(s=>'<li>'+safe(s)+'</li>').join("")+'</ol><p><b>Complete Paragraph 2 ('+count(p2)+' words):</b> '+p2+'</p><p><b>Monday total:</b> '+count(state.answers.join(" "))+' words. Tuesday: write the ending and final essay.</p></body></html>'}
function downloadDoc(){const blob=new Blob(["\ufeff",docHTML()],{type:"application/msword;charset=utf-8"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download="Dreams-Monday-Part2-"+(state.student||"Student").replace(/[^a-z0-9_-]/gi,"_")+".doc";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000)}
function copyWork(){const txt="THE MYSTERY OF DREAMS — MONDAY\n"+state.student+" | "+state.className+" | "+state.date+"\n\nPARAGRAPH 1\n"+state.answers.slice(0,3).join(" ")+"\n\nPARAGRAPH 2\n"+state.answers.slice(3).join(" ");if(navigator.clipboard?.writeText){navigator.clipboard.writeText(txt).then(()=>alert("Writing copied! Paste it into Notes, Pages, or Google Docs.")).catch(()=>fallbackCopy(txt))}else fallbackCopy(txt)}
function fallbackCopy(txt){const t=document.createElement("textarea");t.value=txt;document.body.appendChild(t);t.select();try{document.execCommand("copy");alert("Writing copied. Paste it into Notes or Google Docs.")}catch(e){alert("Copy not supported in this browser. Try the download button.")}t.remove()}
const worlds=[{name:"Witch Flight",hero:"🧙‍♀️",good:"⭐",bad:"🦇",bg:"#271443"},{name:"Dragon Sky Escape",hero:"🐉",good:"💎",bad:"☄️",bg:"#143950"},{name:"Unicorn Dreamland",hero:"🦄",good:"🌈",bad:"🌩️",bg:"#503879"}];let world=0,flight=null,raf=0,held=0;
function stopGame(){if(raf)cancelAnimationFrame(raf);raf=0;held=0;flight=null}
function startGame(i){stopGame();world=i;flight={y:150,items:[],score:0,lives:3,t:0,done:false};state.page=8;save();render();raf=requestAnimationFrame(tick)}
function drawGamePage(){const w=worlds[world];area.innerHTML='<h2>🎮 '+w.name+'</h2><p id="hud">✨ 0 / 8 · ❤️❤️❤️</p><canvas id="sky" width="640" height="320"></canvas><div class="gamecontrols"><button id="up">⬆️ UP</button><button id="down">⬇️ DOWN</button></div><p id="gameMessage">Collect 8 magical objects. Avoid the obstacles!</p><button onclick="startGame(world)">↻ Replay</button><button onclick="stopGame();state.page=7;save();render()">← Back to Results & Download</button>';for(const [id,v] of [["up",-1],["down",1]]){const el=document.getElementById(id);el.addEventListener("pointerdown",e=>{e.preventDefault();held=v;el.setPointerCapture(e.pointerId)});for(const ev of ["pointerup","pointercancel","lostpointercapture"])el.addEventListener(ev,()=>held=0)}}
function tick(){if(!flight||flight.done)return;const c=document.getElementById("sky");if(!c)return;const ctx=c.getContext("2d"),w=worlds[world];flight.t++;flight.y=Math.max(30,Math.min(288,flight.y+held*4));ctx.fillStyle=w.bg;ctx.fillRect(0,0,640,320);ctx.font="21px serif";for(let i=0;i<22;i++)ctx.fillText("✦",((i*131-flight.t*(1+i%3))%700+700)%700,(i*71)%300);if(flight.t%43===0)flight.items.push({x:655,y:35+Math.random()*250,bad:Math.random()<.35});ctx.font="44px serif";ctx.fillText(w.hero,65,flight.y+14);ctx.font="33px serif";for(const o of flight.items){o.x-=3.4;ctx.fillText(o.bad?w.bad:w.good,o.x,o.y+10);if(Math.abs(o.x-80)<30&&Math.abs(o.y-flight.y)<32){if(o.bad)flight.lives--;else flight.score++;o.x=-100}}flight.items=flight.items.filter(o=>o.x>-50);document.getElementById("hud").textContent="✨ "+flight.score+" / 8 · "+"❤️".repeat(Math.max(0,flight.lives));if(flight.score>=8||flight.lives<=0){flight.done=true;document.getElementById("gameMessage").textContent=flight.score>=8?"🏆 You conquered the dream!":"💫 Dream over! Replay and try again.";return}raf=requestAnimationFrame(tick)}
document.addEventListener("keydown",e=>{if(state.page===8&&["ArrowUp","ArrowDown"].includes(e.key)){e.preventDefault();held=e.key==="ArrowUp"?-1:1}});document.addEventListener("keyup",e=>{if(["ArrowUp","ArrowDown"].includes(e.key))held=0});
if(state.page===8)state.page=7;
render();
</script></body></html>
