<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Grade 8 Word Wars</title><style>*{box-sizing:border-box}body{background:radial-gradient(circle at top,#273d77,#0b1227);color:#f8faff;font:20px system-ui;margin:0}main{max-width:1100px;margin:auto;padding:20px}h1{font-size:clamp(40px,7vw,78px);color:#ffcf55;margin:8px 0}.card{background:#182746;border:2px solid #4867a0;border-radius:20px;padding:24px;margin:18px 0;text-align:center}.word{font-size:clamp(34px,6vw,65px);font-weight:900;color:#ffcf55;margin:25px 0;overflow-wrap:anywhere}.buttons,.tabs,.scores{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}button{border:0;border-radius:12px;padding:13px 17px;background:#ffcf55;color:#151b2c;font:700 18px system-ui;cursor:pointer}button.alt{background:#425f96;color:white}.scores>div{background:#273b64;border-radius:12px;padding:14px;min-width:175px;flex:1}.scores b{display:block;font-size:42px;color:#ffcf55}.scores button{margin:4px;padding:7px 12px}.definition{background:#2e4775;border-radius:12px;padding:20px;font-size:30px}.round{color:#8cdefa;font-weight:800}#clock{font-size:70px;font-weight:900;color:#ffcf55}small{color:#c5d1e8}.buttons{margin:18px 0}</style></head><body><main><small>GRADE 8 • 45 MINUTES • SCHOOL SAFE • PROJECTOR EDITION</small><h1>⚔️ WORD WARS ⚔️</h1><p>THE CLASSROOM CONVERSATION CHAMPIONSHIP</p><div class="tabs" id="tabs"></div><section id="stage" class="card"></section><section class="card"><h2>🏆 TEAM SCOREBOARD</h2><div class="scores" id="scores"></div><button class="alt" onclick="reset()">Reset scores</button></section><section class="card"><h2>⏱ COUNTDOWN</h2><div id="clock">00:30</div><div class="buttons"><button onclick="start()">▶ Start</button><button class="alt" onclick="pause()">Pause</button><button class="alt" onclick="timer(5)">5s</button><button class="alt" onclick="timer(10)">10s</button><button class="alt" onclick="timer(30)">30s</button><button class="alt" onclick="timer(60)">60s</button></div></section><button class="alt" onclick="document.documentElement.requestFullscreen?.()">⛶ Fullscreen</button><p><small>Progress saved automatically on this browser. Award 1 point for an answer and 1 bonus point for a complete sentence.</small></p></main><script>
const C={"g":8,"w":["Environment","Adventure","Embarrassed","Opportunity","Responsible","Interesting","Unfortunately"],"d":["The natural world around us.","An exciting experience.","Feeling awkward or uncomfortable.","A chance to do something.","Able to be trusted.","Holding someone's curiosity.","Introducing something disappointing."],"b":["Name three ways to help the environment.","Name three good friend qualities.","Name three places to visit.","Name three inventions.","Name three jobs.","Name three reasons to enjoy music."],"q":["Homework should be limited.","A robot is better than a real pet.","Students should choose school subjects.","Every city needs more parks.","Travel is better than expensive possessions."]},cow=[["Dagnabbit!","An expression of frustration."],["Fiddlesticks!","Nonsense!"],["Balderdash!","Complete nonsense."],["Hogwash!","Something untrue."],["Poppycock!","Absolute nonsense."],["Great Scott!","An expression of surprise."]],tabs=["🎤 Warm-Up","🔤 Word Battle","💣 Vocabulary Bomb","🤠 Cowboy Words","🗣️ Debate","👹 Final Boss"];let p=0,i=0,j=0,k=0,l=0,m=0,reveal=false,score=[0,0,0,0],sec=30,tick=null;const $=x=>document.getElementById(x),key="wordwars-g"+C.g;try{let x=JSON.parse(localStorage.getItem(key));if(x){p=x.p||0;i=x.i||0;j=x.j||0;k=x.k||0;l=x.l||0;m=x.m||0;score=x.score||score}}catch(e){}function save(){localStorage.setItem(key,JSON.stringify({p,i,j,k,l,m,score}))}function btn(t,f,alt=false){return '<button class="'+(alt?'alt':'')+'" onclick="'+f+'">'+t+'</button>'}function nav(n){p=n;reveal=false;pause();render();save()}function flip(){reveal=!reveal;render()}function nxt(which){if(which===1)i=(i+1)%C.w.length;if(which===2)j=(j+1)%C.b.length;if(which===3)k=(k+1)%cow.length;if(which===4)l=(l+1)%C.q.length;if(which===5)m=(m+1)%6;reveal=false;render();save()}function render(){$('tabs').innerHTML=tabs.map((x,n)=>btn(x,'nav('+n+')',p!==n)).join('');let h='';
if(p===0)h='<div class="round">0–5 MINUTES</div><h2>READY FOR WORD WARS?</h2><div class="word">TEAM VS. TEAM!</div><p>Form 2–4 teams. Choose team names. Each person must speak at least once.</p><p>Say one thing you enjoy and explain why.</p>'+btn('⚔️ Start Word Battle','nav(1)');
if(p===1)h='<div class="round">5–17 MINUTES • WORD '+(i+1)+' / 7</div><h2>🔤 SAY IT THREE TIMES!</h2><div class="word">'+C.w[i]+'</div><p>Pronounce it. Guess its meaning. Use it in a complete English sentence.</p>'+(reveal?'<div class="definition">'+C.d[i]+'</div>':'<p>Definition hidden. Guess first!</p>')+btn(reveal?'Hide definition':'📖 Reveal definition','flip()',true)+' '+btn('Next word','nxt(1)');
if(p===2)h='<div class="round">17–26 MINUTES</div><h2>💣 VOCABULARY BOMB</h2><div class="word">'+C.b[j]+'</div><p>10 seconds. Name three things and use one in a sentence.</p>'+btn('Next challenge','nxt(2)')+' '+btn('⏱ 10 seconds','timer(10)',true);
if(p===3)h='<div class="round">26–31 MINUTES</div><h2>🤠 OLD-FASHIONED EXPRESSIONS</h2><div class="word">'+cow[k][0]+'</div><p>Say it like a cowboy! Guess the meaning, then invent a funny, school-safe sentence.</p>'+(reveal?'<div class="definition">'+cow[k][1]+'</div>':'<p>Guess before revealing!</p>')+btn(reveal?'Hide definition':'📖 Reveal definition','flip()',true)+' '+btn('Next expression','nxt(3)');
if(p===4)h='<div class="round">31–40 MINUTES</div><h2>🗣️ RIDICULOUS DEBATE</h2><div class="word">'+C.q[l]+'</div><p>One team agrees. Another disagrees. Give reasons and examples.</p><p>“I think… because…” / “I disagree because…”</p>'+btn('Next debate','nxt(4)')+' '+btn('⏱ 30 seconds','timer(30)',true);
if(p===5)h='<div class="round">40–45 MINUTES</div><h2>👹 FINAL BOSS: WORD CHAIN</h2><div class="word">'+["DRAGON","MUSIC","PLANET","TIGER","CHOCOLATE","ADVENTURE"][m]+'</div><p>Each new word starts with the last letter of the previous word. No repeats. 5 seconds each!</p>'+btn('New starting word','nxt(5)')+' '+btn('⏱ 5 seconds','timer(5)',true)+' '+btn('🏆 Winner','winner()',true);
$('stage').innerHTML=h;renderScore()}function renderScore(){$('scores').innerHTML=score.map((x,n)=>'<div>TEAM '+(n+1)+'<b>'+x+'</b>'+btn('−1','change('+n+',-1)',true)+btn('+1','change('+n+',1)')+btn('+2','change('+n+',2)')+'</div>').join('')}function change(n,d){score[n]=Math.max(0,score[n]+d);renderScore();save()}function reset(){if(confirm('Reset scores?')){score=[0,0,0,0];renderScore();save()}}function winner(){let high=Math.max(...score);alert('🏆 WINNER: '+score.map((x,n)=>x===high?'TEAM '+(n+1):null).filter(Boolean).join(' & '))}function showClock(){$('clock').textContent=String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0')}function timer(n){pause();sec=n;showClock()}function pause(){if(tick){clearInterval(tick);tick=null}}function start(){if(tick)return;tick=setInterval(()=>{sec=Math.max(0,sec-1);showClock();if(sec===0){pause();try{let a=new AudioContext(),o=a.createOscillator();o.connect(a.destination);o.start();o.stop(a.currentTime+.2);o.onended=()=>a.close()}catch(e){}}},1000)}render();showClock();
</script></body></html>
