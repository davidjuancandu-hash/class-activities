<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dream Quest Part 3 — Autumn Finale</title><style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% 0,#98522c,transparent 40%),linear-gradient(145deg,#39492d,#402a20 65%,#261e19);color:#fff2da;font:17px system-ui,sans-serif;min-height:100vh}main{max-width:900px;margin:auto;padding:18px}header{text-align:center;padding:8px}h1{color:#ffda8b;font-size:clamp(29px,5vw,44px);margin:10px 0}h2{color:#ffd394}h3{color:#ffe0a7}.leaves{font-size:27px;letter-spacing:13px}section{background:#3b2c24;border:2px solid #bb894a;border-radius:22px;padding:clamp(16px,4vw,30px);box-shadow:0 15px 35px #130e0b66}.hint{background:#60422b;border-left:5px solid #f6bb5d;padding:13px;border-radius:8px;margin:14px 0}.small{color:#e9d0a8;font-size:.88rem}.progress{height:12px;background:#66523a;border-radius:10px;margin:15px 0;overflow:hidden}.progress>div{height:100%;background:linear-gradient(90deg,#c66e36,#f6ca5e);width:0}label{display:block;font-weight:750;margin-top:12px}input,textarea,select{font:inherit;width:100%;background:#fffdf8;color:#2b231d;border:2px solid #e1bd7d;border-radius:10px;padding:11px;margin:7px 0}textarea{min-height:125px;resize:vertical}button{font:inherit;font-weight:800;border:0;border-radius:10px;background:#f4bf64;color:#332219;padding:12px 16px;margin:5px;cursor:pointer;min-height:45px}button:disabled{opacity:.5;cursor:not-allowed}.nav,.tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.nav{justify-content:space-between}.story{white-space:pre-wrap;background:#59402e;border-radius:12px;padding:17px;line-height:1.6;max-height:340px;overflow:auto}canvas{display:block;width:100%;max-width:680px;aspect-ratio:16/9;background:#203329;border:3px solid #e7b765;border-radius:12px;touch-action:none} .gamepad{display:flex;flex-wrap:wrap;gap:6px}.gamepad button{min-width:70px} .status{color:#ffe2a0} .scene{padding:10px;background:#513b2b;border-radius:9px;margin:9px 0}.pill{display:inline-block;background:#655038;border-radius:9px;padding:8px;margin:5px}.voicebox{background:#f5e6c6;color:#3d2b1d;padding:13px;border-radius:12px}.voicebox label{margin:5px 0}a{color:#ffe5a5}@media(max-width:500px){button{font-size:14px}.leaves{letter-spacing:5px}}</style></head><body><main><header><div class="leaves">🍁 🍂 🦃 🍁 🍂</div><h1>🌙 The Mystery of Dreams</h1><strong>PART 3 — THE AUTUMN FINALE · TUESDAY · 60 MINUTES</strong><p>Finish your dream. Improve your writing. Plan your waterfall book. Earn your arcade!</p></header><section><div id="stepLabel">WELCOME</div><div class="progress"><div id="bar"></div></div><div id="app"></div><div class="nav" id="nav"><button id="back">← Previous</button><button id="next">Continue →</button></div></section></main><script>
"use strict";
const KEY="dreamQuestTuesdayAutumn_v1",MONDAY="nightmareQuestPart2Monday_v1";
const $=id=>document.getElementById(id),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const words=s=>(String(s||"").match(/[\p{L}\p{N}]+(?:['’-][\p{L}\p{N}]+)*/gu)||[]),wc=s=>words(s).length;
const prompts=[
["Sentence 8 — How did your dream end?","Explain what happened at the end of the dream.","Finally, I…"],
["Sentence 9 — How did you feel when you woke up?","Describe your feelings after waking and explain why.","When I woke up, I felt… because…"],
["Sentence 10 — Why was the dream memorable?","Explain what made this dream unusual or unforgettable.","I will remember this dream because…"]
];
let s={page:-1,name:"",className:"",date:new Date().toLocaleDateString("en-CA"),monday:Array(7).fill(""),ending:Array(3).fill(""),scenes:Array(5).fill(""),review:"",checks:[false,false,false],revised:false,source:"",...JSON.parse(localStorage.getItem(KEY)||"{}")};
if(!Array.isArray(s.monday)||s.monday.length!==7)s.monday=Array(7).fill("");if(!Array.isArray(s.ending)||s.ending.length!==3)s.ending=Array(3).fill("");if(!Array.isArray(s.scenes)||s.scenes.length!==5)s.scenes=Array(5).fill("");
let voiceChoice="",voiceRate=.9,voices=[],lastSpoken="",game=null,frame=0,keys={};try{const v=JSON.parse(localStorage.getItem("dreamNarratorPrefs")||"{}");voiceChoice=v.voice||"";voiceRate=v.speed||.9}catch(e){}
function save(){localStorage.setItem(KEY,JSON.stringify(s))}
function mondayText(){return s.monday.slice(0,3).join(" ")+"\n\n"+s.monday.slice(3).join(" ")}
function story(){return mondayText()+"\n\n"+s.ending.join(" ")}
function capture(){if(s.page===-1){s.name=$("name")?.value.trim()||s.name;s.className=$("className")?.value.trim()||s.className;s.date=$("date")?.value||s.date;const m=$("mondayInput");if(m){const raw=m.value.trim();if(raw&&s.monday.every(x=>!x.trim())){const paras=raw.split(/\n\s*\n/);const sentences=raw.match(/[^.!?]+[.!?]+|[^.!?]+$/g)||[];s.monday=Array.from({length:7},(_,i)=>(sentences[i]||"").trim());s.source="pasted"}}}else if(s.page>=0&&s.page<3)s.ending[s.page]=$("answer")?.value.trim()||"";else if(s.page===3){s.review=$("review")?.value.trim()||"";s.checks=[...document.querySelectorAll(".check")].map(x=>x.checked)}else if(s.page===4){s.scenes=s.scenes.map((x,i)=>$("scene"+i)?.value.trim()||"")}save()}
function meaningful(t,min=8){return wc(t)>=min&&new Set(words(t).map(x=>x.toLowerCase())).size>=5&&!/^(idk|none|test|asdf|blah)/i.test(t.trim())}
function loadMonday(){try{const m=JSON.parse(localStorage.getItem(MONDAY)||"{}");if(m.answers?.length===7&&m.answers.some(x=>x.trim())){s.monday=m.answers.map(String);s.name=s.name||m.student||"";s.className=s.className||m.className||"";s.source="same-browser";save();return true}}catch(e){}return false}
function importMonday(file){if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const o=JSON.parse(reader.result),m=o.format==="dreams-monday-v1"?o.state:o;if(!Array.isArray(m.answers)||m.answers.length!==7)throw Error("Choose the Monday SAVED PROGRESS .json file.");if(!confirm("Load Monday's seven sentences into Tuesday?"))return;s.monday=m.answers.map(String);s.name=s.name||m.student||"";s.className=s.className||m.className||"";s.source="imported";save();render()}catch(e){alert("Could not import Monday work: "+e.message)}};reader.readAsText(file)}
function voiceKey(v){return v.name+"|"+v.lang}
function voicesRefresh(){if(!("speechSynthesis"in window))return;voices=speechSynthesis.getVoices();document.querySelectorAll(".voiceSelect").forEach(el=>{el.replaceChildren();el.add(new Option("Device default",""));const en=voices.filter(v=>/^en([-_]|$)/i.test(v.lang));(en.length?en:voices).forEach(v=>el.add(new Option(v.name+" — "+v.lang,voiceKey(v))));el.value=[...el.options].some(o=>o.value===voiceChoice)?voiceChoice:""})}
function voiceControls(){return '<div class="voicebox"><label>🎭 Choose narrator <select class="voiceSelect"></select></label><label>🐢 Speed <span id="rateText">'+voiceRate.toFixed(1)+'×</span><input id="rate" type="range" min="0.5" max="1.5" step="0.1" value="'+voiceRate+'"></label></div><div class="tools"><button type="button" id="listen">🔊 PLAY</button><button type="button" id="pause">⏸ PAUSE / RESUME</button><button type="button" id="restart">⏮ RESTART</button><button type="button" id="stop">⏹ STOP</button></div>'}
function wireVoice(text){voicesRefresh();const select=document.querySelector(".voiceSelect");if(select)select.onchange=()=>{voiceChoice=select.value;voiceSave()};const rate=$("rate");if(rate)rate.oninput=()=>{voiceRate=Number(rate.value);$("rateText").textContent=voiceRate.toFixed(1)+"×";voiceSave()};$("listen").onclick=()=>speak(text());$("pause").onclick=()=>{if(!("speechSynthesis"in window))return;if(speechSynthesis.paused)speechSynthesis.resume();else if(speechSynthesis.speaking)speechSynthesis.pause()};$("restart").onclick=()=>speak(lastSpoken||text());$("stop").onclick=()=>{"speechSynthesis"in window&&speechSynthesis.cancel()}}
function voiceSave(){localStorage.setItem("dreamNarratorPrefs",JSON.stringify({voice:voiceChoice,speed:voiceRate}))}
function speak(t){if(!("speechSynthesis"in window)){alert("Narration is not available on this browser.");return}lastSpoken=t.trim();if(!lastSpoken)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(lastSpoken),v=voices.find(v=>voiceKey(v)===voiceChoice);if(v){u.voice=v;u.lang=v.lang}else u.lang="en-US";u.rate=voiceRate;speechSynthesis.speak(u)}
if("speechSynthesis"in window)speechSynthesis.addEventListener?.("voiceschanged",voicesRefresh);
function render(){stopGame();$("stepLabel").textContent=s.page<0?"🍂 START":s.page<3?"✍️ ENDING SENTENCE "+(s.page+8)+" / 10":s.page===3?"🪄 FINAL REVISION":s.page===4?"🎨 WATERFALL BOOK":s.page===5?"🏆 FINAL SUBMISSION":"🎮 AUTUMN ARCADE";$("bar").style.width=(Math.max(0,s.page+1)/7*100)+"%";$("back").style.display=s.page<0?"none":"inline-block";$("next").style.display=s.page>=5?"none":"inline-block";$("nav").style.display=s.page>=5?"none":"flex";
if(s.page===-1){if(s.monday.every(x=>!x.trim()))loadMonday();$("app").innerHTML='<h2>🍂 Welcome to the Autumn Finale!</h2><div class="hint">Today: <b>Step 8</b> ending paragraph (3 sentences), <b>Step 9</b> revise your 100–120-word essay, <b>Step 10</b> plan five waterfall-book scenes. Your dream can be real or invented.</div><label>Student name<input id="name" value="'+esc(s.name)+'"></label><label>Class / Section<input id="className" value="'+esc(s.className)+'"></label><label>Date<input id="date" type="date" value="'+esc(s.date)+'"></label><h3>📖 Bring your Monday writing</h3><p id="loadStatus" class="status">'+(s.monday.some(x=>x.trim())?"✅ Monday sentences loaded ("+wc(mondayText())+" words).":"Monday writing not found on this browser. Import the saved Monday progress file, or paste your two paragraphs below.")+'</p><div class="tools"><button id="autoLoad">🔄 LOAD FROM THIS BROWSER</button><label>📁 IMPORT MONDAY PROGRESS (.json)<input type="file" id="mondayFile" accept=".json,application/json"></label></div><label>Or paste Monday Paragraphs 1 and 2<textarea id="mondayInput" placeholder="Paste your seven Monday sentences here if you cannot import the progress file."></textarea></label><p class="small">Best option: use the same browser as Monday, or import the Monday SAVED PROGRESS .json file. If pasting, review your seven sentences carefully.</p>';$("autoLoad").onclick=()=>{capture();if(!loadMonday())alert("No Monday writing found on this browser. Import the Monday progress JSON or paste your work.");render()};$("mondayFile").onchange=e=>importMonday(e.target.files[0]);$("next").textContent="START MY ENDING →";return}
if(s.page<3){const p=prompts[s.page];$("app").innerHTML='<h2>🌾 STEP 8 — PARAGRAPH 3: THE ENDING</h2><h3>'+p[0]+'</h3><div class="hint"><b>Your task:</b> '+p[1]+'<p><b>Optional starter:</b> '+p[2]+'</p><p class="small">Use past tense, specific details, capitals and punctuation. Write your OWN ideas.</p></div><label>Your complete sentence — at least 8 meaningful words<textarea id="answer" spellcheck="true">'+esc(s.ending[s.page])+'</textarea></label><p id="counter" class="status">Words: '+wc(s.ending[s.page])+' / 8 minimum</p><details><summary>📖 Review Monday’s beginning and middle</summary><div class="story">'+esc(mondayText())+'</div></details>'+voiceControls();$("answer").oninput=e=>{s.ending[s.page]=e.target.value;save();$("counter").textContent="Words: "+wc(e.target.value)+" / 8 minimum"};wireVoice(()=>{capture();return story()});$("next").textContent=s.page===2?"REVISE MY STORY →":"NEXT ENDING SENTENCE →";return}
if(s.page===3){const n=wc(story());$("app").innerHTML='<h2>🪄 STEP 9 — FINAL ESSAY WORKSHOP</h2><p>Read and listen to your three-paragraph story. Your target is <b>100–120 words</b> (a guide, not an excuse to add filler).</p><span class="pill">Current total: <b>'+n+'</b> words</span><div class="story">'+esc(story())+'</div>'+voiceControls()+'<div class="hint"><b>Improve your writing:</b> Fix one weak or confusing sentence in the editor below. Explain what you improved. You can go back to the ending sentences if needed.</div><label>Rewrite one sentence from your essay with more detail (8+ meaningful words)<textarea id="review" spellcheck="true">'+esc(s.review)+'</textarea></label><p class="small">This revision replaces the sentence you choose in the next step. Use your own words.</p><label><input class="check" type="checkbox" '+(s.checks[0]?"checked":"")+' > I checked past tense and sequence words.</label><label><input class="check" type="checkbox" '+(s.checks[1]?"checked":"")+' > I checked capitals and punctuation.</label><label><input class="check" type="checkbox" '+(s.checks[2]?"checked":"")+' > I listened or reread my story to check that it makes sense.</label><label>Choose the sentence to replace<select id="replaceIndex">'+Array.from({length:10},(_,i)=>'<option value="'+i+'">Sentence '+(i+1)+'</option>').join("")+'</select></label><button id="applyRevision">✍️ APPLY MY REVISION</button><p id="revisionStatus" class="status">'+(s.revised?"✅ Revision applied.":"Choose and improve one sentence before continuing.")+'</p>';wireVoice(()=>story());$("applyRevision").onclick=()=>{capture();const idx=Number($("replaceIndex").value),old=idx<7?s.monday[idx]:s.ending[idx-7];if(!meaningful(s.review)||s.review.toLowerCase().trim()===old.toLowerCase().trim()){alert("Write at least 8 meaningful words and make a real change to the selected sentence.");return}if(idx<7)s.monday[idx]=s.review;else s.ending[idx-7]=s.review;s.revised=true;s.review="";save();render()};$("next").textContent="PLAN MY WATERFALL BOOK →";return}
if(s.page===4){$("app").innerHTML='<h2>🎨 STEP 10 — FIVE-SCENE WATERFALL BOOK PLAN</h2><p>Choose five important moments from your own dream. These will become illustrations in your waterfall book. Describe each scene in at least <b>4 meaningful words</b>.</p>'+["1. The beginning — Where does your dream start?","2. A character or surprising discovery","3. An important event or problem","4. The biggest surprise or turning point","5. The ending — What happened and how did you feel?"].map((t,i)=>'<div class="scene"><label>'+t+'<textarea id="scene'+i+'" style="min-height:65px" placeholder="Describe what you will draw…">'+esc(s.scenes[i])+'</textarea></label></div>').join("")+'<p class="small">You will create or draw the waterfall book later. Today you are planning its five scenes.</p>';$("next").textContent="FINISH & DOWNLOAD →";return}
if(s.page===5){$("app").innerHTML='<h2>🏆 YOUR AUTUMN DREAM QUEST IS COMPLETE!</h2><p>Great work, <b>'+esc(s.name)+'</b>! Save your final essay and waterfall-book plan before playing.</p><span class="pill">Final essay: '+wc(story())+' words</span><div class="story">'+esc(story())+'</div><div class="tools"><button id="download">⬇️ SAVE & DOWNLOAD (.DOC)</button><button id="progress">💾 SAVE PROGRESS (.JSON)</button><button id="copy">📋 COPY MY ESSAY</button><button id="arcade">🎮 OPEN THE AUTUMN ARCADE</button></div><p class="small">Download your work for your teacher. Saved progress remains on this device unless browser data is cleared.</p>';$("download").onclick=downloadDoc;$("progress").onclick=exportProgress;$("copy").onclick=()=>navigator.clipboard?.writeText(story()).then(()=>alert("Essay copied!")).catch(()=>alert("Use Save & Download instead."));$("arcade").onclick=()=>{s.page=6;save();render()};return}
if(s.page===6){$("app").innerHTML='<h2>🎮 AUTUMN ARCADE — YOU EARNED IT!</h2><p>Three playable mini-games. Use keyboard arrows / space, or the on-screen controls.</p><div class="tools"><button data-game="turkey">🦃 TURKEY ROAD CROSSING</button><button data-game="elves">🧝 ELVES VS. KRAMPUS</button><button data-game="santa">🎅 SANTA’S PRESENT DASH</button></div><p id="gameStatus" class="status">Choose a game!</p><canvas id="game" width="640" height="360" aria-label="Arcade game"></canvas><div class="gamepad"><button data-key="ArrowLeft">⬅ LEFT</button><button data-key="ArrowUp">⬆ UP</button><button data-key="ArrowDown">⬇ DOWN</button><button data-key="ArrowRight">➡ RIGHT</button><button data-key="Space">🚀 JUMP / SHOOT</button></div><button id="backToWork">⬅ BACK TO MY ESSAY</button>';document.querySelectorAll("[data-game]").forEach(b=>b.onclick=()=>startGame(b.dataset.game));document.querySelectorAll("[data-key]").forEach(b=>{const key=b.dataset.key;b.onpointerdown=e=>{e.preventDefault();keys[key]=true};b.onpointerup=b.onpointercancel=b.onpointerleave=()=>keys[key]=false});$("backToWork").onclick=()=>{stopGame();s.page=5;render()};return}}
function next(){capture();if(s.page===-1){if(!s.name||!s.className){alert("Enter your name and class first.");return}if(s.monday.every(x=>!x.trim())){alert("Bring in your Monday paragraphs first using the same browser, Monday progress file, or paste them.");return}}if(s.page>=0&&s.page<3&&!meaningful(s.ending[s.page])){alert("Write at least 8 meaningful words in a complete sentence.");return}if(s.page===3){if(!s.revised||!s.checks.every(Boolean)){alert("Apply one meaningful revision and complete all three writing checks.");return}}if(s.page===4&&s.scenes.some(x=>wc(x)<4)){alert("Describe each of the five scenes using at least 4 words.");return}if(s.page<5){s.page++;save();render();scrollTo({top:0,behavior:"smooth"})}}
$("next").onclick=next;$("back").onclick=()=>{capture();if(s.page>0){s.page--;save();render()}else if(s.page===0){s.page=-1;save();render()}};
function download(name,content,type){const blob=new Blob([content],{type}),u=URL.createObjectURL(blob),a=document.createElement("a");a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),30000)}
function downloadDoc(){const safe=esc,doc='<!doctype html><html><head><meta charset="utf-8"></head><body style="font-family:Arial"><h1>The Mystery of Dreams — Tuesday Final Essay</h1><p><b>Student:</b> '+safe(s.name)+' | <b>Class:</b> '+safe(s.className)+' | <b>Date:</b> '+safe(s.date)+'</p><h2>Paragraph 1 — Beginning</h2><p>'+safe(s.monday.slice(0,3).join(" "))+'</p><h2>Paragraph 2 — Middle</h2><p>'+safe(s.monday.slice(3).join(" "))+'</p><h2>Paragraph 3 — Ending</h2><p>'+safe(s.ending.join(" "))+'</p><p><b>Total words:</b> '+wc(story())+'</p><h2>Waterfall Book — Five Scenes</h2><ol>'+s.scenes.map(x=>'<li>'+safe(x)+'</li>').join("")+'</ol><p>Revision completed: '+(s.revised?"Yes":"No")+'</p></body></html>';download("Dreams-Tuesday-Final-"+s.name.replace(/[^a-z0-9_-]/gi,"_")+".doc","\ufeff"+doc,"application/msword;charset=utf-8")}
function exportProgress(){capture();download("Dreams-Tuesday-Progress-"+s.name.replace(/[^a-z0-9_-]/gi,"_")+".json",JSON.stringify({format:"dreams-tuesday-v1",state:s},null,2),"application/json")}
function stopGame(){if(frame)cancelAnimationFrame(frame);frame=0;game=null;keys={}}
function startGame(mode){stopGame();game={mode,x:310,y:300,t:0,score:0,lives:3,things:[],cool:0,done:false};$("gameStatus").textContent=mode==="turkey"?"🦃 Reach the top! Dodge the cars!":mode==="elves"?"🧝 Move and shoot Krampus minions!":"🎅 Jump over obstacles and collect presents!";loop()}
function loop(){if(!game)return;const g=game,c=$("game"),ctx=c.getContext("2d");g.t++;ctx.clearRect(0,0,640,360);ctx.fillStyle=g.mode==="turkey"?"#54784a":g.mode==="elves"?"#172b44":"#6a9dba";ctx.fillRect(0,0,640,360);ctx.font="26px system-ui";ctx.fillStyle="#fff";ctx.fillText("⭐ "+g.score+"    ❤️ "+g.lives,18,35);
if(g.mode==="turkey"){for(let i=0;i<4;i++){ctx.fillStyle=i%2?"#665748":"#535a4c";ctx.fillRect(0,55+i*63,640,46)}if(g.t%40===0)g.things.push({x:-45,y:70+Math.floor(Math.random()*4)*63,v:2+Math.random()*2});if(keys.ArrowLeft&&g.t%6===0)g.x-=26;if(keys.ArrowRight&&g.t%6===0)g.x+=26;if(keys.ArrowUp&&g.t%6===0)g.y-=24;if(keys.ArrowDown&&g.t%6===0)g.y+=24;g.x=Math.max(15,Math.min(605,g.x));g.y=Math.max(40,Math.min(325,g.y));g.things.forEach(o=>{o.x+=o.v;ctx.fillText("🚗",o.x,o.y+22);if(Math.abs(o.x-g.x)<28&&Math.abs(o.y-g.y)<26){g.lives--;g.x=310;g.y=315;o.x=900}});g.things=g.things.filter(o=>o.x<700);ctx.fillText("🦃",g.x,g.y);if(g.y<58){g.score++;g.y=315;g.x=310}}
else if(g.mode==="elves"){if(keys.ArrowLeft)g.x-=4;if(keys.ArrowRight)g.x+=4;g.x=Math.max(15,Math.min(600,g.x));if(keys.Space&&g.cool<=0){g.things.push({x:g.x,y:285,v:-9,shot:true});g.cool=15}if(g.t%35===0)g.things.push({x:Math.random()*580+25,y:45,v:2+Math.random()*2,shot:false});g.cool--;g.things.forEach(o=>{o.y+=o.v;ctx.fillText(o.shot?"✨":"👹",o.x,o.y);if(!o.shot&&o.y>310){g.lives--;o.y=500}if(o.shot)g.things.forEach(e=>{if(!e.shot&&Math.abs(e.x-o.x)<25&&Math.abs(e.y-o.y)<25){g.score++;e.y=500;o.y=-50}})});g.things=g.things.filter(o=>o.y>-30&&o.y<400);ctx.fillText("🧝",g.x,320)}
else{g.x=105;if(keys.Space&&g.y>=290)g.cool=-13;g.cool+=.65;g.y=Math.min(290,g.y+g.cool);if(g.y>=290)g.cool=0;if(g.t%55===0)g.things.push({x:670,y:Math.random()<.45?265:295,v:5});g.things.forEach(o=>{o.x-=o.v;const gift=o.y===265;ctx.fillText(gift?"🎁":"🌲",o.x,o.y+22);if(Math.abs(o.x-g.x)<28&&Math.abs(o.y-g.y)<31){if(gift)g.score++;else g.lives--;o.x=-60}});g.things=g.things.filter(o=>o.x>-40);ctx.fillStyle="#f6f2e2";ctx.fillRect(0,330,640,30);ctx.fillText("🎅",g.x,g.y+22)}
if(g.lives<=0||g.score>=8){$("gameStatus").textContent=g.score>=8?"🏆 YOU WIN! Great job!":"Game over! Try again!";g.done=true;frame=0;return}frame=requestAnimationFrame(loop)}
window.addEventListener("keydown",e=>{if(["ArrowLeft","ArrowRight","ArrowUp","ArrowDown","Space"].includes(e.code)&&game){e.preventDefault();keys[e.code]=true}});window.addEventListener("keyup",e=>keys[e.code]=false);window.addEventListener("pagehide",()=>{"speechSynthesis"in window&&speechSynthesis.cancel();stopGame()});render();
</script></body></html>
