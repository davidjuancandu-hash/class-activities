const items=[["When will the training session begin?",["In the conference room.","At nine thirty.","The new employees."],1],["Who is responsible for the shipment?",["It arrives on Thursday.","In the warehouse.","Ms. Chen from logistics."],2],["Could you send me the revised schedule?",["Of course. I'll email it now.","It's on the second floor.","The meeting was yesterday."],0],["Where can I pick up my visitor badge?",["At eight o'clock.","At the reception desk.","Mr. Park is visiting."],1],["Why was the appointment postponed?",["It was on Monday.","In the main office.","The manager was unavailable."],2],["Have you finished the monthly report?",["Not yet. I'll finish it this afternoon.","At the printer.","The sales department."],0],["How much does delivery cost?",["On Friday.","It's free for orders over fifty dollars.","At the loading dock."],1],["Would you like a window seat?",["The flight was delayed.","At gate six.","Yes, please."],2],["Is the director attending today's meeting?",["She said she would.","At two o'clock.","In the lobby."],0],["Which printer should we use?",["After lunch.","The one near reception.","Because it is broken."],1],["Didn't you receive my email?",["In my inbox.","The new project.","No, could you send it again?"],2],["How long will the repairs take?",["About two hours.","In the maintenance room.","The technician."],0],["Could we move the deadline to Friday?",["The file is attached.","I'll check with the supervisor.","On the desk."],1],["Who ordered the office supplies?",["They arrive tomorrow.","The stationery store.","I believe Carlos did."],2],["Why don't we take a short break?",["That's a good idea.","At the cafeteria.","For fifteen minutes."],0]],KEY='toeic_grade-11-toeic-survival-quest-mission-2_v1',s0={step:0,name:'',section:'',date:new Date().toISOString().slice(0,10),answers:{}};let s={...s0,...JSON.parse(localStorage.getItem(KEY)||'{}')};const $=id=>document.getElementById(id),esc=x=>String(x||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){localStorage.setItem(KEY,JSON.stringify(s))}function speak(){if(!('speechSynthesis'in window)){alert('Ask your teacher to read the question aloud.');return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(items[s.step-1][0]);u.lang='en-US';u.rate=.87;speechSynthesis.speak(u)}function stop(){if('speechSynthesis'in window)speechSynthesis.cancel()}function render(){save();$('bar').style.width=(s.step/(items.length+1)*100)+'%';$('status').textContent=s.step===0?'STUDENT START':s.step<=items.length?'QUESTION '+s.step+' OF '+items.length:'FINAL RESULTS';$('prev').style.display=s.step===0||s.step===items.length+1?'none':'inline-block';$('next').style.display=s.step===items.length+1?'none':'inline-block';$('next').textContent=s.step===items.length?'FINISH + GRADE 🏆':'Continue ▶';let h='';if(s.step===0)h='<h2>Welcome to the challenge!</h2><p>One question at a time. No skipping ahead and no early answer reveals. Listen carefully and eliminate distractors.</p><label>Student name<input id="name" value="'+esc(s.name)+'"></label><label>Class / Section<input id="section" value="'+esc(s.section)+'"></label><label>Date<input type="date" id="date" value="'+esc(s.date)+'"></label><p class="hint">Your progress saves automatically in this browser.</p>';else if(s.step<=items.length){let i=s.step-1,x=items[i];h='<h2>Question '+s.step+'</h2><button onclick="speak()">🔊 PLAY QUESTION AUDIO</button><p><b>'+esc(x[0])+'</b></p>'+x[1].map((v,j)=>'<button class="choice '+(s.answers[i]===j?'selected':'')+'" onclick="choose('+j+')">'+String.fromCharCode(65+j)+'. '+esc(v)+'</button>').join('')+'<p class="muted">Choose one answer. You may go back to previous questions.</p>'}else{let score=items.filter((x,i)=>s.answers[i]===x[2]).length;h='<h2>🏆 Mission complete!</h2><h2>'+score+'/'+items.length+' correct ('+Math.round(score/items.length*100)+'%)</h2><p>'+esc(s.name)+' • '+esc(s.section)+' • '+esc(s.date)+'</p><button onclick="download()">💾 SAVE & DOWNLOAD RESULTS</button><h3>Answer review</h3>'+items.map((x,i)=>'<div class="hint"><b>'+(i+1)+'. '+esc(x[0])+'</b><br>Your answer: '+esc(x[1][s.answers[i]]||'—')+'<br>Correct answer: '+esc(x[1][x[2]])+'</div>').join('')}$('app').innerHTML=h}function choose(j){s.answers[s.step-1]=j;render()}function capture(){if(s.step===0){s.name=$('name').value.trim();s.section=$('section').value.trim();s.date=$('date').value}save()}function next(){capture();stop();if(s.step===0&&(!s.name||!s.section||!s.date)){alert('Enter name, class, and date.');return}if(s.step>0&&s.step<=items.length&&s.answers[s.step-1]===undefined){alert('Select an answer first.');return}s.step++;render();window.scrollTo(0,0)}function back(){capture();stop();s.step=Math.max(0,s.step-1);render()}function download(){let score=items.filter((x,i)=>s.answers[i]===x[2]).length;let t=['MISSION 2 — QUESTION–RESPONSE SPEED CHALLENGE','Student: '+s.name,'Class: '+s.section,'Date: '+s.date,'Score: '+score+'/'+items.length,'',...items.map((x,i)=>(i+1)+'. '+x[0]+' | Answer: '+(x[1][s.answers[i]]||'—')+' | Correct: '+x[1][x[2]])].join('\n');let u=URL.createObjectURL(new Blob([t],{type:'text/plain;charset=utf-8'})),a=document.createElement('a');a.href=u;a.download='TOEIC_grade-11-toeic-survival-quest-mission-2_'+s.name.replace(/[^a-z0-9]/gi,'_')+'.txt';a.click();setTimeout(()=>URL.revokeObjectURL(u),3000)}render();</script></body></html>
