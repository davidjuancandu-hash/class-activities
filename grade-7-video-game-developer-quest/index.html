<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Video Game Developer Quest</title><style> *{box-sizing:border-box}body{margin:0;background:#10152b;color:#f4f5ff;font:18px system-ui}main{max-width:900px;margin:auto;padding:24px}h1{color:#69f5cb;font-size:clamp(30px,6vw,55px);line-height:1.05}h2{color:#ffda79}section{background:#202945;border:1px solid #45517b;border-radius:18px;padding:22px;margin:18px 0}input,textarea,select,button{font:inherit;border-radius:9px;padding:12px}input,textarea,select{width:100%;background:#11182e;color:white;border:1px solid #7784a8;margin:8px 0 18px}textarea{min-height:85px}button{background:#69f5cb;color:#10152b;border:0;font-weight:bold;cursor:pointer;margin:5px}button:disabled{opacity:.4}label{display:block}small{color:#b8c7e7}progress{width:100%;accent-color:#69f5cb}canvas{width:100%;max-width:540px;image-rendering:pixelated;touch-action:none;background:#10182f;border:2px solid #6c83be}#msg{color:#ffda79} .choice{display:block;background:#141c33;padding:8px;margin:8px 0;border-radius:8px}.choice input{width:auto;margin:8px} .tools{display:flex;flex-wrap:wrap} </style><main><small>REFLECT 3 • UNIT 8 • PP. 126 & 128</small><h1>🎮 VIDEO GAME<br>DEVELOPER QUEST</h1><div id="status"></div><progress id="progress" max="6" value="0"></progress><section id="stage"></section><div id="msg" role="alert"></div><div id="nav"></div></main><script>
const $=id=>document.getElementById(id), key='g7-dev-quest-v1';let s={page:0,a:{},away:0,pixels:{},score:0};try{let old=JSON.parse(localStorage.getItem(key));if(old)s=old}catch(e){};let timer=0,gameLoop=0;function save(){try{localStorage.setItem(key,JSON.stringify(s))}catch(e){}}const names=['Studio registration','Gaming boot camp','Invent your game','Hero & boss lab','World builder','Pitch & review','Bonus arcade'];const durations=[0,5,7,10,8,15,5];const questions=[['What does a game developer do?',['Creates video games','Repairs shoes','Sells vegetables'],0],['In the model review, what is the purpose of Wildeverse?',['Teach people about wild animals','Teach cooking','Sell cars'],0],['How do players reach higher levels in Wildeverse?',['Collect animal photos','Build houses','Win races'],0],['What is one disadvantage in the model review?',['Too many animals','Few animals to find','No outdoor exploration'],1],['Which phrase introduces a disadvantage?',['For example','In conclusion','However'],2],['Which phrase ends a review?',['In conclusion','For instance','In addition'],0]];const fields={0:[['team','Student name(s): all developers',1],['section','Class / section',1],['date','Date',1]],2:[['title','Game title',1],['genre','Genre (platformer, adventure, puzzle, racing…)',1],['purpose','What is the purpose of your game? Use “to…”',4],['story','Describe the story in English.',8]],3:[['hero','Describe your hero and special power.',4],['boss','Describe the final boss and its weakness.',4]],4:[['world','Describe your game world.',4],['level','Describe two levels and their challenges.',8],['rules','Explain how players win or lose.',4]],5:[['pro1','For example, one advantage is…',4],['pro2','In addition, another advantage is…',4],['con','However, one disadvantage is…',4],['conclusion','In conclusion, why should people play your game?',4],['peer','After presenting: name another team’s game and one thing you liked.',4]]};function esc(t){return String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function form(p){return (fields[p]||[]).map(([k,l,n])=>`<label>${l}${n>1?` <small>(${n}+ words)</small>`:''}${p===0||n===1?`<input data-k="${k}" value="${esc(s.a[k])}" ${k==='date'?'type="date"':''}>`:`<textarea data-k="${k}">${esc(s.a[k])}</textarea>`}</label>`).join('')};function render(){clearInterval(gameLoop);cancelAnimationFrame(timer);$('status').textContent=`${names[s.page]} • ${s.page}/6 • Tab switches: ${s.away}`;$('progress').value=s.page;let p=s.page,h=`<h2>${names[p]}</h2>${durations[p]?`<p>Suggested time: ${durations[p]} minutes</p>`:''}`;if(p===0)h+=`<p>Choose your studio size. Everyone contributes in English.</p><label>Participation mode<select id="mode">${['Solo Developer','Developer Duo','Gaming Studio','Ultimate Gaming Team'].map((m,i)=>`<option value="${i+1}" ${String(s.a.mode||1)===String(i+1)?'selected':''}>${m} — ${i+1} student${i?'s':''}</option>`).join('')}</select></label><p id="roleHint"></p>`+form(p);if(p===1)h+='<p>Read this model summary: Wildeverse uses augmented reality to help players explore and photograph wild animals. Players learn about wildlife and support conservation. They can interact with a community, but there are relatively few animals and limited information in the model review.</p>'+questions.map(([q,opts],i)=>`<p>${i+1}. ${q}</p>`+opts.map((o,j)=>`<label class="choice"><input type="radio" name="q${i}" data-q="${i}" value="${j}" ${s.a['q'+i]===String(j)?'checked':''}>${o}</label>`).join('')).join('');if(p===2)h+='<p>Choose a genre. Explain the purpose and story aloud before typing (discuss with your team if applicable).</p>'+form(p);if(p===3)h+='<p>Draw a hero and a final boss using the pixel editor. Tap squares to paint.</p>'+['hero','boss'].map(k=>`<h3>${k.toUpperCase()}</h3><div class="tools"><input id="color-${k}" type="color" value="${k==='hero'?'#62efb5':'#ff587e'}" style="width:75px"><button onclick="erase('${k}')">Eraser</button><button onclick="clearArt('${k}')">Clear art</button></div><canvas id="art-${k}" width="240" height="240" style="max-width:240px"></canvas>`).join('')+form(p);if(p===4)h+='<p>Think about obstacles, rewards, enemies and how the player progresses.</p>'+form(p);if(p===5)h+='<p>Prepare your pitch: introduce your game, describe it, explain two pros and one con, and conclude. Use signal words. Every developer speaks, including solo developers. Listen to another studio before finishing.</p>'+form(p);if(p===6)h+=`<p>Academic score: ${questions.filter((q,i)=>String(q[2])===s.a['q'+i]).length}/6. Your creative answers are for teacher review.</p><button onclick="download()">Save & Download report</button><h3>🕹️ Bonus: Meteor Dodge</h3><p>Use arrow keys or touch controls to dodge meteors for 30 seconds.</p><canvas id="arcade" width="360" height="240"></canvas><div><button id="left">◀</button><button id="start">Start game</button><button id="right">▶</button></div><p id="gameInfo">Best survival score: ${s.score}</p>`;$('stage').innerHTML=h;$('nav').innerHTML=`${p>0?'<button onclick="go(-1)">Back</button>':''}${p<6?`<button onclick="go(1)">${p===5?'Finish + Grade':'Next mission'}</button>`:''}`;$('msg').textContent='';document.querySelectorAll('[data-k]').forEach(e=>{e.oninput=()=>{s.a[e.dataset.k]=e.value;save()};e.onpaste=e.oncopy=e.oncut=e=>e.preventDefault()});document.querySelectorAll('[data-q]').forEach(e=>e.onchange=()=>{s.a['q'+e.dataset.q]=e.value;save()});if(p===0){const modes=['','You handle every role. Practice your ideas aloud.','Split design and storytelling; both present.','Assign designer, storyteller and level designer; all present.','Assign designer, storyteller, level designer and pitch leader; all present.'];const update=()=>{s.a.mode=$('mode').value;$('roleHint').textContent=modes[Number(s.a.mode)];save()};$('mode').onchange=update;update()}if(p===3){setupArt('hero');setupArt('boss')}if(p===6)setupGame();save();window.scrollTo(0,0)}function go(d){if(d>0){for(const [k,l,n] of fields[s.page]||[]){if((s.a[k]||'').trim().split(/\s+/).filter(Boolean).length<n){$('msg').textContent='Complete: '+l;return}}if(s.page===1&&questions.some((q,i)=>s.a['q'+i]===undefined)){$('msg').textContent='Answer every question.';return}}s.page=Math.max(0,Math.min(6,s.page+d));render()}function drawArt(k){let c=$('art-'+k),x=c.getContext('2d');for(let i=0;i<144;i++){x.fillStyle=s.pixels[k]?.[i]||((Math.floor(i/12)+i%12)%2?'#28334c':'#36415b');x.fillRect(i%12*20,Math.floor(i/12)*20,20,20)}}function setupArt(k){let c=$('art-'+k);s.pixels[k]??={};drawArt(k);c.onpointerdown=e=>{let r=c.getBoundingClientRect(),i=Math.min(11,Math.floor((e.clientX-r.left)/r.width*12))+12*Math.min(11,Math.floor((e.clientY-r.top)/r.height*12));if(i<0||i>=144)return;let col=$('color-'+k);if(col.dataset.erase==='yes')delete s.pixels[k][i];else s.pixels[k][i]=col.value;drawArt(k);save()};$('color-'+k).oninput=e=>e.target.dataset.erase='no'}function erase(k){$('color-'+k).dataset.erase='yes'}function clearArt(k){if(confirm('Clear this drawing?')){s.pixels[k]={};drawArt(k);save()}}function download(){let rows='<h3>Participation mode</h3><p>'+esc(['','Solo Developer','Developer Duo','Gaming Studio','Ultimate Gaming Team'][Number(s.a.mode||1)])+'</p>'+Object.values(fields).flat().map(([k,l])=>`<h3>${esc(l)}</h3><p>${esc(s.a[k])}</p>`).join('');let art=['hero','boss'].map(k=>`<h3>${k}</h3><table style="border-collapse:collapse">${Array.from({length:12},(_,y)=>'<tr>'+Array.from({length:12},(_,x)=>`<td style="width:16px;height:16px;background:${s.pixels[k]?.[y*12+x]||'#ddd'}"></td>`).join('')+'</tr>').join('')}</table>`).join('');let quiz=questions.map(([q,o,a],i)=>`<p>${esc(q)} — ${esc(o[Number(s.a['q'+i])])} (${String(a)===s.a['q'+i]?'correct':'incorrect'})</p>`).join('');let blob=new Blob(['<!doctype html><meta charset="utf-8"><title>Quest report</title><h1>Video Game Developer Quest</h1><p>Tab switches: '+s.away+'</p><p>Quiz: '+questions.filter((q,i)=>String(q[2])===s.a['q'+i]).length+'/6</p>'+rows+art+quiz],{type:'text/html'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='Game-Quest-'+(s.a.team||'team').replace(/[^a-z0-9]+/gi,'-')+'.html';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}let dir=0;window.addEventListener('keydown',e=>{if(s.page===6&&['ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();dir=e.key==='ArrowLeft'?-1:1}});window.addEventListener('keyup',e=>{if(['ArrowLeft','ArrowRight'].includes(e.key))dir=0});function setupGame(){const c=$('arcade'),x=c.getContext('2d');let px=180,rocks=[],t=0;function paint(){x.fillStyle='#10182f';x.fillRect(0,0,360,240);x.fillStyle='#69f5cb';x.fillRect(px-12,210,24,16);x.fillStyle='#ff738b';rocks.forEach(r=>x.fillRect(r.x,r.y,18,18))}paint();for(const [k,d] of [['left',-1],['right',1]]){$(k).onpointerdown=e=>{e.target.setPointerCapture(e.pointerId);dir=d};$(k).onpointerup=$(k).onpointercancel=()=>dir=0}$('start').onclick=()=>{clearInterval(gameLoop);px=180;rocks=[];t=0;gameLoop=setInterval(()=>{t++;px=Math.max(12,Math.min(348,px+dir*5));if(t%18===0)rocks.push({x:Math.random()*342,y:-18});rocks.forEach(r=>r.y+=3+t/400);rocks=rocks.filter(r=>r.y<250);paint();let hit=rocks.some(r=>r.y+18>210&&r.y<226&&r.x+18>px-12&&r.x<px+12);$('gameInfo').textContent='Survived '+Math.floor(t/30)+' seconds';if(hit||t>=900){clearInterval(gameLoop);s.score=Math.max(s.score,Math.floor(t/30));save();$('gameInfo').textContent=(hit?'Meteor hit! ':'Mission complete! ')+'Best: '+s.score+' seconds'}},1000/30)}}document.addEventListener('visibilitychange',()=>{if(document.hidden&&s.page>0&&s.page<6){s.away++;s.page=Math.max(0,s.page-1);save();try{let a=new AudioContext(),o=a.createOscillator();o.type='sawtooth';o.frequency.value=170;o.connect(a.destination);o.start();o.stop(a.currentTime+.3)}catch(e){}render()}else if(document.hidden)clearInterval(gameLoop)});render();</script></html>
