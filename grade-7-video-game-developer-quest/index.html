function step(){tick++;p.cd=Math.max(0,p.cd-1);p.hurt=Math.max(0,p.hurt-1);let move=(keys.right?1:0)-(keys.left?1:0);p.moving=!!move;if(move)p.face=move;p.x=clamp(p.x+move*4.4,0,W-p.w);if(keys.jump&&p.ground){p.vy=-13;p.ground=false}let prev=p.y+p.h;p.vy+=.65;p.y+=p.vy;p.ground=false;let surfaces=platforms.filter(([x,y,w])=>p.x+p.w>x&&p.x<x+w);if(!pits.some(([a,b])=>p.x+p.w/2>a&&p.x+p.w/2<b))surfaces.push([0,G,W]);for(const [x,y,w] of surfaces.sort((a,b)=>a[1]-b[1]))if(p.vy>=0&&prev<=y+1&&p.y+p.h>=y){p.y=y-p.h;p.vy=0;p.ground=true;break}if(p.y>390){p.hurt=0;damage();p.x=Math.max(60,p.x-180);p.y=180;p.vy=0}
if(keys.fire&&!p.cd){p.cd=24;shots.push({x:p.x+p.w/2,y:p.y+24,w:15,h:12,v:p.face*9})}
for(const q of loot)if(!q.got&&over(p,q)){q.got=true;coins++;if(coins%15===0)hp=Math.min(5,hp+1)}
for(const e of foes){if(e.hp<=0)continue;e.cd=Math.max(0,e.cd-1);e.hurt=Math.max(0,e.hurt-1);let dist=p.x-e.x;e.face=Math.abs(dist)<300?Math.sign(dist)||1:Math.sign(e.home-e.x)||1;e.moving=Math.abs(dist)<300&&Math.abs(dist)>45;if(e.moving)e.x=clamp(e.x+e.face*(e.boss?1.15:1.5),e.home-75,e.home+75);if(over(p,e))damage();if(e.boss&&Math.abs(dist)<420&&!e.cd){e.cd=85-level*12;for(let v of [-1,0,1])bolts.push({x:e.x+e.w/2,y:e.y+35,w:16,h:16,v:e.face*4.5,vy:v*1.5})}}
for(const q of shots){q.x+=q.v;for(const e of foes)if(!q.dead&&e.hp>0&&over(q,e)){q.dead=true;e.hp--;e.hurt=12;burst(q.x,q.y);if(e.hp===0)coins+=e.boss?10:2}}
for(const q of bolts){q.x+=q.v;q.y+=q.vy;if(!q.dead&&over(q,p)){q.dead=true;damage()}}shots=shots.filter(q=>!q.dead&&Math.abs(q.x-p.x)<850);bolts=bolts.filter(q=>!q.dead&&Math.abs(q.x-p.x)<850&&q.y>0&&q.y<360);fx=fx.filter(e=>tick-e.t<30);cam=clamp(p.x-230,0,W-720);
if(foes.at(-1).hp<=0&&p.x>2660&&running){if(level===2)finish(true);else{level++;hp=Math.min(5,hp+1);init();status.textContent='World '+(level+1)+' unlocked!'}}}
function box(x,y,w,h,col){c.fillStyle=col;c.fillRect(x,y,w,h)}
function label(t,x,y,col='#fff',size=16){c.fillStyle=col;c.font='bold '+size+'px monospace';c.fillText(t,x,y)}
function sprite(o,enemy){let pack=window.questArt,choice=s.spriteLab?.[enemy?'boss':'hero'],list=enemy?pack?.bosses:pack?.heroes,entry=list?.[enemy&&!o.boss?(o.i||0)%list.length:choice?.i||0]||list?.[0];let action=o.cd>0?'attack':o.moving?'walk':o.vy<0?'jump':'idle',seq=entry?.anim[action]||entry?.anim.idle,im=seq?.length&&questImage(seq[Math.floor(tick/6)%seq.length]);let x=o.x-cam;if(im){let hh=o.boss?150:enemy?80:105,w=hh*im.width/im.height;c.save();c.translate(x+o.w/2,o.y+o.h);c.scale(o.face||1,1);c.filter='hue-rotate('+(choice?.hue||0)+'deg)'+(o.hurt&&tick%6<3?' brightness(2)':'');c.drawImage(im,-w/2,-hh,w,hh);c.restore()}else{box(x,o.y,o.w,o.h,enemy?'#ed646c':'#65f5d0');box(x+7,o.y+9,18,7,'#fff')}}
function paint(){let bg=window.questArt?.backgrounds?.[[8,0,4][level]],im=bg&&questImage(bg.src);box(0,0,720,360,['#244d48','#454057','#512d38'][level]);if(im){let w=Math.max(720,360*im.width/im.height),off=(cam*.28)%w;c.drawImage(im,-off,0,w,360);c.drawImage(im,w-off,0,w,360)}for(const [a,b] of [[0,700],[800,1480],[1600,W]]){box(a-cam,G,b-a,54,'#302b43');box(a-cam,G,b-a,7,'#9aaf7f');for(let i=a;i<b;i+=36)box(i-cam,G+12,32,12,'#49435b')}for(const [x,y,w] of platforms){box(x-cam,y,w,14,'#615b76');box(x-cam,y,w,4,'#d4b17a')}for(const q of loot)if(!q.got){c.fillStyle='#ffda63';c.beginPath();c.ellipse(q.x+9-cam,q.y+9,4+Math.abs(Math.sin(tick/8))*5,9,0,0,7);c.fill()}for(const e of foes)if(e.hp>0){sprite(e,true);if(e.boss){box(e.x-cam,e.y-26,80,7,'#23182d');box(e.x-cam,e.y-26,80*e.hp/e.max,7,'#ff547a')}}sprite(p,false);for(const q of [...shots,...bolts]){c.fillStyle=shots.includes(q)?'#7dfff1':'#ff7755';c.beginPath();c.arc(q.x-cam,q.y,8,0,7);c.fill()}for(const e of fx){let im=window.questArt&&questImage(questArt.explosions[Math.floor((tick-e.t)/3)]);if(im)c.drawImage(im,e.x-cam-24,e.y-24,48,48);else label('✦',e.x-cam,e.y,'#ffdf76',28)}box(0,0,720,43,'#111527');label(levels[level],12,26,'#a5ffe5');label('HP '+ '♥'.repeat(Math.max(0,hp)),340,26,'#ff7790');label('GOLD '+coins,585,26,'#ffda63');label(foes.at(-1).hp>0?'Defeat the guardian →':'Exit open! →',460,65,'#fff',14);box(2740-cam,225,26,81,foes.at(-1).hp>0?'#6b344b':'#65ffba');if(!running){box(105,122,510,105,'#111527');label(won?'WORLD CHAMPION!':hp<=0?'GAME OVER':'PIXEL QUEST',190,164,'#ffda63',28);label('Press START / RETRY',225,201,'#a5ffe5',19)}}
function loop(now){if(!running||!pane.isConnected||document.hidden){running=false;return}if(!last)last=now;acc+=Math.min(80,now-last);last=now;while(acc>=1000/60&&running){step();acc-=1000/60}paint();if(running)raf=requestAnimationFrame(loop)}
const map={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'jump',' ':'fire',a:'left',d:'right',w:'jump',f:'fire'};function down(e){if(map[e.key]&&!/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)){e.preventDefault();keys[map[e.key]]=true}}function up(e){if(map[e.key])keys[map[e.key]]=false}function pause(){if(running){running=false;cancelAnimationFrame(raf);keys={};status.textContent='Paused — press START to retry.'}}function vis(){if(document.hidden)pause()}window.addEventListener('keydown',down);window.addEventListener('keyup',up);window.addEventListener('blur',pause);document.addEventListener('visibilitychange',vis);pane.querySelectorAll('[data-adv]').forEach(b=>{let a=b.dataset.adv;if(a==='start'){b.onclick=start;return}b.onpointerdown=e=>{e.preventDefault();b.setPointerCapture(e.pointerId);keys[a]=true};b.onpointerup=b.onpointercancel=b.onlostpointercapture=()=>keys[a]=false});cleanup=()=>{running=false;cancelAnimationFrame(raf);window.removeEventListener('keydown',down);window.removeEventListener('keyup',up);window.removeEventListener('blur',pause);document.removeEventListener('visibilitychange',vis);pane.remove()};init();paint()}
function mount(){let root=document.getElementById('retro'),picks=document.getElementById('picks');if(!root||!picks||picks.hidden||s.breakPage)return;let btn=document.createElement('button');btn.textContent='Pixel Quest Adventure';btn.className='gamepick';let elems=[...root.children].filter(x=>x!==picks);for(let old of picks.children)old.addEventListener('click',()=>{cleanup();btn.classList.remove('active');elems.forEach(e=>e.style.display='')});btn.onclick=()=>{if(document.getElementById('pixelAdventure'))return;let active=picks.querySelector('.active');if(active&&active!==btn)active.click();for(let e of picks.children)e.classList.toggle('active',e===btn);elems.forEach(e=>e.style.display='none');launch()};picks.append(btn)}
const old=render;render=function(){cleanup();old();mount()};mount();
})();
