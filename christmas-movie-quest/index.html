<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Christmas Movie Quest | Grades 6–7</title><style>
:root{--red:#d72f46;--gold:#ffd46d;--ink:#102c32;--ice:#d9faff}*{box-sizing:border-box}body{margin:0;font-family:system-ui,Arial,sans-serif;color:white;background:radial-gradient(circle at 20% 10%,#275b60,#0b1d2d 70%);min-height:100vh}header{background:#091824d9;border-bottom:3px solid var(--gold);padding:13px 20px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}.logo{font-weight:900;color:var(--gold);font-size:1.25rem}.pill{border:1px solid #6da0a5;border-radius:30px;padding:6px 12px;font-size:.85rem}main{max-width:880px;margin:25px auto;padding:0 16px}.panel{background:#102d3eea;border:1px solid #58818a;border-radius:22px;padding:24px;box-shadow:0 12px 40px #0005}h1{font-size:clamp(1.8rem,5vw,3rem);margin:0 0 12px;color:var(--gold)}h2{color:var(--gold)}p{line-height:1.55}button,select,input,textarea{font:inherit}button{background:var(--gold);border:0;color:#17232b;padding:12px 20px;border-radius:12px;font-weight:800;cursor:pointer}button:disabled{opacity:.4;cursor:not-allowed}.secondary{background:#325967;color:white;border:1px solid #9abdc3}.danger{background:var(--red);color:white}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}input,select,textarea{width:100%;background:#e9f8f7;color:#12212a;border:2px solid #84b1b3;padding:12px;border-radius:10px;margin:6px 0 13px}label{font-weight:700}video{width:100%;border-radius:12px;background:#000;max-height:470px}.option{display:block;width:100%;margin:9px 0;text-align:left;background:#254b5d;color:#fff;border:2px solid #4e7d8b}.option.selected{border-color:var(--gold);background:#4b6871}.small{font-size:.85rem;color:#c3d9dd}.progress{height:12px;background:#31505c;border-radius:20px;overflow:hidden;margin:12px 0}.progress>div{height:100%;background:linear-gradient(90deg,#fa6376,var(--gold));transition:width .3s}.hidden{display:none!important}.badge{display:inline-block;padding:5px 10px;border-radius:30px;background:#365b69;margin:4px}.gamegrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.tile{min-height:78px;font-size:2rem;background:#386171;color:#fff}.tile.revealed,.tile.matched{background:#f6d47b;color:#142832}.arena{height:270px;position:relative;overflow:hidden;border:3px solid #b5e5e6;border-radius:15px;background:linear-gradient(#214767 0 62%,#eef5ff 62% 100%);touch-action:manipulation}.arena .target{position:absolute;font-size:40px;cursor:pointer;user-select:none;touch-action:manipulation}.notice{padding:12px;background:#573442;border-left:5px solid var(--gold);border-radius:8px;margin:14px 0}.stat{font-size:1.15rem;font-weight:800;color:var(--gold)}@media(max-width:500px){.panel{padding:16px}.gamegrid{gap:5px}.tile{min-height:65px}}@media print{body{background:white;color:black}.panel{box-shadow:none;color:black}button,video{display:none}}</style></head><body><header><div class="logo">🎄 CHRISTMAS MOVIE QUEST 👹</div><div><span class="pill" id="clock">⏱ 60:00</span> <span class="pill" id="stage">Mission 0/9</span> <span class="pill" id="away">🚨 0</span></div></header><main><div class="progress"><div id="bar" style="width:0%"></div></div><section class="panel" id="content"></section></main><script>
const KEY='christmas_movie_quest_grade7_hour_v2';let S={step:0,name:'',grade:'6',section:'',date:new Date().toISOString().slice(0,10),answers:{},clicks:0,elapsed:0,watched:0,videoDone:false,segment:0,checkpointAnswers:{},game1:false,game2:false,started:false,finished:false};try{let p=JSON.parse(localStorage.getItem(KEY));if(p)S={...S,...p}}catch{}let stage=document.getElementById('stage'),el=document.getElementById('content'),clock=document.getElementById('clock');const steps=['Welcome','Video Countdown','Movie Detectives','Character Challenge','Christmas Opinions','Memory Match','Krampus Snowball Dash','Final Movie Vote','Finish & Download'];let maxVideo=Number(S.watched)||0;function save(){localStorage.setItem(KEY,JSON.stringify(S))}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function sound(){try{let c=new (window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.type='sawtooth';o.frequency.setValueAtTime(320,c.currentTime);o.frequency.linearRampToValueAtTime(110,c.currentTime+.5);g.gain.value=.22;o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+.6)}catch{}}function top(){stage.textContent=`Mission ${S.step+1}/9 · ${steps[S.step]}`;document.getElementById('bar').style.width=(S.step/8*100)+'%';document.getElementById('away').textContent='🚨 '+S.clicks}function navButtons(back=true,next=true,nextText='Next Mission ➜'){return `<div class="actions">${back?'<button class="secondary" onclick="back()">← Previous</button>':''}${next?`<button onclick="next()">${nextText}</button>`:''}</div>`}function back(){if(S.step>0){S.step--;save();render()}}function next(){if(S.step===0){let n=document.getElementById('student').value.trim(),sec=document.getElementById('section').value.trim();if(!n||!sec){alert('Enter your name and class/section.');return}S.name=n;S.section=sec;S.grade=document.getElementById('grade').value;S.date=document.getElementById('date').value;S.started=true}if(S.step===1){let target=(Math.min(3,S.segment||0)+1)*((video&&video.duration)||646)/4;if(S.watched<target-1||S.checkpointAnswers[S.segment]===undefined){alert('Watch this video chapter and answer its checkpoint question first.');return}if(S.segment<3){S.segment++;save();render();return}S.videoDone=true}if(S.step===2||S.step===3){let ids=S.step===2?['q1','q2','q3']:['q4','q5','q6'];if(ids.some(id=>S.answers[id]===undefined)){alert('Choose an answer for every question.');return}}if(S.step===4){let t=document.getElementById('opinion').value.trim();if(t.split(/\s+/).filter(Boolean).length<4){alert('Write at least four words.');return}S.answers.opinion=t}if(S.step===5&&!S.game1){alert('Match all the pairs first!');return}if(S.step===6&&!S.game2){alert('Complete the Krampus arcade challenge first!');return}if(S.step===7){if(!S.answers.vote){alert('Choose your favorite movie!');return}S.finished=true}S.step=Math.min(8,S.step+1);save();render()}const qs={q1:{q:'What kind of video did you watch?',a:['A movie ranking countdown','A cooking tutorial','A weather report'],correct:0},q2:{q:'Which movie appears in the countdown?',a:['The Nightmare Before Christmas','Jurassic Park','The Lion King'],correct:0},q3:{q:'What is the main theme shared by the movies?',a:['Christmas and the holiday season','Summer vacations','Space travel'],correct:0},q4:{q:'Which green character appears in the countdown?',a:['Shrek','The Grinch','Hulk'],correct:1},q5:{q:'Which movie features a magical train?',a:['The Polar Express','Cars','Finding Nemo'],correct:0},q6:{q:'Which skill helps you understand a movie ranking?',a:['Listening for movie titles and opinions','Ignoring the narrator','Skipping the video'],correct:0}};function question(id){let q=qs[id];return `<div style="margin:20px 0"><strong>${esc(q.q)}</strong>${q.a.map((a,i)=>`<button class="option ${S.answers[id]===i?'selected':''}" onclick="pick('${id}',${i})">${String.fromCharCode(65+i)}. ${esc(a)}</button>`).join('')}</div>`}function pick(id,i){S.answers[id]=i;save();render()}let video=null;function render(){top();if(S.step===0){el.innerHTML=`<h1>🎅 Christmas Movie Quest!</h1><p>Welcome, movie detectives! Watch a Christmas Top 10 countdown in FOUR video chapters, solve holiday mysteries, and beat Krampus in two mini-games.</p><div class="notice">🚨 Switching tabs or hiding the page triggers a horn and sends you back one mission. Your click-away count appears in your report. Progress saves automatically on this device.</div><label>Student name</label><input id="student" value="${esc(S.name)}" placeholder="First and last name"><label>Grade</label><select id="grade"><option value="6" ${S.grade==='6'?'selected':''}>Grade 6</option><option value="7" ${S.grade==='7'?'selected':''}>Grade 7</option></select><label>Class / Section</label><input id="section" value="${esc(S.section)}" placeholder="6A, 7B..."><label>Date</label><input id="date" type="date" value="${esc(S.date)}">${navButtons(false,true,'Start Christmas Mission 🎄')}`}
else if(S.step===1){let checkpoints=[{q:'What is the purpose of this video?',a:['To rank Christmas movies','To explain Christmas recipes','To teach winter sports']},{q:'What makes a movie ranking convincing?',a:['Good reasons and examples','Only loud music','Skipping the ending']},{q:'What clues help you identify a movie?',a:['Characters, scenes and titles','The video player buttons','The weather']},{q:'Which is the strongest movie recommendation?',a:['I like it because the characters are funny','It is good','I do not know']}];let seg=Math.min(3,S.segment||0),cp=checkpoints[seg],gate=S.checkpointAnswers[seg]!==undefined;el.innerHTML=`<h1>🎬 Video Chapter ${seg+1} of 4</h1><p>Watch the next part of the movie countdown. The video pauses automatically at each checkpoint. Discuss what you noticed with a partner.</p><video id="movie" controls controlsList="nodownload noplaybackrate" playsinline preload="metadata"><source src="christmas-countdown.mp4" type="video/mp4"></video><p class="small" id="watchstatus">Watched: ${Math.floor(S.watched)} seconds</p><div id="checkpoint"></div>${navButtons(true,true,'Continue Mission ➜')}`;video=document.getElementById('movie');let checkpoint=document.getElementById('checkpoint');let chapterEnd=(seg+1)*161.5;function showGate(){video.pause();checkpoint.innerHTML=`<div class="notice"><h2>🔒 Chapter ${seg+1} checkpoint</h2><p>Talk with a partner, then choose an answer.</p><strong>${cp.q}</strong>${cp.a.map((a,i)=>`<button class="option ${S.checkpointAnswers[seg]===i?'selected':''}" onclick="S.checkpointAnswers[${seg}]=${i};save();render()">${String.fromCharCode(65+i)}. ${a}</button>`).join('')}${gate?'<p class="stat">✓ Checkpoint complete! Continue to the next chapter.</p>':''}</div>`;}video.addEventListener('loadedmetadata',()=>{chapterEnd=Math.min(video.duration,(seg+1)*video.duration/4);maxVideo=Math.max(maxVideo,Number(S.watched)||0);video.currentTime=Math.min(maxVideo,chapterEnd);if(maxVideo>=chapterEnd-0.5)showGate()});video.addEventListener('timeupdate',()=>{if(video.currentTime>maxVideo+1.3){video.currentTime=maxVideo;return}if(video.currentTime>maxVideo){maxVideo=video.currentTime;S.watched=maxVideo;if(Math.floor(maxVideo)%4===0)save()}if(video.currentTime>=chapterEnd-0.4){maxVideo=Math.max(maxVideo,chapterEnd);S.watched=maxVideo;save();showGate()}document.getElementById('watchstatus').textContent=`Video progress: ${Math.floor(maxVideo)} / ${Math.floor(video.duration||646)} seconds`});video.addEventListener('seeking',()=>{if(video.currentTime>Math.min(maxVideo+0.5,chapterEnd))video.currentTime=Math.min(maxVideo,chapterEnd)});video.addEventListener('ended',()=>{maxVideo=video.duration;S.watched=maxVideo;showGate()});if(gate)showGate()}
else if(S.step===2){el.innerHTML=`<h1>🔎 Mission 2: Movie Detectives</h1><p>Answer all three questions. No correctness hints until the final report!</p>${question('q1')}${question('q2')}${question('q3')}${navButtons()}`}
else if(S.step===3){el.innerHTML=`<h1>🎭 Mission 3: Character Challenge</h1><p>${S.grade==='6'?'Recognize the movies and their characters.':'Listen and think about the movies and the narrator’s ranking.'}</p>${question('q4')}${question('q5')}${question('q6')}${navButtons()}`}
else if(S.step===4){el.innerHTML=`<h1>💬 Mission 4: Movie Critic</h1><p>${S.grade==='6'?'Which Christmas movie would you like to watch? Explain why.':'Do you agree with the countdown ranking? Explain which movie deserves the top spot and why.'}</p><label>Your opinion (at least 4 words)</label><textarea id="opinion" rows="5" placeholder="I would choose ... because ...">${esc(S.answers.opinion||'')}</textarea><p class="small">Discuss your favorite movie, one surprising movie, and one movie you disagree with. Speak for 2 minutes before writing.</p>${navButtons()}`}
else if(S.step===5){el.innerHTML=`<h1>🧠 Mission 5: Krampus Memory Match</h1><p>Match all six Christmas picture pairs to unlock the next mission.</p><p class="stat" id="moves">Moves: 0</p><div class="gamegrid" id="memory"></div>${navButtons()}`;initMemory()}
else if(S.step===6){el.innerHTML=`<h1>👹 Mission 6: Krampus Snowball Dash!</h1><p>Tap the mischievous Krampus 👹 to score points. Avoid Santa 🎅! Score 12 points before the 60-second round ends.</p><div class="row"><span class="badge" id="gscore">Score: 0 / 12</span><span class="badge" id="gtime">Time: 60s</span></div><div class="arena" id="arena"></div><div class="actions"><button id="startgame" onclick="startArcade()">▶ Start arcade game</button></div><p class="small">Touchscreen and mouse friendly. If time runs out, try again.</p>${navButtons()}`;if(S.game2)document.getElementById('arena').innerHTML='<h2 style="text-align:center;margin-top:95px">🏆 Krampus defeated!</h2>'}
else if(S.step===7){el.innerHTML=`<h1>🏆 Mission 7: The Ultimate Christmas Vote</h1><p>Choose the Christmas movie you would recommend to your friends.</p>${['The Nightmare Before Christmas','The Grinch','The Polar Express','A Charlie Brown Christmas','Another movie from the countdown'].map(x=>`<button class="option ${S.answers.vote===x?'selected':''}" onclick="S.answers.vote='${x.replace(/'/g,"\\'")}';save();render()">🎬 ${esc(x)}</button>`).join('')}<p class="small">Discuss your choice with a partner before finishing.</p>${navButtons(true,true,'Finish & Grade 🎁')}`}
else{let score=Object.keys(qs).filter(k=>S.answers[k]===qs[k].correct).length;el.innerHTML=`<h1>🎉 Mission Complete!</h1><p class="stat">${esc(S.name)} · Grade ${esc(S.grade)} · ${esc(S.section)}</p><h2>Trivia score: ${score} / 6</h2><p>🧠 Memory: ${S.game1?'Complete':'Incomplete'} · 👹 Krampus: ${S.game2?'Defeated':'Incomplete'}</p><p>🚨 Click-away count: <strong>${S.clicks}</strong></p><p>⏱ Lesson time: ${Math.floor(S.elapsed/60)}m ${S.elapsed%60}s</p><div class="actions"><button onclick="download()">💾 Save & Download Report</button><button class="secondary" onclick="back()">← Review</button></div><p class="small">The report includes your video chapter answers, all trivia, and your teacher's grading information.</p>`}}
let mem=[],open=[],moves=0,memLock=false;function initMemory(){if(S.game1){document.getElementById('memory').innerHTML='<h2>🎉 All pairs matched!</h2>';return}let icons=['🎅','🎄','👹','🎁','🦌','⛄'];mem=[...icons,...icons].sort(()=>Math.random()-.5).map((v,i)=>({v,i,matched:false}));drawMem()}function drawMem(){document.getElementById('moves').textContent=`Moves: ${moves}`;document.getElementById('memory').innerHTML=mem.map((m,i)=>`<button class="tile ${m.matched?'matched':open.includes(i)?'revealed':''}" onclick="flip(${i})">${m.matched||open.includes(i)?m.v:'❄️'}</button>`).join('')}function flip(i){if(memLock||mem[i].matched||open.includes(i))return;open.push(i);drawMem();if(open.length===2){moves++;if(mem[open[0]].v===mem[open[1]].v){mem[open[0]].matched=mem[open[1]].matched=true;open=[];if(mem.every(x=>x.matched)){S.game1=true;save();setTimeout(render,400)}else drawMem()}else{memLock=true;setTimeout(()=>{open=[];memLock=false;if(S.step===5)drawMem()},850)}}}
let gameTimer=null,spawnTimer=null,points=0,seconds=60;function stopGame(){clearInterval(gameTimer);clearInterval(spawnTimer);gameTimer=null;spawnTimer=null}function spawn(){let a=document.getElementById('arena');if(!a)return;a.innerHTML='';let t=document.createElement('button');t.className='target';let krampus=Math.random()>.25;t.textContent=krampus?'👹':'🎅';t.style.left=Math.floor(Math.random()*80+4)+'%';t.style.top=Math.floor(Math.random()*65+5)+'%';t.style.border='none';t.style.background='transparent';t.onclick=()=>{if(krampus)points++;else points=Math.max(0,points-2);document.getElementById('gscore').textContent=`Score: ${points} / 12`;if(points>=12){stopGame();S.game2=true;save();render()}else spawn()};a.appendChild(t)}function startArcade(){if(gameTimer)return;points=0;seconds=60;document.getElementById('startgame').disabled=true;spawn();spawnTimer=setInterval(spawn,1350);gameTimer=setInterval(()=>{seconds--;let t=document.getElementById('gtime');if(t)t.textContent=`Time: ${seconds}s`;if(seconds<=0){stopGame();if(S.step===6){document.getElementById('arena').innerHTML='<h2 style="text-align:center;margin-top:90px">⏰ Time up! Try again.</h2>';document.getElementById('startgame').disabled=false}}},1000)}
function download(){let score=Object.keys(qs).filter(k=>S.answers[k]===qs[k].correct).length;let lines=[`CHRISTMAS MOVIE QUEST — STUDENT REPORT`,`Name: ${S.name}`,`Grade: ${S.grade}`,`Section: ${S.section}`,`Date: ${S.date}`,`Lesson duration: ${Math.floor(S.elapsed/60)}m ${S.elapsed%60}s`,`Click-away count: ${S.clicks}`,`Video completed: ${S.videoDone?'Yes':'No'}`,`Trivia score: ${score}/6`,`Video checkpoints: ${Object.values(S.checkpointAnswers).length}/4`,`Memory game: ${S.game1?'Complete':'Incomplete'}`,`Krampus arcade: ${S.game2?'Complete':'Incomplete'}`,'',...Object.entries(qs).map(([id,q])=>`${q.q}\nStudent answer: ${q.a[S.answers[id]]??'No answer'}\nCorrect answer: ${q.a[q.correct]}\n`),`Written opinion: ${S.answers.opinion||''}`,`Favorite movie: ${S.answers.vote||''}`];let blob=new Blob([lines.join('\n')],{type:'text/plain'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=`Christmas_Movie_Quest_${S.name.replace(/[^a-z0-9]/gi,'_')}.txt`;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
setInterval(()=>{if(S.started&&!S.finished){S.elapsed++;clock.textContent=`⏱ ${Math.max(0,60*60-S.elapsed)>0?`${String(Math.floor((3600-S.elapsed)/60)).padStart(2,'0')}:${String((1500-S.elapsed)%60).padStart(2,'0')}`:'TIME UP'}`;if(S.elapsed===3600)sound();if(S.elapsed%5===0)save()}},1000);let lastAway=0;document.addEventListener('visibilitychange',()=>{if(document.hidden&&S.started&&!S.finished&&Date.now()-lastAway>1500){lastAway=Date.now();S.clicks++;S.step=Math.max(0,S.step-1);stopGame();save();sound();}else if(!document.hidden){render();if(S.started&&!S.finished&&S.clicks){} }});document.addEventListener('paste',e=>{if(['TEXTAREA','INPUT'].includes(e.target.tagName))e.preventDefault()});document.addEventListener('copy',e=>{if(e.target.closest('main'))e.preventDefault()});render();
</script></body></html>
