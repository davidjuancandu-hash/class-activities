<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Christmas Movie Quest | Grades 6–7</title><style>
:root{--red:#d72f46;--gold:#ffd46d;--ink:#102c32;--ice:#d9faff}*{box-sizing:border-box}body{margin:0;font-family:system-ui,Arial,sans-serif;color:white;background:radial-gradient(circle at 20% 10%,#275b60,#0b1d2d 70%);min-height:100vh}header{background:#091824d9;border-bottom:3px solid var(--gold);padding:13px 20px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}.logo{font-weight:900;color:var(--gold);font-size:1.25rem}.pill{border:1px solid #6da0a5;border-radius:30px;padding:6px 12px;font-size:.85rem}main{max-width:880px;margin:25px auto;padding:0 16px}.panel{background:#102d3eea;border:1px solid #58818a;border-radius:22px;padding:24px;box-shadow:0 12px 40px #0005}h1{font-size:clamp(1.8rem,5vw,3rem);margin:0 0 12px;color:var(--gold)}h2{color:var(--gold)}p{line-height:1.55}button,select,input,textarea{font:inherit}button{background:var(--gold);border:0;color:#17232b;padding:12px 20px;border-radius:12px;font-weight:800;cursor:pointer}button:disabled{opacity:.4;cursor:not-allowed}.secondary{background:#325967;color:white;border:1px solid #9abdc3}.danger{background:var(--red);color:white}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}input,select,textarea{width:100%;background:#e9f8f7;color:#12212a;border:2px solid #84b1b3;padding:12px;border-radius:10px;margin:6px 0 13px}label{font-weight:700}video{width:100%;border-radius:12px;background:#000;max-height:470px}.option{display:block;width:100%;margin:9px 0;text-align:left;background:#254b5d;color:#fff;border:2px solid #4e7d8b}.option.selected{border-color:var(--gold);background:#4b6871}.small{font-size:.85rem;color:#c3d9dd}.progress{height:12px;background:#31505c;border-radius:20px;overflow:hidden;margin:12px 0}.progress>div{height:100%;background:linear-gradient(90deg,#fa6376,var(--gold));transition:width .3s}.hidden{display:none!important}.badge{display:inline-block;padding:5px 10px;border-radius:30px;background:#365b69;margin:4px}.gamegrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.tile{min-height:78px;font-size:2rem;background:#386171;color:#fff}.tile.revealed,.tile.matched{background:#f6d47b;color:#142832}.arena{height:270px;position:relative;overflow:hidden;border:3px solid #b5e5e6;border-radius:15px;background:linear-gradient(#214767 0 62%,#eef5ff 62% 100%);touch-action:manipulation}.arena .target{position:absolute;font-size:40px;cursor:pointer;user-select:none;touch-action:manipulation}.notice{padding:12px;background:#573442;border-left:5px solid var(--gold);border-radius:8px;margin:14px 0}.stat{font-size:1.15rem;font-weight:800;color:var(--gold)}@media(max-width:500px){.panel{padding:16px}.gamegrid{gap:5px}.tile{min-height:65px}}@media print{body{background:white;color:black}.panel{box-shadow:none;color:black}button,video{display:none}}</style></head><body><header><div class="logo">🎄 CHRISTMAS MOVIE QUEST 👹</div><div><span class="pill" id="clock">⏱ 60:00</span> <span class="pill" id="stage">Mission 0/9</span> <span class="pill" id="away">🚨 0</span></div></header><main><div class="progress"><div id="bar" style="width:0%"></div></div><section class="panel" id="content"></section></main><script>
const KEY='christmas_movie_quest_grade7_tenmovies_v5';let S={step:0,name:'',grade:'6',section:'',date:new Date().toISOString().slice(0,10),answers:{},clicks:0,elapsed:0,watched:0,videoDone:false,segment:0,checkpointAnswers:{},game1:false,game2:false,started:false,finished:false};try{let p=JSON.parse(localStorage.getItem(KEY));if(p)S={...S,...p}}catch{}let stage=document.getElementById('stage'),el=document.getElementById('content'),clock=document.getElementById('clock');const steps=['Welcome','Video Countdown','Movie Detectives','Character Challenge','Vocabulary Gauntlet','Memory Match','Krampus Snowball Dash','Final Movie Vote','Finish & Download'];let maxVideo=Number(S.watched)||0;function save(){localStorage.setItem(KEY,JSON.stringify(S))}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function sound(){try{let c=new (window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.type='sawtooth';o.frequency.setValueAtTime(320,c.currentTime);o.frequency.linearRampToValueAtTime(110,c.currentTime+.5);g.gain.value=.22;o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+.6)}catch{}}function top(){stage.textContent=`Mission ${S.step+1}/9 · ${steps[S.step]}`;document.getElementById('bar').style.width=(S.step/8*100)+'%';document.getElementById('away').textContent='🚨 '+S.clicks}function navButtons(back=true,next=true,nextText='Next Mission ➜'){return `<div class="actions">${back?'<button class="secondary" onclick="back()">← Previous</button>':''}${next?`<button onclick="next()">${nextText}</button>`:''}</div>`}function back(){if(S.step>0){S.step--;save();render()}}function next(){if(S.step===0){let n=document.getElementById('student').value.trim(),sec=document.getElementById('section').value.trim();if(!n||!sec){alert('Enter your name and class/section.');return}S.name=n;S.section=sec;S.grade=document.getElementById('grade').value;S.date=document.getElementById('date').value;S.started=true}if(S.step===1){let target=MOVIES[S.segment][2];if(S.watched<target-.7||!movieAnswered(S.segment)){alert('Finish watching this movie clip and answer BOTH vocabulary questions before continuing.');return}if(S.segment<9){S.segment++;save();render();return}S.videoDone=true}if(S.step===2||S.step===3){let ids=S.step===2?['q1','q2','q3']:['q4','q5','q6'];if(ids.some(id=>S.answers[id]===undefined)){alert('Choose an answer for every question.');return}}if(S.step===4&&VOCAB.some((w,i)=>S.answers['v'+i]===undefined)){alert('Complete all 20 vocabulary definitions first.');return}if(S.step===5&&!S.game1){alert('Match all the pairs first!');return}if(S.step===6&&!S.game2){alert('Complete the Krampus arcade challenge first!');return}if(S.step===7){if(!S.answers.vote){alert('Choose your favorite movie!');return}S.finished=true}S.step=Math.min(8,S.step+1);save();render()}const CAPTION_CUES=[[0,"Welcome to MsMojo! Today we're counting down animated movies perfect for the holidays."],[17,"Number 10: The Nightmare Before Christmas. Is it a Halloween movie or a Christmas movie?"],[33,"It acts as a bridge between holidays. The debate has been around since its release."],[57,"If you like the macabre mixed with red-and-green festivities, this is for you."],[68,"Number 9: An American Tail. It is imperative that other traditions be honored."],[84,"A Russian Jewish family of mice journeys to the United States for a better life."],[100,"Its story is reminiscent of many immigrants' experiences."],[112,"The holidays can be a time to reflect on heritage and ancestry."],[120,"Number 8: Prep & Landing. The elves play a hands-on role."],[141,"The helpers prepare homes for Santa's arrival in this fast-moving adventure."],[158,"The movie combines distinct genres and a carefully planned mission."],[173,"Number 7: Rise of the Guardians brings together an ensemble of magical characters."],[193,"Winter imagery and Jack Frost make this an underrated holiday movie."],[232,"Number 6: A Charlie Brown Christmas. The Peanuts characters feel comforting."],[256,"Nostalgia can be strong, even for people who feel glum during the holidays."],[280,"Incidentally, Charlie Brown's small Christmas tree became a pop-culture staple."],[300,"Number 5: Mickey's Christmas Carol is a retelling of a classic story."],[329,"Scrooge McDuck plays Ebenezer Scrooge. The movie brings heaps of nostalgia."],[356,"Number 4: Arthur Christmas. The movie features an elf battalion and family dynamics."],[395,"Its message emphasizes the importance of standing by what is right."],[413,"Number 3: Klaus. This animated film slows things down to tell a heartwarming story."],[428,"Jesper is sent to Norway to learn discipline and meets a toy maker named Klaus."],[445,"The movie tells a Santa origin story with beautiful lighting and backdrops."],[469,"Number 2: How the Grinch Stole Christmas is a holiday classic."],[500,"A modern version makes an otherwise intolerable character surprisingly likable."],[543,"Number 1: The Polar Express is full of magical moments."],[577,"The magic surrounding the train is palpable."],[595,"The derailed train sequence builds tension through incredible animation."],[615,"Which holiday movie do you always watch? Do you agree with the countdown?"]];function captionVtt(){let z=n=>{let h=Math.floor(n/3600),m=Math.floor(n%3600/60),sec=Math.floor(n%60);return [h,m,sec].map(x=>String(x).padStart(2,'0')).join(':')+'.000'};return 'WEBVTT\n\n'+CAPTION_CUES.map((c,i)=>z(c[0])+' --> '+z(i+1<CAPTION_CUES.length?CAPTION_CUES[i+1][0]:646)+'\n'+c[1]+'\n').join('\n')}function toggleMovie(){let v=document.getElementById('movie');if(v){if(v.paused)v.play();else v.pause()}}function rewindMovie(){let v=document.getElementById('movie');if(v){v.currentTime=Math.max(0,v.currentTime-10)}}function toggleCaptions(){let v=document.getElementById('movie');if(!v||!v.textTracks.length)return;let t=v.textTracks[0];t.mode=t.mode==='showing'?'hidden':'showing';let b=document.getElementById('ccbtn');if(b)b.textContent=t.mode==='showing'?'CC: ON':'CC: OFF'};const MOVIES=[["The Nightmare Before Christmas",0,68,["festivities","Celebrations and special holiday activities","Problems with machines","Scary monsters"],["debate","A discussion with different opinions","A type of decoration","A musical performance"]],["An American Tail",68,120,["imperative","Extremely important or necessary","Unusual and funny","Easy to avoid"],["reminiscent","Reminding you of something from the past","Making you very angry","Hard to pronounce"]],["Prep & Landing",120,173,["distinct","Clearly different from others","Very expensive","Nearly invisible"],["calculated","Carefully planned or worked out","Completely forgotten","Very loud"]],["Rise of the Guardians",173,232,["ensemble","A group of characters or performers","One main actor","A winter storm"],["underrated","Not appreciated as much as it deserves","Famous everywhere","Too long to watch"]],["A Charlie Brown Christmas",232,300,["nostalgia","Feelings connected with memories of the past","Fear of the unknown","Anger about rules"],["glum","Sad or unhappy","Very energetic","Confused about time"]],["Mickey's Christmas Carol",300,356,["cast","The actors or characters in a production","A holiday dinner","A train ticket"],["heaps","Large amounts","Tiny pieces","Different voices"]],["Arthur Christmas",356,413,["dynamics","The ways people in a group interact","A type of winter sport","The length of a movie"],["emphasizes","Gives special importance to something","Makes something disappear","Repeats something quietly"]],["Klaus",413,469,["discipline","Self-control and following rules","An animated animal","A type of holiday"],["origin","The beginning or source of something","A surprising ending","A review score"]],["How the Grinch Stole Christmas",469,543,["intolerable","Too unpleasant or difficult to accept","Easy to enjoy","Full of surprises"],["classic","A work admired and enjoyed for many years","A brand-new invention","A forgotten mistake"]],["The Polar Express",543,646,["palpable","Strong enough to be clearly felt","Impossible to notice","Not yet invented"],["tension","A feeling of suspense or nervousness","A peaceful celebration","A childhood memory"]]];function checkpointPick(i,j){S.checkpointAnswers[String(S.segment)+':'+i]=j;save();render()}function movieAnswered(seg){return [0,1].every(i=>S.checkpointAnswers[seg+':'+i]!==undefined)}function movieScore(){return MOVIES.reduce((n,m,i)=>n+[0,1].filter(j=>S.checkpointAnswers[i+':'+j]===0).length,0)};const VOCAB=[["imperative","Extremely important or necessary","Very expensive","Easy to forget"],["reminiscent","Reminding someone of the past","Completely unfamiliar","Extremely loud"],["heritage","Traditions and history passed down","A new electronic device","A winter storm"],["ancestry","Family members from earlier generations","A group of actors","A holiday meal"],["distinct","Clearly different","Exactly the same","Very confusing"],["calculated","Carefully planned","Completely accidental","Quickly forgotten"],["ensemble","A group of performers or characters","A single main character","A movie ticket"],["underrated","Not appreciated enough","Too famous to watch","Very expensive"],["nostalgia","Feelings connected to memories of the past","Fear of the future","Anger at a friend"],["glum","Sad or unhappy","Extremely excited","Very hungry"],["incidentally","Used to add related information","Used to announce danger","Used to disagree strongly"],["staple","A familiar regular part of something","An unusual one-time event","A dangerous object"],["dynamics","How people in a group interact","The speed of a train","The number of movies"],["emphasizes","Gives special importance to","Completely ignores","Makes less visible"],["discipline","Self-control and following rules","A magical creature","A type of holiday"],["origin","Where something begins or comes from","How something ends","A movie review"],["intolerable","Too unpleasant to accept","Very entertaining","Easy to understand"],["palpable","Strong enough to be clearly felt","Impossible to notice","Completely imaginary"],["derailed","Came off the railway tracks","Arrived exactly on time","Moved through the air"],["tension","A feeling of suspense or nervousness","A peaceful celebration","A funny memory"]];function vocabQuestion(i){let w=VOCAB[i],choices=[w[1],w[2],w[3]],order=[0,1,2].sort((a,b)=>((i*7+a*11)%13)-((i*7+b*11)%13));return '<h2>👹 Word '+(i+1)+' of '+VOCAB.length+'</h2><p class="stat">'+esc(w[0])+'</p><p>Choose the correct meaning. No hints until the end!</p>'+order.map(j=>'<button class="option '+(S.answers['v'+i]===j?'selected':'')+'" onclick="S.answers.v'+i+'='+j+';save();render()">'+esc(choices[j])+'</button>').join('')}function vocabScore(){return VOCAB.filter((w,i)=>S.answers['v'+i]===0).length};const qs={q1:{q:'What kind of video did you watch?',a:['A movie ranking countdown','A cooking tutorial','A weather report'],correct:0},q2:{q:'Which movie appears in the countdown?',a:['The Nightmare Before Christmas','Jurassic Park','The Lion King'],correct:0},q3:{q:'What is the main theme shared by the movies?',a:['Christmas and the holiday season','Summer vacations','Space travel'],correct:0},q4:{q:'Which green character appears in the countdown?',a:['Shrek','The Grinch','Hulk'],correct:1},q5:{q:'Which movie features a magical train?',a:['The Polar Express','Cars','Finding Nemo'],correct:0},q6:{q:'Which skill helps you understand a movie ranking?',a:['Listening for movie titles and opinions','Ignoring the narrator','Skipping the video'],correct:0}};function question(id){let q=qs[id];return `<div style="margin:20px 0"><strong>${esc(q.q)}</strong>${q.a.map((a,i)=>`<button class="option ${S.answers[id]===i?'selected':''}" onclick="pick('${id}',${i})">${String.fromCharCode(65+i)}. ${esc(a)}</button>`).join('')}</div>`}function pick(id,i){S.answers[id]=i;save();render()}let video=null;function render(){top();if(S.step===0){el.innerHTML=`<h1>🎅 Christmas Movie Quest!</h1><p>Welcome, movie detectives! Watch a Christmas Top 10 countdown in TEN short movie clips, solve holiday mysteries, and beat Krampus in two mini-games.</p><div class="notice">🚨 Switching tabs or hiding the page triggers a horn and sends you back one question. Your click-away count appears in your report. Progress saves automatically on this device.</div><label>Student name</label><input id="student" value="${esc(S.name)}" placeholder="First and last name"><label>Grade</label><select id="grade"><option value="6" ${S.grade==='6'?'selected':''}>Grade 6</option><option value="7" ${S.grade==='7'?'selected':''}>Grade 7</option></select><label>Class / Section</label><input id="section" value="${esc(S.section)}" placeholder="6A, 7B..."><label>Date</label><input id="date" type="date" value="${esc(S.date)}">${navButtons(false,true,'Start Christmas Mission 🎄')}`}
else if(S.step===1){let seg=Math.min(9,S.segment||0),m=MOVIES[seg],gate=movieAnswered(seg);el.innerHTML=`<h1>🎬 Movie ${seg+1} of 10: ${esc(m[0])}</h1><div class="notice"><strong>📖 READ FIRST — DIRECTIONS</strong><ol><li>Watch this short movie clip. You may pause or rewind 10 seconds.</li><li>Turn on English captions if you need help.</li><li>Watch until the video pauses. Do not skip forward.</li><li>Choose the meaning of BOTH vocabulary words.</li><li>Click Next Movie to unlock the next clip.</li></ol><strong>🚨 Clicking away = horn + go back ONE question. Your answers are saved.</strong></div><video id="movie" controls controlsList="nodownload noplaybackrate" playsinline preload="metadata"><source src="christmas-countdown.mp4" type="video/mp4"><track id="captions" kind="captions" srclang="en" label="English (adapted captions)"></video><div class="actions"><button type="button" class="secondary" onclick="toggleMovie()">⏯ Play / Pause</button><button type="button" class="secondary" onclick="rewindMovie()">↶ Rewind 10s</button><button type="button" class="secondary" id="ccbtn" onclick="toggleCaptions()">CC: ON</button></div><p class="small" id="watchstatus">Loading movie clip...</p><div id="checkpoint"></div>${navButtons(true,true,seg===9?'Finish Video Mission ➜':'Next Movie ➜')}`;video=document.getElementById('movie');let captionUrl=URL.createObjectURL(new Blob([captionVtt()],{type:'text/vtt'}));document.getElementById('captions').src=captionUrl;video.textTracks[0].mode='showing';let checkpoint=document.getElementById('checkpoint'),end=m[2],start=m[1],unlocked=false;function showGate(){if(unlocked)return;unlocked=true;video.pause();checkpoint.innerHTML=`<div class="notice"><h2>👹 Krampus Word Challenge — Movie ${seg+1}</h2><p>Read each word. Choose its correct meaning. Both answers are required.</p>${[0,1].map((j)=>{let w=m[3+j],key=seg+':'+j;return '<h3>Word '+(j+1)+': '+esc(w[0])+'</h3>'+[0,1,2].map(k=>'<button class="option '+(S.checkpointAnswers[key]===k?'selected':'')+'" onclick="checkpointPick('+j+','+k+')">'+String.fromCharCode(65+k)+'. '+esc(w[k+1])+'</button>').join('')}).join('')}<p class="small">Answers saved automatically. Complete both words to continue.</p></div>`;}function drawGate(){if(!unlocked)return;showGateAgain()}function showGateAgain(){unlocked=false;showGate()}video.addEventListener('loadedmetadata',()=>{maxVideo=Math.max(maxVideo,Number(S.watched)||0);let resume=Math.max(start,Math.min(maxVideo,end));video.currentTime=resume;document.getElementById('watchstatus').textContent='Clip: '+Math.round(end-start)+' seconds. Watch to the end, then answer two words.';if(maxVideo>=end-.7)showGate()});video.addEventListener('timeupdate',()=>{if(video.currentTime<start-.5){video.currentTime=start;return}if(video.currentTime>Math.min(maxVideo+1,end)){video.currentTime=Math.min(maxVideo,end);return}if(video.currentTime>maxVideo){maxVideo=video.currentTime;S.watched=maxVideo;if(Math.floor(maxVideo)%4===0)save()}if(video.currentTime>=end-.35){maxVideo=Math.max(maxVideo,end);S.watched=maxVideo;save();showGate()}let st=document.getElementById('watchstatus');if(st)st.textContent='Clip '+(seg+1)+'/10 — '+Math.max(0,Math.floor(video.currentTime-start))+' / '+Math.round(end-start)+' seconds watched'});video.addEventListener('seeking',()=>{if(video.currentTime>Math.min(maxVideo+.5,end))video.currentTime=Math.min(maxVideo,end);if(video.currentTime<start)video.currentTime=start});video.addEventListener('ended',()=>{maxVideo=video.duration;S.watched=maxVideo;save();showGate()});if(gate&&maxVideo>=end-.7)showGate()}
else if(S.step===2){el.innerHTML=`<h1>🔎 Mission 2: Movie Detectives</h1><p>Answer all three questions. No correctness hints until the final report!</p>${question('q1')}${question('q2')}${question('q3')}${navButtons()}`}
else if(S.step===3){el.innerHTML=`<h1>🎭 Mission 3: Character Challenge</h1><p>${S.grade==='6'?'Recognize the movies and their characters.':'Listen and think about the movies and the narrator’s ranking.'}</p>${question('q4')}${question('q5')}${question('q6')}${navButtons()}`}
else if(S.step===4){let vi=Math.min(19,S.vocabIndex||0);el.innerHTML='<h1>🎄 Krampus Vocabulary Gauntlet</h1><p>20 difficult words from the actual Christmas movie video. Guess the meaning and unlock the next word. No speaking required!</p><div class="progress"><div style="width:'+((vi+1)*5)+'%;height:100%;background:#ffd46d"></div></div>'+vocabQuestion(vi)+'<p class="small">Words completed: '+Object.keys(S.answers).filter(k=>/^v\\d+$/.test(k)).length+'/20</p><div class="actions"><button class="secondary" onclick="S.vocabIndex=Math.max(0,(S.vocabIndex||0)-1);save();render()">← Previous Word</button><button onclick="if(S.answers[\'v\'+(S.vocabIndex||0)]===undefined){alert(\'Choose a definition first!\');return}S.vocabIndex=Math.min(19,(S.vocabIndex||0)+1);save();render()">Next Word ➜</button></div>'+((vi===19)?navButtons(true,true,'Unlock Memory Game ➜'):'')}
else if(S.step===5){el.innerHTML=`<h1>🧠 Mission 5: Krampus Memory Match</h1><p>Match all six Christmas picture pairs to unlock the next mission.</p><p class="stat" id="moves">Moves: 0</p><div class="gamegrid" id="memory"></div>${navButtons()}`;initMemory()}
else if(S.step===6){el.innerHTML=`<h1>👹 Mission 6: Krampus Snowball Dash!</h1><p>Tap the mischievous Krampus 👹 to score points. Avoid Santa 🎅! Score 12 points before the 60-second round ends.</p><div class="row"><span class="badge" id="gscore">Score: 0 / 12</span><span class="badge" id="gtime">Time: 60s</span></div><div class="arena" id="arena"></div><div class="actions"><button id="startgame" onclick="startArcade()">▶ Start arcade game</button></div><p class="small">Touchscreen and mouse friendly. If time runs out, try again.</p>${navButtons()}`;if(S.game2)document.getElementById('arena').innerHTML='<h2 style="text-align:center;margin-top:95px">🏆 Krampus defeated!</h2>'}
else if(S.step===7){el.innerHTML=`<h1>🏆 Mission 7: The Ultimate Christmas Vote</h1><p>Choose the Christmas movie you would recommend to your friends.</p>${['The Nightmare Before Christmas','The Grinch','The Polar Express','A Charlie Brown Christmas','Another movie from the countdown'].map(x=>`<button class="option ${S.answers.vote===x?'selected':''}" onclick="S.answers.vote='${x.replace(/'/g,"\\'")}';save();render()">🎬 ${esc(x)}</button>`).join('')}<p class="small">Choose independently. No speaking required.</p>${navButtons(true,true,'Finish & Grade 🎁')}`}
else{let score=Object.keys(qs).filter(k=>S.answers[k]===qs[k].correct).length;el.innerHTML=`<h1>🎉 Mission Complete!</h1><p class="stat">${esc(S.name)} · Grade ${esc(S.grade)} · ${esc(S.section)}</p><h2>Trivia score: ${score} / 6</h2><h2>Vocabulary: ${vocabScore()} / 20</h2><p>🧠 Memory: ${S.game1?'Complete':'Incomplete'} · 👹 Krampus: ${S.game2?'Defeated':'Incomplete'}</p><p>🚨 Click-away count: <strong>${S.clicks}</strong></p><p>⏱ Lesson time: ${Math.floor(S.elapsed/60)}m ${S.elapsed%60}s</p><div class="actions"><button onclick="download()">💾 Save & Download Report</button><button class="secondary" onclick="back()">← Review</button></div><p class="small">The report includes your 10 movie vocabulary checkpoints, all trivia, and your teacher's grading information.</p>`}}
let mem=[],open=[],moves=0,memLock=false;function initMemory(){if(S.game1){document.getElementById('memory').innerHTML='<h2>🎉 All pairs matched!</h2>';return}let icons=['🎅','🎄','👹','🎁','🦌','⛄'];mem=[...icons,...icons].sort(()=>Math.random()-.5).map((v,i)=>({v,i,matched:false}));drawMem()}function drawMem(){document.getElementById('moves').textContent=`Moves: ${moves}`;document.getElementById('memory').innerHTML=mem.map((m,i)=>`<button class="tile ${m.matched?'matched':open.includes(i)?'revealed':''}" onclick="flip(${i})">${m.matched||open.includes(i)?m.v:'❄️'}</button>`).join('')}function flip(i){if(memLock||mem[i].matched||open.includes(i))return;open.push(i);drawMem();if(open.length===2){moves++;if(mem[open[0]].v===mem[open[1]].v){mem[open[0]].matched=mem[open[1]].matched=true;open=[];if(mem.every(x=>x.matched)){S.game1=true;save();setTimeout(render,400)}else drawMem()}else{memLock=true;setTimeout(()=>{open=[];memLock=false;if(S.step===5)drawMem()},850)}}}
let gameTimer=null,spawnTimer=null,points=0,seconds=60;function stopGame(){clearInterval(gameTimer);clearInterval(spawnTimer);gameTimer=null;spawnTimer=null}function spawn(){let a=document.getElementById('arena');if(!a)return;a.innerHTML='';let t=document.createElement('button');t.className='target';let krampus=Math.random()>.25;t.textContent=krampus?'👹':'🎅';t.style.left=Math.floor(Math.random()*80+4)+'%';t.style.top=Math.floor(Math.random()*65+5)+'%';t.style.border='none';t.style.background='transparent';t.onclick=()=>{if(krampus)points++;else points=Math.max(0,points-2);document.getElementById('gscore').textContent=`Score: ${points} / 12`;if(points>=12){stopGame();S.game2=true;save();render()}else spawn()};a.appendChild(t)}function startArcade(){if(gameTimer)return;points=0;seconds=60;document.getElementById('startgame').disabled=true;spawn();spawnTimer=setInterval(spawn,1350);gameTimer=setInterval(()=>{seconds--;let t=document.getElementById('gtime');if(t)t.textContent=`Time: ${seconds}s`;if(seconds<=0){stopGame();if(S.step===6){document.getElementById('arena').innerHTML='<h2 style="text-align:center;margin-top:90px">⏰ Time up! Try again.</h2>';document.getElementById('startgame').disabled=false}}},1000)}
function download(){let score=Object.keys(qs).filter(k=>S.answers[k]===qs[k].correct).length;let lines=[`CHRISTMAS MOVIE QUEST — STUDENT REPORT`,`Name: ${S.name}`,`Grade: ${S.grade}`,`Section: ${S.section}`,`Date: ${S.date}`,`Lesson duration: ${Math.floor(S.elapsed/60)}m ${S.elapsed%60}s`,`Click-away count: ${S.clicks}`,`Video completed: ${S.videoDone?'Yes':'No'}`,`Trivia score: ${score}/6`,`Movie vocabulary checkpoints: ${Object.values(S.checkpointAnswers).length}/20 (correct: ${movieScore()}/20)`,`Memory game: ${S.game1?'Complete':'Incomplete'}`,`Krampus arcade: ${S.game2?'Complete':'Incomplete'}`,'',...Object.entries(qs).map(([id,q])=>`${q.q}\nStudent answer: ${q.a[S.answers[id]]??'No answer'}\nCorrect answer: ${q.a[q.correct]}\n`),`Vocabulary score: ${vocabScore()}/20`,...VOCAB.map((w,i)=>`${i+1}. ${w[0]} — Student: ${[w[1],w[2],w[3]][S.answers['v'+i]]||'No answer'} | Correct: ${w[1]}`),`Favorite movie: ${S.answers.vote||''}`];let blob=new Blob([lines.join('\n')],{type:'text/plain'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=`Christmas_Movie_Quest_${S.name.replace(/[^a-z0-9]/gi,'_')}.txt`;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
setInterval(()=>{if(S.started&&!S.finished){S.elapsed++;clock.textContent=`⏱ ${Math.max(0,60*60-S.elapsed)>0?`${String(Math.floor((3600-S.elapsed)/60)).padStart(2,'0')}:${String(Math.max(0,3600-S.elapsed)%60).padStart(2,'0')}`:'TIME UP'}`;if(S.elapsed===3600)sound();if(S.elapsed%5===0)save()}},1000);let lastAway=0;document.addEventListener('visibilitychange',()=>{if(document.hidden&&S.started&&!S.finished&&Date.now()-lastAway>1500){lastAway=Date.now();S.clicks++;if(S.step===1){let k=String(S.segment)+':1';if(S.checkpointAnswers[k]!==undefined)delete S.checkpointAnswers[k];else if(S.checkpointAnswers[String(S.segment)+':0']!==undefined)delete S.checkpointAnswers[String(S.segment)+':0'];else S.segment=Math.max(0,S.segment-1)}else if(S.step===4){S.vocabIndex=Math.max(0,(S.vocabIndex||0)-1);delete S.answers['v'+S.vocabIndex]}else if(S.step===2||S.step===3){let ids=S.step===2?['q1','q2','q3']:['q4','q5','q6'];let last=ids.filter(k=>S.answers[k]!==undefined).pop();if(last)delete S.answers[last];else S.step=Math.max(1,S.step-1)}else S.step=Math.max(0,S.step-1);stopGame();save();sound();}else if(!document.hidden){render();if(S.started&&!S.finished&&S.clicks){} }});document.addEventListener('paste',e=>{if(['TEXTAREA','INPUT'].includes(e.target.tagName))e.preventDefault()});document.addEventListener('copy',e=>{if(e.target.closest('main'))e.preventDefault()});render();
