<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nightmare Quest | Grade 7</title><style>body{margin:0;background:radial-gradient(circle at top,#35235d,#0b0c1b 70%);color:#f5edff;font:17px system-ui}main{max-width:760px;margin:35px auto;padding:22px}section{background:#201a39;border:1px solid #66518d;border-radius:22px;padding:25px}h1{font-size:2.2em;color:#e9bdff}h2{color:#f6c5ff}input,textarea,select{box-sizing:border-box;width:100%;padding:13px;margin:9px 0 17px;background:#fff;color:#1b1730;border:0;border-radius:9px;font:inherit}textarea{min-height:80px}button{background:#c58aff;color:#171020;border:0;border-radius:12px;padding:13px 20px;font-weight:bold;font-size:1em;cursor:pointer;margin:6px}.bar{height:12px;background:#423454;border-radius:20px;overflow:hidden}.bar div{height:100%;background:#d4a0ff;width:0}.hint{background:#382a51;padding:14px;border-radius:12px;margin:15px 0}.choices button{display:block;width:100%;text-align:left;background:#43335f;color:white}.choices button.sel{background:#b77af5;color:#130e1b}.row{display:flex;justify-content:space-between;flex-wrap:wrap}label{font-weight:bold}</style><main><section><div class="row"><span>🌙 GRADE 7 • PBL PART 1</span><span id="count">START</span></div><h1>👻 Nightmare Quest</h1><div class="bar"><div id="fill"></div></div><p>Complete the five dream-planning missions to unlock the Nightmare Escape Game. Your work saves on this device.</p><div id="area"></div><div class="row"><button id="back" onclick="move(-1)">← Previous</button><button id="next" onclick="move(1)">Next →</button></div></section></main><script>
const steps=[{title:"Step 1 — Choose a dream or nightmare",help:"Your dream can be real, invented, or a mixture.",fields:[["type","My dream is…","select",["Real","Invented","A mixture"]],["idea","My dream idea in a few words…","text"]]},{title:"Step 2 — Plan your dream",help:"Decide when your dream begins, where it happens, and who appears.",fields:[["kind","The type of dream is…","text"],["when","My dream begins when…","text"],["where","My dream happens in/at…","text"],["who","The person or creature who appears is…","text"]]},{title:"Step 3 — Put three events in order",help:"Tell what happens first, next, and finally.",fields:[["first","First, I…","text"],["next","Next, something surprising happens: …","text"],["finally","Finally, the dream ends when…","text"]]},{title:"Step 4 — Add details and feelings",help:"Describe what you experienced and how you felt.",fields:[["detail","One strange thing I saw, heard, or experienced was…","text"],["during","During the dream, I felt…","text"],["after","After waking up, I felt…","text"]]},{title:"Step 5 — Explain your dream",help:"What makes this dream interesting, frightening, or mysterious?",fields:[["why","This dream is interesting, frightening, or mysterious because…","text"]]}];
const game=[{q:"🚪 Door 1: Which word describes a scary dream?",a:["A nightmare","A schedule","A memory card","A vacation"],correct:0,h:"Think about the opposite of a pleasant dream."},{q:"🕯️ Door 2: You know you are dreaming while still asleep. What kind of dream is this?",a:["Recurring","Lucid","Ordinary","Daydream"],correct:1,h:"This dream type involves awareness."},{q:"🦇 Door 3: Which sentence best describes a vivid dream detail?",a:["It was weird.","I had a dream.","A silver clock melted above the dark staircase.","I slept."],correct:2,h:"Look for a specific image you can picture."},{q:"🗝️ Door 4: Which word shows the final event in a story?",a:["Suddenly","First","Next","Finally"],correct:3,h:"Which transition means the ending?"},{q:"🌘 Door 5: Which sentence uses the past tense correctly?",a:["I see a monster yesterday.","I saw a monster in my dream.","I seeing a monster.","I sees a monster."],correct:1,h:"The past tense of see is saw."}];
let data=JSON.parse(localStorage.getItem("nightmareQuest7Github")||"{}"),page=Number(localStorage.getItem("nightmarePage7Github")||-1),door=0,selected=-1,score=0;const area=document.getElementById("area");function save(){localStorage.setItem("nightmareQuest7Github",JSON.stringify(data));localStorage.setItem("nightmarePage7Github",page)}function esc(s){return String(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}function render(){document.getElementById("back").style.display=page<=-1?"none":"inline-block";document.getElementById("next").style.display=page>=5?"none":"inline-block";document.getElementById("count").textContent=page<0?"WELCOME":page<5?"STEP "+(page+1)+" OF 5":"NIGHTMARE GAME";document.getElementById("fill").style.width=(page<0?0:page<5?(page+1)*16:100)+"%";let out="";if(page<0){out='<h2>Enter the Dream Portal</h2><label>Student name</label><input id="student" value="'+esc(data.student)+'"><label>Class / Section</label><input id="class" value="'+esc(data.class)+'"><label>Date</label><input type="date" id="date" value="'+esc(data.date||new Date().toISOString().slice(0,10))+'"><p>You may invent your dream. Share only details you feel comfortable sharing.</p>';document.getElementById("next").textContent="START MY ACTIVITY →"}else if(page<5){let s=steps[page];out='<h2>'+s.title+'</h2><div class="hint">💡 '+s.help+'</div>';for(let [key,label,type,options] of s.fields){out+='<label>'+label+'</label>';out+=type==="select"?'<select id="'+key+'"><option value="">Choose one…</option>'+options.map(v=>'<option '+(data[key]===v?'selected':'')+'>'+v+'</option>').join("")+'</select>':'<textarea id="'+key+'" placeholder="Write your own idea here…">'+esc(data[key])+'</textarea>'}document.getElementById("next").textContent=page===4?"UNLOCK NIGHTMARE GAME 👻":"NEXT STEP →"}else if(page===5){let g=game[door];out='<h2>👻 Nightmare Escape — Door '+(door+1)+'/5</h2><p>Answer correctly to escape each haunted room!</p><div class="hint">'+g.q+'</div><div class="choices">'+g.a.map((v,i)=>'<button class="'+(selected===i?'sel':'')+'" onclick="selected='+i+';render()">'+String.fromCharCode(65+i)+'. '+v+'</button>').join("")+'</div><p id="feedback"></p><button onclick="check()">🔓 Unlock door</button>'}else{out='<h2>🏆 You escaped the nightmare!</h2><p>Excellent work, '+esc(data.student)+'! You finished Part 1 of The Mystery of Dreams.</p><p>Nightmare Game score: '+score+'/5</p><p>Your planning notes are ready for your later 100–120 word, three-paragraph essay.</p><button onclick="download()">📄 Download My PBL Answers</button>'}area.innerHTML=out}function collect(){if(page<0){for(let k of ["student","class","date"])data[k]=document.getElementById(k).value.trim()}else if(page<5){for(let [k] of steps[page].fields)data[k]=document.getElementById(k).value.trim()}save()}function move(n){if(page<5)collect();if(n>0){if(page<0&&(!data.student||!data.class||!data.date)){alert("Please enter your name, class, and date.");return}if(page>=0&&page<5&&steps[page].fields.some(([k])=>!data[k])){alert("Complete all blanks before continuing.");return}}page=Math.max(-1,Math.min(6,page+n));save();render();window.scrollTo(0,0)}function check(){if(selected<0){alert("Choose an answer first!");return}if(selected===game[door].correct){score++;door++;selected=-1;if(door===game.length){page=6;save()}render()}else{document.getElementById("feedback").textContent="🕸️ Not quite! Hint: "+game[door].h}}function download(){let lines=["THE MYSTERY OF DREAMS — PBL PART 1","Student: "+data.student,"Class: "+data.class,"Date: "+data.date,""];for(let s of steps){lines.push(s.title);for(let [k,label] of s.fields)lines.push(label+" "+(data[k]||""));lines.push("")}lines.push("Nightmare Escape Game: "+score+"/5");let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([lines.join("\n")],{type:"text/plain"}));a.download="Dreams-Part1-"+(data.student||"student").replace(/[^a-z0-9-]/gi,"_")+".txt";a.click();URL.revokeObjectURL(a.href)}render();
</script></html>
