<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TOEIC Survival Quest — Mission 1</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#29436b,#0c142a 65%);color:#f4f7ff;font:17px system-ui,Arial}main{max-width:930px;margin:auto;padding:20px}h1{font-size:clamp(30px,5vw,48px);color:#ffdd85;margin:10px 0}h2{color:#c2ecff}section{background:#1e2b4a;border:2px solid #526c9b;border-radius:20px;padding:25px;margin:14px 0}p{line-height:1.55}.muted{color:#b4c9e5}.bar{height:12px;background:#0e1932;border-radius:12px;overflow:hidden}.bar div{height:100%;background:#8be0bd}input{width:100%;padding:13px;font:inherit;border-radius:9px;border:2px solid #a6b8d7;margin:6px 0 12px}button,.link{border:0;border-radius:11px;padding:13px 18px;background:#ffdb82;color:#162641;font:inherit;font-weight:800;cursor:pointer;display:inline-block;text-decoration:none;margin:4px}button:disabled{opacity:.4;cursor:not-allowed}.choice{display:block;text-align:left;width:100%;margin:10px 0;background:#39557e;color:#fff;border:2px solid #6684b0}.choice.sel{border-color:#ffdf84;background:#5b6593}.nav{display:flex;justify-content:space-between;gap:12px;margin-top:20px}.note{background:#304469;border-left:5px solid #ffdc84;padding:15px;border-radius:9px;margin:15px 0}.photo{width:100%;max-height:320px;object-fit:cover;border-radius:14px}.vocab{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:9px}.word{background:#30456c;padding:12px;border-radius:10px}.small{font-size:14px;color:#b5c8e4}.score{font-size:26px;color:#a7f3d0}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}@media(max-width:550px){main{padding:10px}section{padding:15px}}</style></head><body><main><header><div class="muted">GRADE 11 • 60-MINUTE CLASS • ORIGINAL TOEIC-STYLE PRACTICE</div><h1>🎧 TOEIC SURVIVAL QUEST</h1><strong>MISSION 1 — THE LISTENING DETECTIVE</strong><p>Vocabulary. Business phrases. Listening traps. Photo Detective. Arcade reward.</p></header><section><div id="label"></div><div class="bar"><div id="bar"></div></div><div id="content"></div><div class="nav"><button id="back" onclick="back()">◀ Previous</button><button id="next" onclick="next()">Continue ▶</button></div></section></main><script>
const KEY='toeicMission1_v1',memoryURL='https://davidjuancandu-hash.github.io/class-activities/grade-11-toeic-photo-memory-mayhem/';
const words=[['appointment','a planned meeting'],['deadline','the final time to finish something'],['postpone','move to a later date'],['confirm','say that something is correct or definite'],['available','free or ready to use'],['shipment','goods being transported'],['invoice','a document requesting payment'],['refund','money returned to a customer'],['supervisor','a person who manages workers'],['reservation','an arrangement to keep a place or service'],['maintenance','work to keep equipment operating'],['schedule','a timetable of planned activities']];
const phrases=[['Could you please confirm the reservation?','A polite request for verification'],['The meeting has been postponed.','The meeting will happen later'],['I am calling regarding your order.','I am calling about your order'],['We apologize for the inconvenience.','A polite apology for a problem'],['The shipment is expected tomorrow.','The delivery should arrive tomorrow'],['Would you mind sending the invoice?','A polite request for a document']];
const photos=[{src:'https://images.unsplash.com/photo-1556761175-b413da4baf72?w=900&q=80',alt:'Colleagues in a business meeting',q:'Which sentence BEST describes the photograph?',opts:['Several colleagues are discussing work at a table.','A chef is preparing a meal.','The passengers are boarding a train.','The office is being demolished.'],a:0},{src:'https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?w=900&q=80',alt:'Restaurant interior with tables and chairs',q:'Which sentence BEST describes the photograph?',opts:['Workers are unloading a truck.','Tables and chairs have been arranged in a restaurant.','A plane is flying above the city.','The customers are swimming.'],a:1},{src:'https://images.unsplash.com/photo-1586528116311-ad8dd3c8310d?w=900&q=80',alt:'Warehouse with stored packages',q:'Which sentence BEST describes the photograph?',opts:['A doctor is examining a patient.','The workers are planting trees.','Packages are stored inside a warehouse.','The students are taking a test.'],a:2},{src:'https://images.unsplash.com/photo-1497366811353-6870744d04b2?w=900&q=80',alt:'Modern office with desks and chairs',q:'Which sentence BEST describes the photograph?',opts:['The travelers are checking into a hotel.','A waiter is serving lunch.','A vehicle is being repaired.','Desks and chairs are arranged in an office.'],a:3}];
const q=[
{group:'Vocabulary',q:'The manager moved the meeting from Monday to Friday. The meeting was ______.',opts:['postponed','purchased','repaired','delivered'],a:0},
{group:'Vocabulary',q:'A document requesting payment for goods or services is an ______.',opts:['appointment','invoice','employee','announcement'],a:1},
{group:'Vocabulary',q:'Please ______ your hotel reservation before Friday.',opts:['borrow','replace','confirm','cancelled'],a:2},
{group:'Vocabulary',q:'The company will send the ______ by truck tomorrow.',opts:['supervisor','deadline','refund','shipment'],a:3},
{group:'Vocabulary',q:'The customer returned the damaged item and requested a ______.',opts:['refund','promotion','schedule','meeting'],a:0},
{group:'Vocabulary',q:'The application must arrive before the ______.',opts:['invoice','deadline','supervisor','lobby'],a:1},
{group:'Phrases',q:'What does “Would you mind sending the invoice?” mean?',opts:['The invoice has been paid.','The speaker refuses to send it.','The speaker politely asks for the invoice.','The invoice is missing forever.'],a:2},
{group:'Phrases',q:'A receptionist says “I am calling regarding your reservation.” What does regarding mean?',opts:['instead of','later than','because of','about'],a:3},
{group:'Phrases',q:'“We apologize for the inconvenience” is most likely said when ______.',opts:['a problem has occurred','a celebration begins','a contract is signed','a meeting starts early'],a:0},
{group:'Phrases',q:'“The shipment is expected tomorrow” means ______.',opts:['the shipment was cancelled','the goods should arrive tomorrow','the goods arrived yesterday','the shipment is not needed'],a:1},
{group:'Phrases',q:'“The supervisor is unavailable” means the supervisor ______.',opts:['has resigned','is promoted','cannot be reached right now','is arriving with supplies'],a:2},
{group:'Phrases',q:'“Could we reschedule our appointment?” asks to ______.',opts:['buy new equipment','receive a refund','send a package','change the meeting time'],a:3},
...photos.map((p,i)=>({group:'Photo Detective',q:p.q,opts:p.opts,a:p.a,photo:i})),
{group:'Listening',script:'Where should I leave these packages? You can put them beside the reception desk.',q:'Where should the packages be left?',opts:['Beside the reception desk','At the airport','Inside a restaurant','At the train station'],a:0},
{group:'Listening',script:'When does the new employee start work? Next Monday, after the orientation session.',q:'When will the employee start?',opts:['This afternoon','Next Monday','Last Friday','Tomorrow evening'],a:1},
{group:'Listening',script:'Would you like me to reserve a conference room? Yes, please. We need one for ten people.',q:'What does the speaker want?',opts:['A refund','A flight ticket','A conference room','A new invoice'],a:2},
{group:'Listening',script:'Why was the delivery delayed? The truck broke down on the highway.',q:'Why was the delivery late?',opts:['The office was closed','The customer cancelled','The driver was on vacation','The truck had a problem'],a:3},
{group:'Listening',script:'Attention passengers. Flight two hundred and six to San José will now depart from gate twelve instead of gate eight.',q:'What has changed?',opts:['The departure gate','The ticket price','The destination','The departure date'],a:0},
{group:'Listening',script:'Hello, this is Maria from the hotel. I am calling to confirm your reservation for two nights, beginning Friday.',q:'Why is Maria calling?',opts:['To cancel a trip','To confirm a hotel reservation','To request a job interview','To order food'],a:1},
{group:'Listening',script:'The printer on the third floor is out of service. Please use the machine in the lobby until repairs are completed.',q:'What should employees do?',opts:['Stop working today','Purchase a new computer','Use the lobby printer','Move to the third floor'],a:2},
{group:'Listening',script:'Good morning. The sales meeting scheduled for three o’clock has been moved to four thirty because the director is arriving late.',q:'When will the meeting begin?',opts:['At three','At four','At five','At four thirty'],a:3}
];
let s={step:0,max:0,name:'',section:'',date:new Date().toISOString().slice(0,10),answers:{},memory:false,...JSON.parse(localStorage.getItem(KEY)||'{}')};const $=id=>document.getElementById(id),escapeHTML=t=>String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){localStorage.setItem(KEY,JSON.stringify(s))}
function speak(){if(!('speechSynthesis' in window)){alert('This browser does not support speech playback. Ask your teacher to read the script.');return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(q[s.step-4].script);u.lang='en-US';u.rate=.88;speechSynthesis.speak(u)}function stop(){if('speechSynthesis'in window)speechSynthesis.cancel()}
function render(){save();$('bar').style.width=(s.step/30*100)+'%';$('back').style.display=s.step===0||s.step===30?'none':'inline-block';$('next').style.display=s.step===30?'none':'inline-block';$('next').textContent=s.step===29?'FINISH + GRADE 🏆':'Continue ▶';let h='';
if(s.step===0){$('label').textContent='START • 60-MINUTE CLASS';h='<h2>Welcome, TOEIC Detective!</h2><p>Today you will learn 12 workplace words, 6 useful phrases, study photograph clues, answer 24 TOEIC-style questions, and play Photo Memory Mayhem.</p><label>Student name<input id="name" value="'+escapeHTML(s.name)+'"></label><label>Class / Section<input id="section" value="'+escapeHTML(s.section)+'"></label><label>Date<input type="date" id="date" value="'+escapeHTML(s.date)+'"></label><p class="note">No answers are revealed until the final grade. Your work saves automatically in this browser.</p>'}
else if(s.step===1){$('label').textContent='STAGE 1 • VOCABULARY TRAINING • 10 MIN';h='<h2>💼 12 TOEIC Survival Words</h2><p>Read each word and definition. Say five of the words aloud with a partner.</p><div class="vocab">'+words.map(x=>'<div class="word"><b>'+x[0]+'</b><br><span class="small">'+x[1]+'</span></div>').join('')+'</div>'}
else if(s.step===2){$('label').textContent='STAGE 2 • USEFUL PHRASES • 7 MIN';h='<h2>☎️ Speak Like a Professional</h2><p>Practice these workplace phrases aloud. What would you say to a hotel guest or customer?</p>'+phrases.map(x=>'<div class="note"><b>'+x[0]+'</b><br>'+x[1]+'</div>').join('')}
else if(s.step===3){$('label').textContent='STAGE 3 • TEST STRATEGY • 5 MIN';h='<h2>🕵️ TOEIC Listening Secrets</h2><div class="note"><b>Part 1 — Photographs:</b> Look for people, objects, actions and locations. Beware of a sentence that sounds similar but describes something not shown.</div><div class="note"><b>Part 2 — Question–Response:</b> Listen for who, where, when, why, and how. The correct response may be indirect.</div><div class="note"><b>Part 3 and 4:</b> Listen for the speaker’s purpose, specific details, changes, and next actions.</div><p><b>Real TOEIC tip:</b> There is no penalty for guessing, so choose an answer for every question.</p>'}
else if(s.step>=4&&s.step<=27){let i=s.step-4,item=q[i];$('label').textContent='STAGE 4 • '+item.group.toUpperCase()+' • QUESTION '+(i+1)+'/24';h='<h2>'+item.group+' — '+(i+1)+'/24</h2>';if(item.photo!==undefined)h+='<img class="photo" src="'+photos[item.photo].src+'" alt="'+photos[item.photo].alt+'"><p class="small">Study the photo before choosing your answer.</p>';if(item.script)h+='<div class="note"><button onclick="speak()">🔊 PLAY LISTENING AUDIO</button><p class="small">Listen carefully. The transcript is intentionally hidden during the test.</p></div>';h+='<p><b>'+escapeHTML(item.q)+'</b></p>'+item.opts.map((o,j)=>'<button class="choice '+(s.answers[i]===j?'sel':'')+'" onclick="pick('+j+')">'+String.fromCharCode(65+j)+'. '+escapeHTML(o)+'</button>').join('')+'<p class="small">Select one answer. You can return to earlier questions; answers stay hidden until the end.</p>'}
else if(s.step===28){$('label').textContent='STAGE 5 • PHOTO MEMORY ARCADE • 10 MIN';h='<h2>📸 PHOTO MEMORY MAYHEM!</h2><p>Match six pairs of workplace and travel photos. Each pair unlocks a description challenge. The game opens in another tab so you can return here afterward.</p><p><a class="link" href="'+memoryURL+'" target="_blank" rel="noopener">🎮 OPEN PHOTO MEMORY GAME ↗</a></p><div class="note"><label><input style="width:auto" type="checkbox" id="memory" '+(s.memory?'checked':'')+' onchange="s.memory=this.checked;save()"> I completed the photo memory challenge (or my teacher excused it).</label></div><p class="small">Remember to download the memory game results separately.</p>'}
else if(s.step===29){$('label').textContent='STAGE 6 • FINAL CHECK • 5 MIN';h='<h2>🏁 Test-Day Survival Checklist</h2><p>Before finishing, remember these strategies:</p><div class="note">✓ Focus on key words and meaning, not every word.<br>✓ Listen for changes in dates, times, and locations.<br>✓ Eliminate obviously wrong answers.<br>✓ Answer every question; guessing has no penalty.<br>✓ Bring the identification and materials required by your test center.</div><p>Your answers will be graded only when you select Finish + Grade.</p>'}
else{stop();$('label').textContent='RESULTS • SAVE & DOWNLOAD';let score=q.filter((x,i)=>s.answers[i]===x.a).length;h='<h2>🏆 Mission 1 Complete!</h2><p class="score">'+score+'/24 correct • '+Math.round(score/24*100)+'%</p><p><b>Student:</b> '+escapeHTML(s.name)+' • <b>Class:</b> '+escapeHTML(s.section)+' • <b>Date:</b> '+escapeHTML(s.date)+'</p><p>Photo Memory Mayhem: '+(s.memory?'Completed':'Not marked completed')+'</p><button onclick="download()">💾 SAVE & DOWNLOAD RESULTS</button><h3>Review Your Answers</h3>'+q.map((x,i)=>'<div class="note"><b>'+(i+1)+'. '+escapeHTML(x.q)+'</b><br>Your answer: '+escapeHTML(x.opts[s.answers[i]]||'—')+'<br>Correct: '+escapeHTML(x.opts[x.a])+'</div>').join('')}
$('content').innerHTML=h}
function pick(n){s.answers[s.step-4]=n;save();render()}function capture(){if(s.step===0){s.name=$('name').value.trim();s.section=$('section').value.trim();s.date=$('date').value}save()}
function next(){capture();stop();if(s.step===0&&(!s.name||!s.section||!s.date)){alert('Enter your name, class, and date.');return}if(s.step>=4&&s.step<=27&&s.answers[s.step-4]===undefined){alert('Select an answer before continuing.');return}if(s.step===28&&!s.memory){alert('Complete the photo memory game, or ask your teacher for permission to continue.');return}s.step=Math.min(30,s.step+1);s.max=Math.max(s.max,s.step);render();window.scrollTo({top:0,behavior:'smooth'})}function back(){capture();stop();s.step=Math.max(0,s.step-1);render()}
function download(){let score=q.filter((x,i)=>s.answers[i]===x.a).length;let text=['TOEIC SURVIVAL QUEST — MISSION 1','Student: '+s.name,'Class: '+s.section,'Date: '+s.date,'Score: '+score+'/24','Photo memory completed: '+(s.memory?'Yes':'No'),'',...q.map((x,i)=>(i+1)+'. '+x.q+' | Your answer: '+(s.answers[i]===undefined?'—':x.opts[s.answers[i]])+' | Correct: '+x.opts[x.a])].join('\n');let url=URL.createObjectURL(new Blob([text],{type:'text/plain;charset=utf-8'}));let a=document.createElement('a');a.href=url;a.download='TOEIC_Mission_1_'+s.name.replace(/[^a-z0-9]/gi,'_')+'.txt';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000)}render();
</script></body></html>
