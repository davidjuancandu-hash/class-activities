<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Holiday Heroes Quest — Grade 6</title><style>
:root{font-family:system-ui,Segoe UI,sans-serif;color:#fff;background:#0a2343}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#20557e,#08172d);min-height:100vh}.wrap{max-width:850px;margin:auto;padding:20px}header{display:flex;justify-content:space-between;align-items:center;gap:10px}h1{font-size:clamp(28px,5vw,46px);margin:12px 0;color:#ffe69a}h2{color:#b3fff1}p{line-height:1.6}.panel{background:#14385c;border:2px solid #428fa7;border-radius:20px;padding:26px;margin-top:18px;box-shadow:0 12px 32px #0005}.muted{color:#c5dfeb}input,textarea{width:100%;padding:13px;border-radius:12px;border:2px solid #9de0df;background:#f8ffff;color:#10293b;font:inherit;margin:7px 0 14px}button{background:#ffcf65;color:#172b39;border:0;border-radius:12px;padding:14px 20px;font:inherit;font-weight:800;cursor:pointer;margin:6px 6px 6px 0}button:disabled{opacity:.4;cursor:not-allowed}.choice{display:block;width:100%;text-align:left;background:#23557b;color:white;border:2px solid #5c95b4}.choice.sel{border-color:#ffdf79;background:#396b7c}.progress{height:13px;background:#23415e;border-radius:20px;overflow:hidden}.progress div{height:100%;background:#5ce1b5;transition:width .2s}.hero{font-size:68px;line-height:1.2}.chip{background:#244f6d;border-radius:30px;padding:7px 12px;display:inline-block;margin:4px}.hidden{display:none}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.tile{font-size:44px;min-height:90px;background:#20557b;color:white}.tile.done{background:#34785c}.good{color:#aaf9c6}.foot{font-size:13px;color:#bed7e6;margin:20px 0}.status{font-size:14px;color:#d8f6ff}.notice{background:#275174;padding:12px;border-radius:12px} @media(max-width:560px){.panel{padding:17px}.grid{gap:6px}.tile{min-height:70px;font-size:32px}}
</style></head><body><div class="wrap"><header><strong>🎄 GRADE 6 • ENGLISH ADVENTURE</strong><span id="counter" class="status">20-minute quest</span></header><div class="progress"><div id="bar" style="width:0"></div></div><main id="app"></main><div class="foot">A friendly, school-safe adventure • Answers are revealed only after Finish & Grade • Progress saves on this device.</div></div><script>
const worlds=[
{title:"The Grinch's Kindness Village",icon:"💚",intro:"The Grinch is a fictional character. Help the village find kindness!",qs:[
["Who created the Grinch?",["Dr. Seuss","A mountain explorer","A Yule Lad","A scientist"],0],
["The Grinch is best described as...",["A real Icelandic visitor","A fictional Christmas character","A Japanese tradition","A mountain animal"],1],
["How does the Grinch feel about Christmas at first?",["He dislikes it","He invented it","He never heard of it","He teaches it"],0],
["What important lesson does the Grinch learn?",["Presents are everything","Kindness and community matter","Everyone must be alone","Never celebrate"],1],
["Which is a kind action?",["Helping a classmate","Taking a friend's gift","Laughing at others","Ignoring someone who needs help"],0]]},
{title:"Iceland's Silly Yule Lad Village",icon:"🎁",intro:"The 13 Yule Lads belong to Icelandic Christmas folklore. Find the silly visitors!",qs:[
["How many Yule Lads are there?",["3","7","13","20"],2],
["Where do the Yule Lads come from?",["Costa Rica","Iceland","Japan","Brazil"],1],
["What might a child put on the windowsill?",["A shoe","A bicycle","A TV","A bookcase"],0],
["What does Spoon-Licker like?",["Licking spoons","Swimming","Playing soccer","Painting walls"],0],
["What might a Yule Lad leave in a shoe in the tradition?",["A small gift or potato","A snowstorm","A mountain","A computer"],0]]},
{title:"The Friendly Yeti's Snowy Mountain",icon:"❄️",intro:"The Yeti comes from Himalayan legends. Help a friendly movie Yeti learn about the world!",qs:[
["The Yeti is connected to stories from...",["The Himalayas","Iceland","The ocean","The moon"],0],
["A Yeti is usually described as...",["A mysterious hairy mountain creature","A talking fish","A Christmas tree","A tiny robot"],0],
["Is the Yeti originally a Christmas character?",["Yes, always","No, it comes from mountain legends","It is a real Santa helper","It was invented for a phone game"],1],
["Which animated film features a friendly snow creature?",["Abominable","Finding Nemo","Cars","Toy Story"],0],
["What is a good way to treat nature?",["Leave trash everywhere","Respect animals and mountains","Break plants for fun","Waste water"],1]]}
];
let state={name:"",section:"",date:new Date().toISOString().slice(0,10),stage:"start",w:0,q:0,answers:[[],[],[]],games:[false,false,false],writing:"",points:0,gameStep:0,gameData:null};
try{const saved=JSON.parse(localStorage.getItem("holidayHeroes6"));if(saved&&saved.stage)state=saved}catch(e){}
const $=id=>document.getElementById(id),save=()=>localStorage.setItem("holidayHeroes6",JSON.stringify(state)),escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function render(){save();let a=$("app"),w=worlds[state.w];$("counter").textContent=state.stage==="start"?"Ready to begin":state.stage==="result"?"Adventure complete":`World ${Math.min(state.w+1,3)} of 3`;let done=state.w*6+state.q;$("bar").style.width=(state.stage==="result"?100:Math.min(98,done/18*100))+"%";
if(state.stage==="start"){a.innerHTML=`<div class="panel"><div class="hero">💚 🎁 ❄️</div><h1>HOLIDAY HEROES QUEST!</h1><p>Three friendly worlds. Fifteen questions. Three arcade games: fly, shoot, and jump! One creative mission!</p><p class="muted">Listen to the class discussion first. Then complete the quest. Questions are one at a time, and you can go back to review.</p><label>Student name<input id="nm" value="${escapeHTML(state.name)}" placeholder="Your full name"></label><label>Class / Section<input id="sec" value="${escapeHTML(state.section)}" placeholder="6A"></label><label>Date<input id="dt" type="date" value="${escapeHTML(state.date)}"></label><button onclick="begin()">START ADVENTURE ▶</button></div>`;return}
if(state.stage==="quiz"){let q=w.qs[state.q],answer=state.answers[state.w][state.q];a.innerHTML=`<div class="panel"><div class="hero">${w.icon}</div><h2>${escapeHTML(w.title)}</h2><p>${escapeHTML(w.intro)}</p><span class="chip">Question ${state.q+1} of 5</span><h2>${escapeHTML(q[0])}</h2>${q[1].map((x,i)=>`<button class="choice ${answer===i?"sel":""}" onclick="choose(${i})">${"ABCD"[i]}. ${escapeHTML(x)}</button>`).join("")}<p class="muted">Choose your answer. No correctness is shown until the end.</p><button onclick="previous()" ${state.q===0?"disabled":""}>◀ Previous</button><button onclick="next()" ${answer===undefined?"disabled":""}>${state.q===4?"Unlock Mini-Game 🎮":"Next ▶"}</button></div>`;return}
if(state.stage==="game"){a.innerHTML=`<div class="panel"><h2>${["🛷 GRINCH SKY RESCUE","🎯 YULE LAD SNOWBALL BLASTER","🏃 YETI GRAMMAR RUNNER"][state.w]}</h2><p>${["Fly through the sky! Collect 6 kindness stars. Avoid storm clouds.","Move and shoot snowballs at the correct grammar words. Hit 6 correct answers!","Run and jump over icy blocks. Collect 6 correct grammar words!"][state.w]}</p><p class="notice">Move: ◀ ▶ or A / D • ${state.w===0?"Fly: SPACE / ▲":state.w===1?"Shoot: SPACE / 🔥":"Jump: SPACE / ▲"} • Touch controls below • Wrong answers and collisions cost hearts.</p><div class="chip" id="gameHUD">⭐ 0/6 • ❤️ 4</div><canvas id="arcade" width="720" height="340" style="width:100%;max-width:720px;background:#09233d;border:3px solid #70d9ff;border-radius:14px;touch-action:none"></canvas><div style="display:flex;justify-content:center;gap:8px"><button onpointerdown="arcadeInput('left',true)" onpointerup="arcadeInput('left',false)" onpointerleave="arcadeInput('left',false)">◀ LEFT</button><button onpointerdown="arcadeInput('action',true)" onpointerup="arcadeInput('action',false)" onpointerleave="arcadeInput('action',false)">${state.w===1?"🔥 SHOOT":"⬆ JUMP / FLY"}</button><button onpointerdown="arcadeInput('right',true)" onpointerup="arcadeInput('right',false)" onpointerleave="arcadeInput('right',false)">RIGHT ▶</button></div><p class="muted" id="arcadeHelp">Play to unlock the next world. Grammar words come from today's Holiday Heroes lesson.</p></div>`;startArcade();return}
if(state.stage==="write"){a.innerHTML=`<div class="panel"><div class="hero">🌟</div><h2>FINAL MISSION: INVENT A HOLIDAY HELPER!</h2><p>Create a friendly holiday character. Give it a name, describe how it looks, and explain one kind thing it does. Write at least <b>12 words</b>.</p><textarea id="writing" rows="6" placeholder="My holiday helper is called... It looks like... It helps people by...">${escapeHTML(state.writing)}</textarea><p id="wc" class="muted">Words: ${countWords(state.writing)} / 12</p><button onclick="finish()" ${countWords(state.writing)<12?"disabled":""} id="finishBtn">FINISH & GRADE 🏆</button></div>`;$("writing").addEventListener("input",e=>{state.writing=e.target.value;save();$("wc").textContent="Words: "+countWords(state.writing)+" / 12";$("finishBtn").disabled=countWords(state.writing)<12});return}
if(state.stage==="result"){let correct=worlds.reduce((n,w,wi)=>n+w.qs.filter((q,qi)=>state.answers[wi][qi]===q[2]).length,0);a.innerHTML=`<div class="panel"><div class="hero">🏆</div><h1>QUEST COMPLETE!</h1><h2>Well done, ${escapeHTML(state.name)}!</h2><p>Knowledge score: <strong>${correct}/15</strong> (${Math.round(correct/15*100)}%)</p><p>Mini-games completed: <strong>${state.games.filter(Boolean).length}/3</strong></p><p>Writing mission: <strong>${countWords(state.writing)} words</strong></p><p class="notice">Your answers and creative writing are included in your submission. Click Save & Download and give the file to your teacher.</p><button onclick="download()">💾 SAVE & DOWNLOAD</button><button onclick="review()">Review answers</button><div id="review"></div></div>`;return}}
function countWords(t){return t.trim()?t.trim().split(/\s+/).length:0}
function begin(){let n=$("nm").value.trim(),s=$("sec").value.trim(),d=$("dt").value;if(!n||!s||!d){alert("Please enter your name, class, and date.");return}state.name=n;state.section=s;state.date=d;state.stage="quiz";render()}
function choose(i){state.answers[state.w][state.q]=i;render()}
function previous(){if(state.q>0){state.q--;render()}}
function next(){if(state.answers[state.w][state.q]===undefined)return;if(state.q<4){state.q++;render()}else{state.stage="game";state.gameStep=0;initGame();render()}}
let arcade=null,raf=0,keys={left:false,right:false,action:false};const grammar=[["The Grinch ___ kind.","becomes","become"],["The Yule Lads ___ from Iceland.","come","comes"],["A Yeti ___ in mountain legends.","appears","appear"],["The Grinch ___ Christmas at first.","dislikes","dislike"],["The children ___ shoes in the window.","put","puts"],["The Yule Lads ___ funny names.","have","has"],["A friendly Yeti ___ people.","helps","help"],["The story ___ us about kindness.","teaches","teach"]];
function arcadeInput(k,v){keys[k]=v}
window.addEventListener("keydown",e=>{if(["ArrowLeft","ArrowRight","ArrowUp","Space","KeyA","KeyD"].includes(e.code)&&arcade){e.preventDefault();keys[e.code==="ArrowLeft"||e.code==="KeyA"?"left":e.code==="ArrowRight"||e.code==="KeyD"?"right":"action"]=true}});
window.addEventListener("keyup",e=>{if(["ArrowLeft","ArrowRight","ArrowUp","Space","KeyA","KeyD"].includes(e.code)){keys[e.code==="ArrowLeft"||e.code==="KeyA"?"left":e.code==="ArrowRight"||e.code==="KeyD"?"right":"action"]=false}});
function startArcade(){cancelAnimationFrame(raf);let c=$("arcade");if(!c)return;arcade={c,ctx:c.getContext("2d"),x:95,y:210,vy:0,hearts:4,score:0,frame:0,objects:[],shots:[],cool:0,inv:0,spawn:0,question:0};raf=requestAnimationFrame(arcadeLoop)}
function arcadeLoop(){let g=arcade;if(!g||state.stage!=="game"||!document.getElementById("arcade"))return;let ctx=g.ctx,W=720,H=340;g.frame++;ctx.clearRect(0,0,W,H);let grad=ctx.createLinearGradient(0,0,0,H);grad.addColorStop(0,"#153b70");grad.addColorStop(1,"#0c5b83");ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);ctx.fillStyle="#ffffff30";for(let i=0;i<32;i++){let x=(i*113+g.frame*.45)%720,y=(i*71)%300;ctx.fillRect(x,y,3,3)}ctx.fillStyle="#e8f8ff";ctx.fillRect(0,300,720,40);ctx.font="20px system-ui";ctx.fillStyle="#09233d";ctx.fillText(["FLY & COLLECT","SHOOT THE CORRECT WORD","JUMP & COLLECT CORRECT WORDS"][state.w],20,326);
if(keys.left)g.x=Math.max(30,g.x-5);if(keys.right)g.x=Math.min(680,g.x+5);
if(state.w===0){if(keys.action)g.vy-=.62;g.vy=Math.max(-5,Math.min(4,g.vy+.29));g.y=Math.max(22,Math.min(270,g.y+g.vy))}
else if(state.w===1){g.y=255;if(keys.action&&g.cool<=0){g.shots.push({x:g.x+25,y:g.y-10});g.cool=14}}
else{if(keys.action&&g.y>=255){g.vy=-11}g.vy+=.6;g.y=Math.min(255,g.y+g.vy)}
g.cool=Math.max(0,g.cool-1);g.inv=Math.max(0,g.inv-1);
if(g.frame%85===0){let good=Math.random()>.33;let q=grammar[g.question%grammar.length];g.question++;g.objects.push({x:750,y:state.w===0?40+Math.random()*220:state.w===1?75+Math.random()*130:260,good,word:state.w===0?(good?"⭐":"☁️"):(good?q[1]:q[2]),question:q[0],speed:state.w===2?4:3.2})}
if(state.w===1){for(let shot of g.shots){shot.y-=9;ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(shot.x,shot.y,7,0,Math.PI*2);ctx.fill()}g.shots=g.shots.filter(z=>z.y>-20)}
for(let o of g.objects){o.x-=o.speed;ctx.fillStyle=o.good?"#d4fbe5":"#ffb3b3";ctx.strokeStyle="#153b70";ctx.lineWidth=2;ctx.beginPath();ctx.roundRect(o.x-20,o.y-24,state.w===0?55:Math.max(90,ctx.measureText(o.word).width+30),43,12);ctx.fill();ctx.stroke();ctx.fillStyle="#14253d";ctx.font="bold 17px system-ui";ctx.fillText(o.word,o.x-9,o.y+3);if(state.w===1){for(let shot of g.shots){if(Math.abs(shot.x-o.x)<48&&Math.abs(shot.y-o.y)<27){o.x=-200;shot.y=-100;hitArcade(g,o.good)}}}else if(Math.abs(g.x-o.x)<42&&Math.abs(g.y-o.y)<35){o.x=-200;hitArcade(g,o.good)}}g.objects=g.objects.filter(o=>o.x>-120);
ctx.font="45px system-ui";ctx.globalAlpha=g.inv&&g.frame%8<4?.35:1;ctx.fillText(["🧹","🎅","🦶"][state.w],g.x-25,g.y+12);ctx.globalAlpha=1;
let hud=$("gameHUD");if(hud)hud.textContent="⭐ "+g.score+"/6 • ❤️ "+g.hearts;
if(g.score>=6){cancelAnimationFrame(raf);arcade=null;state.games[state.w]=true;state.gameData=null;let label=["Grinch flight complete!","Yule Lad snowball mission complete!","Yeti grammar runner complete!"][state.w];if(state.w<2){state.w++;state.q=0;state.stage="quiz"}else state.stage="write";save();alert("🎉 "+label+" Next adventure unlocked!");render();return}
if(g.hearts<=0){cancelAnimationFrame(raf);arcade=null;alert("❄️ Try again! You can do it!");startArcade();return}
raf=requestAnimationFrame(arcadeLoop)}
function hitArcade(g,good){if(g.inv)return;if(good)g.score++;else{g.hearts--;g.inv=45}}
function finish(){state.writing=$("writing").value;if(countWords(state.writing)<12)return;state.stage="result";render()}
function review(){let text=worlds.map((w,wi)=>"<h3>"+escapeHTML(w.title)+"</h3>"+w.qs.map((q,qi)=>`<p>${qi+1}. ${escapeHTML(q[0])}<br>Your answer: ${escapeHTML(q[1][state.answers[wi][qi]])}<br>Correct answer: ${escapeHTML(q[1][q[2]])}</p>`).join("")).join("");$("review").innerHTML=text}
function download(){let correct=worlds.reduce((n,w,wi)=>n+w.qs.filter((q,qi)=>state.answers[wi][qi]===q[2]).length,0);let text=`HOLIDAY HEROES QUEST — GRADE 6\nStudent: ${state.name}\nClass: ${state.section}\nDate: ${state.date}\nKnowledge Score: ${correct}/15\nMini-Games: ${state.games.filter(Boolean).length}/3\n\n`;worlds.forEach((w,wi)=>{text+=`\n${w.title}\n`;w.qs.forEach((q,qi)=>{text+=`${qi+1}. ${q[0]}\nStudent answer: ${q[1][state.answers[wi][qi]]}\nCorrect answer: ${q[1][q[2]]}\n`})});text+=`\nFINAL WRITING MISSION:\n${state.writing}\n`;let blob=new Blob([text],{type:"text/plain;charset=utf-8"}),url=URL.createObjectURL(blob),link=document.createElement("a");link.href=url;link.download="Holiday_Heroes_"+state.name.replace(/[^a-z0-9]/gi,"_")+".txt";document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),2000)}
render();
</script></body></html>
