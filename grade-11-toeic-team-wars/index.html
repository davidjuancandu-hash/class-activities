<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TOEIC Team Wars — Projector Backup</title><style>*{box-sizing:border-box}body{background:#0d1830;color:#fff;font:clamp(18px,2.4vw,26px) system-ui;margin:0}main{max-width:1250px;margin:auto;padding:24px}h1{color:#ffdf8a;font-size:clamp(32px,5vw,60px)}h2{font-size:clamp(28px,4vw,45px)}.panel{background:#213559;border:2px solid #6688b5;border-radius:22px;padding:26px;margin:20px 0}.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}button,select{padding:13px 20px;border:0;border-radius:12px;background:#ffdb83;color:#182842;font:inherit;font-weight:800;cursor:pointer}button:disabled{opacity:.4}.secondary{background:#d6eaff}.team{background:#334e78;padding:12px;border-radius:12px;min-width:160px;flex:1}.team b{display:block;font-size:28px}.team button{padding:7px 14px}.prompt{background:#334d77;padding:25px;border-radius:15px;margin:20px 0;font-size:clamp(23px,3vw,38px);line-height:1.4}.photo{width:100%;max-height:520px;object-fit:cover;border-radius:15px}.hidden{display:none}.timer{font-size:clamp(36px,6vw,80px);font-weight:900;color:#a4f4cd}.muted{color:#b6cae5;font-size:16px}</style></head><body><main><h1>🏆 TOEIC TEAM WARS</h1><p>One teacher computer. One projector. Five teams. Zero student devices required.</p><div class="panel"><label>Choose your class: <select id="mode" onchange="selectMode()"></select></label><p id="description"></p><div class="row" id="teams"></div></div><div class="panel"><div class="row"><button onclick="prev()">◀ Previous</button><button onclick="next()">Next Challenge ▶</button><button class="secondary" onclick="toggleAnswer()">👁 Show / Hide Teacher Hint</button><button class="secondary" onclick="togglePhoto()">📸 Show / Hide Photo</button></div><h2 id="roundTitle"></h2><p id="instructions"></p><div class="prompt" id="prompt"></div><div id="photoBox" class="hidden"><img class="photo" id="photo" alt="Workplace practice photograph"></div><p id="hint" class="muted hidden"></p><div class="row"><button onclick="startTimer(15)">⏱ 15 sec</button><button onclick="startTimer(30)">⏱ 30 sec</button><button onclick="startTimer(60)">⏱ 60 sec</button><button onclick="stopTimer()">Stop</button><span class="timer" id="clock">0:00</span></div><p class="muted">Scoring suggestion: +10 correct, +5 for a clear explanation. Rotate the writer, speaker, reader, and answer captain every round.</p></div><div class="panel"><h2>🎉 Team Championship</h2><button onclick="champion()">SHOW WINNER</button><p id="winner"></p><button class="secondary" onclick="resetScores()">Reset scores</button></div></main><script>
const modes=[{"title":"CLASS 1 — PHOTO DETECTIVE TEAM WARS","time":60,"rounds":[["Photo observation","Study the photo on screen for 15 seconds. Hide it, then teams list five visible details.",["Office meeting","Airport terminal","Hotel reception","Warehouse"]],["Listening ambush","Teacher reads each prompt aloud; teams write the best response.",["Where is the meeting? — In Room 12.","When is the deadline? — On Friday.","Who approved the order? — The supervisor.","Why is the flight delayed? — Bad weather."]],["Vocabulary relay","Teams explain each word and write one example sentence.",["postpone","shipment","invoice","refund"]],["Grammar battle","Teams choose the missing word and explain why.",["The manager ___ the report yesterday. (completed)","Please arrive ___ nine. (by)","The meeting was ___ until Friday. (postponed)","She is responsible ___ bookings. (for)"]],["Final boss","Each team gives a complete workplace sentence using two TOEIC words.",["appointment + confirm","shipment + delay","refund + customer","deadline + supervisor"]]]},{"title":"CLASS 2 — LISTENING AMBUSH","time":30,"rounds":[["Response showdown","Read each question aloud once. Teams write a natural response.",["Where is the reception desk?","When does the training begin?","Could you send the invoice?","Who ordered the supplies?"]],["Distractor detective","Teams explain why the wrong reply is tempting.",["Where is the meeting? A. At three B. In Room 5 (B)","When does the store open? A. At nine B. The manager (A)","Who called the customer? A. Yesterday B. Maria (B)","Why was the order delayed? A. Heavy rain B. The warehouse (A)"]],["Speed final","Teams have 15 seconds to make the most natural response.",["Would you mind closing the door?","Have you finished the report?","How long will the repairs take?","Didn't you receive the email?"]]]},{"title":"CLASS 3 — VOCABULARY HEIST & GRAMMAR BATTLE","time":60,"rounds":[["Vocabulary heist","Define each term; then use it in a workplace sentence.",["deadline","invoice","supervisor","available"]],["Business email rescue","Rewrite each message in professional English.",["send me bill now","meeting changed friday","sorry for late package","you free tomorrow?"]],["Grammar attack","Choose the correct form and explain.",["She is responsible ___ scheduling. (for)","The documents were ___ yesterday. (sent)","Our profits increased ___ 10%. (by)","Please ___ your reservation. (confirm)"]],["Photo description sprint","Teacher shows a photo for 15 seconds, then hides it. Teams write one accurate sentence.",["Office","Restaurant","Airport","Warehouse"]],["Final boss","Create a 3-sentence professional email using these prompts.",["Request a meeting","Confirm an order","Apologize for a delay","Ask for information"]]]},{"title":"CLASS 4 — TOEIC TEAM CHAMPIONSHIP","time":30,"rounds":[["Listening lightning","Read prompts once. Teams write the best reply.",["Where is the interview?","When will the package arrive?","Who manages the office?","Could you confirm the date?"]],["Grammar sprint","Fill the blank.",["The manager ___ the email yesterday. (sent)","The seminar starts ___ ten. (at)","Please contact ___ reception desk. (the)","The meeting was ___. (postponed)"]],["Final photo memory","Show a workplace photo for 15 seconds, hide it, then ask teams to describe five details.",["Meeting room","Restaurant","Airport","Warehouse"]]]}],photos=["https://images.unsplash.com/photo-1556761175-b413da4baf72?w=1200&q=80","https://images.unsplash.com/photo-1436491865332-7a61a109cc05?w=1200&q=80","https://images.unsplash.com/photo-1566073771259-6a8506099945?w=1200&q=80","https://images.unsplash.com/photo-1586528116311-ad8dd3c8310d?w=1200&q=80"];let mode=0,round=0,challenge=0,seconds=0,interval=null,scores=[0,0,0,0,0];const $=id=>document.getElementById(id);
modes.forEach((m,i)=>{let o=document.createElement('option');o.value=i;o.textContent=m.title+' ('+m.time+' min)';$('mode').appendChild(o)});
function selectMode(){mode=+$('mode').value;round=0;challenge=0;render()}function render(){let m=modes[mode],r=m.rounds[round];$('description').textContent=m.time+'-minute group backup • '+m.rounds.length+' rounds • '+m.rounds.reduce((a,b)=>a+b[2].length,0)+' challenges';$('roundTitle').textContent='ROUND '+(round+1)+'/'+m.rounds.length+' — '+r[0];$('instructions').textContent=r[1];$('prompt').textContent=r[2][challenge];$('hint').textContent='Teacher hint / suggested response: '+(r[2][challenge].match(/\(([^)]+)\)$/)?.[1]||'Accept accurate English with a clear explanation.');$('hint').classList.add('hidden');$('photoBox').classList.add('hidden');$('photo').src=photos[challenge%photos.length];$('teams').innerHTML=scores.map((n,i)=>'<div class="team"><span>TEAM '+String.fromCharCode(65+i)+'</span><b>'+n+' pts</b><button onclick="add('+i+',10)">+10</button><button onclick="add('+i+',5)">+5</button><button onclick="add('+i+',-5)">−5</button></div>').join('')}
function next(){let r=modes[mode].rounds[round];if(challenge<r[2].length-1)challenge++;else if(round<modes[mode].rounds.length-1){round++;challenge=0}else{champion();return}render()}function prev(){if(challenge>0)challenge--;else if(round>0){round--;challenge=modes[mode].rounds[round][2].length-1}render()}function add(i,n){scores[i]=Math.max(0,scores[i]+n);render()}function toggleAnswer(){$('hint').classList.toggle('hidden')}function togglePhoto(){$('photoBox').classList.toggle('hidden')}function stopTimer(){clearInterval(interval);interval=null}function startTimer(n){stopTimer();seconds=n;$('clock').textContent='0:'+String(seconds).padStart(2,'0');interval=setInterval(()=>{seconds--;$('clock').textContent=Math.floor(seconds/60)+':'+String(seconds%60).padStart(2,'0');if(seconds<=0){stopTimer();$('clock').textContent='TIME!'}},1000)}function champion(){let high=Math.max(...scores),w=scores.map((x,i)=>x===high?'TEAM '+String.fromCharCode(65+i):null).filter(Boolean);$('winner').textContent='🏆 '+w.join(' & ')+' — '+high+' points!'}function resetScores(){if(confirm('Reset all team scores?')){scores=[0,0,0,0,0];$('winner').textContent='';render()}}render();
</script></body></html>
