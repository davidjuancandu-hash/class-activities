<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dream Grammar Triple Arcade</title><style>
:root{font-family:system-ui,Arial;background:#101326;color:#fff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0,#333d77,#101326 65%);min-height:100vh}.wrap{max-width:850px;margin:auto;padding:20px}header{text-align:center}h1{font-size:clamp(28px,6vw,48px);margin:12px 0;color:#ffdb6d}h2{margin:8px 0}.muted{color:#d0d6f5}.panel{background:#202747;border:2px solid #5364a4;border-radius:20px;padding:22px;box-shadow:0 12px 30px #0005}.top{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}.chip{background:#10172f;padding:9px 13px;border-radius:30px;font-weight:800}.track{height:14px;background:#11182e;border-radius:20px;overflow:hidden;margin:16px 0}.fill{height:100%;background:linear-gradient(90deg,#4ce0c3,#fce16d);width:0;transition:width .3s}.question{font-size:clamp(22px,4vw,32px);font-weight:800;margin:28px 0;line-height:1.35}.answers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}button{cursor:pointer;border:0;border-radius:13px;padding:15px;font-weight:800;font-size:17px;background:#ffda70;color:#171a2d}button:hover{filter:brightness(1.12)}button:focus-visible{outline:4px solid #7ee7ff}.answer{background:#343f72;color:white;text-align:left;min-height:80px}.answer:disabled{cursor:default}.correct{background:#237b61!important}.wrong{background:#983a54!important}.hidden{display:none!important}input{padding:13px;border-radius:10px;border:2px solid #7382bb;background:#10172f;color:white;font-size:17px;width:100%}.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:20px 0}.feedback{min-height:58px;font-size:19px;font-weight:700;margin-top:18px}.boss{font-size:65px;text-align:center;filter:drop-shadow(0 5px 15px #ff6e7055);animation:bob 1.4s infinite alternate}@keyframes bob{to{transform:translateY(-9px)}}.steps{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:18px 0}.step{padding:9px;border-radius:10px;background:#34406d}.done{background:#176e5c}.foot{font-size:13px;text-align:center;color:#aeb8dd;margin:20px}#next{width:100%;margin-top:12px}@media(max-width:540px){.answers,.fields{grid-template-columns:1fr}.wrap{padding:10px}.panel{padding:15px}}
</style></head><body><div class="wrap"><header><h1>🌙 DREAM GRAMMAR ARCADE ⚡</h1><p class="muted">The Mystery of Dreams • Three games • About 10 minutes • Complete all three to win!</p></header><div class="steps" id="steps"><span class="step">1 ⚡ Past Tense Panic</span><span class="step">2 🔧 Sentence Surgery</span><span class="step">3 👹 Nightmare Boss Battle</span></div><main class="panel" id="app"></main><p class="foot">Answer with the mouse, touchscreen, or keys 1–4. Progress is saved on this browser.</p></div><script>
const games=[
{title:"⚡ PAST TENSE PANIC",desc:"The dream portal is closing! Choose the correct past-tense verb.",emoji:"🏃",items:[
["Last night, I ___ through a mysterious forest.",["run","ran","runned","running"],1],
["A giant dragon ___ above the castle.",["fly","flied","flew","flying"],2],
["I ___ a strange noise behind the door.",["heared","hear","heard","hearing"],2],
["My best friend ___ beside me.",["stood","standed","standing","stand"],0],
["We ___ a hidden staircase.",["finded","found","finding","find"],1],
["The monster ___ under the bed.",["hided","hide","hid","hiding"],2],
["I ___ afraid when the lights went out.",["am","were","be","was"],3],
["The clock ___ at midnight.",["stopped","stoped","stop","stopping"],0],
["My sister ___ a glowing key.",["taked","took","taking","take"],1],
["Suddenly, I ___ up from my dream.",["wake","woke","waked","waking"],1]]},
{title:"🔧 SENTENCE SURGERY",desc:"Fix the dream diary! Choose the correctly written sentence.",emoji:"🛠️",items:[
["Which sentence is correct?",["Yesterday I see a ghost.","Yesterday, I saw a ghost.","Yesterday, I seeing a ghost.","Yesterday, I sees a ghost."],1],
["Choose the correct sentence.",["The monster was very scary.","The monster were very scary.","The monster be very scary.","The monster are very scary yesterday."],0],
["Fix the capitalization and punctuation.",["when I woke up I screamed.","When I woke up, I screamed.","When i woke up I screamed","when I woke up, I screamed"],1],
["Which sentence uses past tense correctly?",["I goed into the cave.","I go into the cave yesterday.","I went into the cave.","I going into the cave."],2],
["Choose the correct sentence.",["We didn't saw the dragon.","We didn't see the dragon.","We don't saw the dragon.","We didn't seeing the dragon."],1],
["Which is a complete sentence?",["Because the shadow was moving.","Running across the dark bridge.","The shadow followed me home.","Under the old wooden bed."],2],
["Choose the best punctuation.",["Suddenly the door opened.","Suddenly, the door opened.","suddenly, the door opened","Suddenly the door opened"],1],
["Choose the correct sentence.",["There was three ghosts.","There were three ghosts.","There is three ghosts yesterday.","There be three ghosts."],1],
["Which sentence has the best sequence word?",["Finally, I woke up safely.","Finally I wake up safely yesterday.","finally I woke up safely","Finally, I waking up safely."],0],
["Choose the correctly written sentence.",["I felt happy because the nightmare ended.","I feel happy because the nightmare end yesterday.","I felt happy because the nightmare end.","i felt happy because the nightmare ended"],0]]},
{title:"👹 NIGHTMARE BOSS BATTLE",desc:"Three bosses guard the exit! Defeat them with past tense, details, and correct sentences.",emoji:"👹",items:[
["BOSS 1: The Shadow! Choose the past tense of 'begin'.",["began","begun","begined","beginning"],0],
["BOSS 1: Which sentence describes the setting?",["I felt nervous.","I woke up.","The castle stood beside a dark lake.","I will remember it."],2],
["BOSS 1: Complete it: 'The lights ___ out suddenly.'",["go","went","goed","going"],1],
["BOSS 2: The Dream Dragon! Choose the past tense of 'catch'.",["catched","catching","caught","catch"],2],
["BOSS 2: Which sentence explains a feeling and a reason?",["I was scared because the footsteps grew louder.","I was scared.","Because the footsteps.","Scared and footsteps."],0],
["BOSS 2: Choose the correct sentence.",["While I run, the dragon roared.","While I was running, the dragon roared.","While I running, the dragon roar.","While I ran, the dragon roaring."],1],
["BOSS 3: The Nightmare King! Past tense of 'choose'?",["choosed","chosen","choosing","chose"],3],
["BOSS 3: Which is the strongest ending?",["Then stuff happened.","I don't know.","When I woke up, I felt relieved because the danger was over.","The end."],2],
["BOSS 3: Fix the sentence.",["I didn't knew it was a dream.","I didn't know it was a dream.","I didn't knowing it was a dream.","I don't knew it was a dream."],1],
["FINAL STRIKE: Which sentence is correct?",["After I woke up, I wrote my dream in a notebook.","After I wake up, I wrote my dream in a notebook yesterday.","After I woke up I writed my dream.","after I woke up, I wrote my dream"],0]]}
];
const KEY="dreamGrammarTripleArcade_v1";let state;try{state=JSON.parse(localStorage.getItem(KEY)||"null")}catch(e){}if(!state||!Array.isArray(state.scores))state={name:"",section:"",game:0,q:0,scores:[0,0,0],mistakes:[0,0,0],completed:false};let locked=false;const app=document.getElementById("app"),steps=document.getElementById("steps");function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}function esc(s){return String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}function updateSteps(){steps.querySelectorAll(".step").forEach((e,i)=>{e.classList.toggle("done",i<state.game||state.completed)})}function render(){locked=false;updateSteps();if(state.completed){const total=state.scores.reduce((a,b)=>a+b,0);app.innerHTML='<div class="boss">🏆</div><h2>YOU ESCAPED THE NIGHTMARE!</h2><p>All three grammar games completed. Amazing work, <b>'+esc(state.name)+'</b>!</p><h2>Final score: '+total+' / 30</h2><p>⚡ Past Tense Panic: '+state.scores[0]+'/10</p><p>🔧 Sentence Surgery: '+state.scores[1]+'/10</p><p>👹 Nightmare Boss Battle: '+state.scores[2]+'/10</p><p class="muted">Completion certificate • '+new Date().toLocaleDateString()+'</p><button id="download">⬇️ SAVE & DOWNLOAD MY RESULTS</button><p class="muted">Show this screen to your teacher.</p>';document.getElementById("download").onclick=download;return}
if(!state.name){app.innerHTML='<h2>🎮 ENTER THE DREAM ARCADE</h2><p>Complete all 30 challenges across three fast games. Your progress saves automatically on this device.</p><div class="fields"><label>Student name<input id="student" maxlength="80" placeholder="First and last name"></label><label>Class / Section<input id="section" maxlength="60" placeholder="Grade 7 section"></label></div><button id="start">START THE 3-GAME CHALLENGE →</button>';document.getElementById("start").onclick=()=>{const n=document.getElementById("student").value.trim();if(!n){alert("Enter your name first.");return}state.name=n;state.section=document.getElementById("section").value.trim();save();render()};return}
const g=games[state.game],q=g.items[state.q];app.innerHTML='<div class="top"><span class="chip">GAME '+(state.game+1)+' / 3</span><span class="chip">QUESTION '+(state.q+1)+' / 10</span><span class="chip">⭐ '+state.scores[state.game]+' points</span></div><div class="track"><div class="fill" style="width:'+((state.q)/10*100)+'%"></div></div><h2>'+g.title+'</h2><p class="muted">'+g.desc+'</p>'+(state.game===2?'<div class="boss">'+(state.q<3?'👤':state.q<6?'🐉':'👑')+'</div>':'<div class="boss">'+g.emoji+'</div>')+'<div class="question">'+esc(q[0])+'</div><div class="answers">'+q[1].map((v,i)=>'<button class="answer" data-i="'+i+'">'+(i+1)+'. '+esc(v)+'</button>').join("")+'</div><div class="feedback" id="feedback" aria-live="polite"></div><button id="next" class="hidden">NEXT →</button>';app.querySelectorAll(".answer").forEach(b=>b.onclick=()=>answer(Number(b.dataset.i)));document.getElementById("next").onclick=advance}
function answer(i){if(locked)return;locked=true;const q=games[state.game].items[state.q],correct=i===q[2];if(correct)state.scores[state.game]++;else state.mistakes[state.game]++;app.querySelectorAll(".answer").forEach(b=>{b.disabled=true;if(Number(b.dataset.i)===q[2])b.classList.add("correct");else if(Number(b.dataset.i)===i)b.classList.add("wrong")});document.getElementById("feedback").textContent=correct?"✅ GREAT HIT! +1 point":"💥 NOT QUITE! The green answer is correct.";const n=document.getElementById("next");n.classList.remove("hidden");n.textContent=state.q===9?(state.game===2?"🏆 FINISH & SEE RESULTS":"🎮 UNLOCK NEXT GAME →"):"NEXT QUESTION →";save()}
function advance(){if(!locked)return;state.q++;if(state.q>=10){state.game++;state.q=0;if(state.game>=3)state.completed=true}save();render()}function download(){const txt=["THE MYSTERY OF DREAMS — DREAM GRAMMAR TRIPLE ARCADE","Student: "+state.name,"Class / Section: "+state.section,"Date: "+new Date().toLocaleDateString(),"Completed: YES","Past Tense Panic: "+state.scores[0]+"/10","Sentence Surgery: "+state.scores[1]+"/10","Nightmare Boss Battle: "+state.scores[2]+"/10","TOTAL: "+state.scores.reduce((a,b)=>a+b,0)+"/30"].join("\n");const a=document.createElement("a"),u=URL.createObjectURL(new Blob([txt],{type:"text/plain;charset=utf-8"}));a.href=u;a.download="Dream-Grammar-Arcade-"+state.name.replace(/[^a-z0-9_-]/gi,"_")+".txt";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000)}document.addEventListener("keydown",e=>{if(state.completed||!state.name)return;if(!locked&&/^[1-4]$/.test(e.key)){const b=app.querySelector('.answer[data-i="'+(Number(e.key)-1)+'"]');if(b)b.click()}else if(locked&&e.key==="Enter")document.getElementById("next")?.click()});render();
</script></body></html>
