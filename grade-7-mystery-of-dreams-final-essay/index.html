<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mystery of Dreams — Final Essay Quest</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#364f79,#11152b 70%);color:#f4f5ff;font:17px system-ui,sans-serif}main{max-width:880px;margin:auto;padding:18px}header{text-align:center}h1{font-size:clamp(28px,5vw,43px);color:#ffdc9c}section{background:#242b49;border:2px solid #778dc4;border-radius:20px;padding:clamp(17px,4vw,30px)}h2{color:#bce8ff}p{line-height:1.55}.hint{background:#35476a;border-left:5px solid #ffda8a;padding:14px;border-radius:9px}.progress{background:#151b35;height:12px;border-radius:20px;margin:14px 0;overflow:hidden}.progress div{height:100%;background:#8bdbb8}input,textarea{width:100%;padding:12px;margin:8px 0 14px;border:2px solid #b8c8e7;border-radius:9px;font:inherit;color:#18253b;background:#fff}textarea{min-height:150px;resize:vertical}button{border:0;border-radius:10px;padding:13px 17px;margin:5px;background:#ffda8a;color:#263047;font:inherit;font-weight:800;cursor:pointer}button:disabled{opacity:.4;cursor:not-allowed}.choice{display:block;width:100%;text-align:left;background:#405b84;color:white;border:2px solid #7b96c0}.choice.selected{border-color:#ffe79e;background:#576c91}.nav{display:flex;justify-content:space-between;gap:10px;margin-top:20px}.small{font-size:14px;color:#cbd7ef}.good{color:#aaf3c7}canvas{width:100%;max-width:720px;background:#112b52;border-radius:12px;border:2px solid #98d9ff;touch-action:none}.pad{display:flex;justify-content:center;flex-wrap:wrap}.tag{display:inline-block;background:#435679;padding:8px;border-radius:12px;margin:4px}.essay{white-space:pre-wrap;background:#17213d;padding:18px;border-radius:10px;line-height:1.7}label{display:block;margin:10px 0}a{color:#bce8ff}</style></head><body><main><header><h1>🌙 THE MYSTERY OF DREAMS</h1><strong>GRADE 7 • FINAL ESSAY QUEST • 60 MINUTES</strong><p>Learn the rules. Beat the grammar challenge. Run through dreamland. Finish your three-paragraph essay!</p></header><section><div id="status"></div><div class="progress"><div id="bar"></div></div><div id="app"></div><div class="nav"><button id="prev" onclick="back()">◀ Previous</button><button id="next" onclick="next()">Continue ▶</button></div></section></main><script>
const KEY="dreamsFinalEssayQuest_v1",oldKey="dreamQuestTuesdayAutumn_v1",monKey="nightmareQuestPart2Monday_v1";const $=x=>document.getElementById(x),esc=t=>String(t||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])),count=t=>(String(t||"").match(/[\p{L}\p{N}]+(?:['’-][\p{L}\p{N}]+)*/gu)||[]).length;
const lessons=[["Capitalization","Capitalization means using a capital (uppercase) letter at the beginning of a sentence and for proper nouns such as names, countries, and the word I.","Example: I dreamed about a strange forest in Costa Rica."],["Punctuation","Punctuation marks organize writing. A period (.) ends a statement; a question mark (?) ends a question; an exclamation mark (!) shows strong emotion; a comma (,) separates ideas or introductory words; an apostrophe (') can show possession or a contraction.","Example: Suddenly, I heard a scream! Was someone behind me?"],["Complete Sentences","A complete sentence expresses a full thought, usually with a subject and a verb. A fragment leaves something important unfinished.","Complete: The monster followed me. Fragment: Because the monster."],["Paragraph Structure","A paragraph is a group of related sentences about one main idea. Your essay needs three paragraphs: beginning (introduce dream, setting, characters), middle (events and feelings), and ending (what happened and why it matters). Start a new paragraph when the main part of your story changes.","Beginning → Middle → Ending."],["Past Tense and Sequence","Use past tense for events that already happened: go→went, see→saw, run→ran, fly→flew, wake→woke, feel→felt. Use sequence words to show order: First, Then, Suddenly, After that, Finally.","Example: First, I walked into a cave. Suddenly, I saw a glowing door."],["Revising and Details","Revision means improving your writing for clarity and meaning. Add vivid details about what you saw, heard, and felt. Check capitalization, punctuation, complete sentences, past tense, and paragraph breaks. Do not repeat the same idea just to add words.","Example: Instead of 'I was scared,' write 'I felt frightened because the hallway grew darker.'"]];
const qs=[["Which sentence uses capitalization correctly?",["i saw a monster in costa rica.","I saw a monster in Costa Rica.","I Saw A Monster In costa rica."],1],["Which mark ends a question?",[".","!", "?"],2],["Which is a complete sentence?",["Because the dream was strange.","The Yeti followed me.","Running through the night."],1],["What belongs in paragraph 2?",["Dream events and feelings","Only the essay title","Only your name"],0],["Choose the past tense of 'see'.",["seed","saw","seeing"],1],["Which word shows an ending?",["Finally","First","Suddenly"],0],["Choose the correctly punctuated sentence.",["Suddenly I heard a noise","Suddenly, I heard a noise.","suddenly i heard a noise"],1],["Which sentence adds a useful detail?",["It was scary.","It was scary scary scary.","I trembled when the dark door slowly opened."],2],["How many paragraphs are required?",["One","Three","Five"],1],["Which is the best revision?",["i wake up and see a dragon","I woke up and saw a dragon.","I waked up and seed a dragon"],1]];
let s={step:0,max:0,name:"",section:"",date:new Date().toISOString().slice(0,10),answers:[],title:"",paragraphs:["","",""],checks:[false,false,false,false,false],gameDone:false,gameScore:0,...JSON.parse(localStorage.getItem(KEY)||"{}")};if(!Array.isArray(s.paragraphs)||s.paragraphs.length!==3)s.paragraphs=["","",""];let g=null,frame=0,keys={left:false,right:false,jump:false};function save(){try{localStorage.setItem(KEY,JSON.stringify(s))}catch(e){}}function wc(){return s.paragraphs.reduce((a,b)=>a+count(b),0)}function loadPrior(){let old=JSON.parse(localStorage.getItem(oldKey)||"null");if(!old)return false;let p1=(old.monday||[]).slice(0,3).join(" "),p2=(old.monday||[]).slice(3,7).join(" "),p3=(old.ending||[]).join(" ");if(!p1.trim()&&!p2.trim()&&!p3.trim())return false;s.paragraphs=[p1,p2,p3];if(!s.name)s.name=old.name||"";if(!s.section)s.section=old.className||"";save();render();return true}
function capture(){if(s.step===0){s.name=$("name")?.value.trim()||"";s.section=$("section")?.value.trim()||"";s.date=$("date")?.value||s.date}if(s.step===19){s.title=$("title")?.value.trim()||"";s.paragraphs=s.paragraphs.map((x,i)=>$("p"+i)?.value||"")}if(s.step===20)s.checks=s.checks.map((v,i)=>$("check"+i)?.checked||false);save()}
function render(){save();$("status").textContent=s.step===0?"START":s.step<=6?"WRITING SKILLS REVIEW • "+s.step+"/6":s.step<=16?"GRAMMAR QUIZ • "+(s.step-6)+"/10":s.step===17?"GRAMMAR ARCADE":s.step===18?"ESSAY PREPARATION":s.step===19?"FINAL ESSAY WORKSHOP":s.step===20?"FINAL REVISION CHECKLIST":"SUBMISSION";$("bar").style.width=(s.step/21*100)+"%";$("prev").style.display=s.step===0||s.step===21?"none":"inline-block";$("next").style.display=s.step===17||s.step===21?"none":"inline-block";$("next").textContent=s.step===20?"FINISH + GRADE 🏆":"Continue ▶";let h="";
if(s.step===0)h='<h2>Welcome, Dream Writer!</h2><p>Today you will review six important writing skills, answer ten grammar questions, play a dream runner game, and finish your original dream or nightmare essay.</p><label>Student Name<input id="name" value="'+esc(s.name)+'"></label><label>Class / Section<input id="section" value="'+esc(s.section)+'"></label><label>Date<input type="date" id="date" value="'+esc(s.date)+'"></label><p class="hint">Your work saves automatically on this device. Keep your name, class, and date accurate.</p>';
else if(s.step<=6){let l=lessons[s.step-1];h='<h2>'+esc(l[0])+'</h2><p>'+esc(l[1])+'</p><p class="hint">'+esc(l[2])+'</p><p class="small">Read this information carefully. You will use it in the grammar challenge and your essay.</p>'}
else if(s.step<=16){let i=s.step-7,q=qs[i];h='<h2>Question '+(i+1)+' of 10</h2><p>'+esc(q[0])+'</p>'+q[1].map((a,j)=>'<button class="choice '+(s.answers[i]===j?"selected":"")+'" onclick="choose('+j+')">'+String.fromCharCode(65+j)+'. '+esc(a)+'</button>').join("")+'<p class="small">Answers are not graded until the end. Choose carefully!</p>'}
else if(s.step===17)h='<h2>🏃 DREAMLAND GRAMMAR RUNNER</h2><p>Jump over nightmare obstacles and collect 6 glowing grammar stars! The stars show correct English forms; avoid incorrect forms and obstacles. You have four hearts.</p><p class="hint">Move: ← → or A / D • Jump: SPACE or ↑ • Touch controls are below.</p><p id="hud">⭐ 0 / 6 • ❤️ 4</p><canvas id="arcade" width="720" height="340"></canvas><div class="pad"><button onpointerdown="keys.left=true" onpointerup="keys.left=false" onpointerleave="keys.left=false">◀ LEFT</button><button onpointerdown="keys.jump=true" onpointerup="keys.jump=false" onpointerleave="keys.jump=false">⬆ JUMP</button><button onpointerdown="keys.right=true" onpointerup="keys.right=false" onpointerleave="keys.right=false">RIGHT ▶</button></div><p id="gameMessage" class="small">Complete the arcade to unlock your final essay.</p>';
else if(s.step===18)h='<h2>📝 Prepare Your Final Essay</h2><p>Use your earlier planner and writing from Monday and Tuesday. Your final essay needs a title and three complete paragraphs: beginning, middle, and ending.</p><p class="hint">Your original planner targeted 100–120 words. For this final revision, aim for <b>125–150 words</b> by adding useful setting, event, and feeling details. Never add meaningless filler.</p><button onclick="loadPrior()">📥 Import my previous Tuesday writing from this device</button><p class="small">If your writing is on another device, copy and paste your paragraphs into the next step. Importing will replace the current essay boxes.</p>';
else if(s.step===19)h='<h2>✍️ Write Your Complete Dream Essay</h2><p>Join your sentences into natural paragraphs. Remove sentence numbers and question labels. Add vivid details and correct mistakes.</p><label>Essay Title<input id="title" value="'+esc(s.title)+'" placeholder="The Night I Flew Over the Mountains"></label>'+["Paragraph 1 — Beginning (dream type, setting, characters)","Paragraph 2 — Middle (events, vivid details, feelings)","Paragraph 3 — Ending (ending, waking up, meaning)"].map((v,i)=>'<label>'+v+'<textarea id="p'+i+'" oninput="updateEssay()" placeholder="Write your paragraph here...">'+esc(s.paragraphs[i])+'</textarea></label>').join("")+'<p class="hint" id="wordcount">Essay words: '+wc()+' / minimum 125. Each of the three paragraphs must contain at least 4 words.</p>';
else if(s.step===20)h='<h2>🔎 Final Revision Checklist</h2><p>Read your entire essay aloud before submitting. Check each item honestly.</p>'+["My essay has a title and three paragraphs.","I used capital letters and correct punctuation.","My sentences are complete and mostly use past tense.","My dream has a beginning, middle, ending, vivid details, and feelings.","I reread my essay and corrected mistakes."].map((v,i)=>'<label><input style="width:auto" type="checkbox" id="check'+i+'" '+(s.checks[i]?"checked":"")+' onchange="capture()"> '+v+'</label>').join("")+'<p class="hint">Essay word count: <b>'+wc()+'</b>. Minimum: 125 words. Review questions will be graded separately.</p>';
else{let score=qs.filter((q,i)=>s.answers[i]===q[2]).length;h='<h2>🏆 Your Dream Essay Is Complete!</h2><p><b>Student:</b> '+esc(s.name)+' • <b>Class:</b> '+esc(s.section)+'</p><p>Grammar review: <b>'+score+'/10</b> • Arcade: <b>Completed</b> • Essay: <b>'+wc()+' words</b></p><h3>'+esc(s.title)+'</h3><div class="essay">'+s.paragraphs.map(esc).join("\n\n")+'</div><p class="hint">Download your clean, printable Word-compatible essay. It includes a separate cover page, your name, class, subject, date, title, and only your three essay paragraphs. Print it at home and present it in a nice folder!</p><button onclick="downloadEssay()">📄 DOWNLOAD PRINTABLE ESSAY + COVER PAGE</button><button onclick="downloadProgress()">💾 Save backup progress (JSON)</button><button onclick="showAnswers()">Review grammar answers</button><div id="answers"></div>'}
$("app").innerHTML=h;if(s.step===17)startGame()}
function choose(i){s.answers[s.step-7]=i;save();render()}function updateEssay(){s.title=$("title").value;s.paragraphs=s.paragraphs.map((v,i)=>$("p"+i).value);$("wordcount").textContent="Essay words: "+wc()+" / minimum 125. Each paragraph needs at least 4 words.";save()}
function next(){capture();if(s.step===0&&(!s.name||!s.section||!s.date)){alert("Please enter your name, class, and date.");return}if(s.step>=7&&s.step<=16&&s.answers[s.step-7]===undefined){alert("Choose an answer before continuing.");return}if(s.step===19){if(!s.title){alert("Please enter an essay title before continuing.");return}const missing=s.paragraphs.findIndex(p=>count(p)<4);if(missing!==-1){alert("Paragraph "+(missing+1)+" needs at least 4 words. Your essay must have a beginning, middle, and ending.");return}if(wc()<125){alert("Your essay currently has "+wc()+" words. Add "+(125-wc())+" more words to reach the 125-word minimum.");return}}if(s.step===20&&!s.checks.every(Boolean)){alert("Complete all five revision checks before submitting.");return}s.step++;s.max=Math.max(s.max,s.step);render()}function back(){if(s.step<=0)return;capture();stopGame();s.step--;render()}
function download(name,content,type){let b=new Blob([content],{type}),u=URL.createObjectURL(b),a=document.createElement("a");a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),3000)}
function downloadEssay(){const safe=x=>esc(x),student=safe(s.name),section=safe(s.section),date=safe(s.date),title=safe(s.title);const para=s.paragraphs.map(p=>'<p style="margin:0 0 18pt;text-align:justify;text-indent:0.5in;line-height:1.6">'+safe(p).replace(/\n/g," ")+'</p>').join("");const doc='<!DOCTYPE html><html><head><meta charset="utf-8"><title>'+title+'</title><style>@page{size:letter;margin:1in}body{font-family:Georgia,"Times New Roman",serif;color:#111;font-size:12pt}.cover{height:8.5in;text-align:center;page-break-after:always;break-after:page;padding-top:1.4in;box-sizing:border-box}.cover h1{font-size:24pt;margin:0 0 16pt}.cover h2{font-size:18pt;font-weight:normal;margin:0 0 1.4in}.cover p{font-size:13pt;margin:14pt}.essaytitle{text-align:center;font-size:16pt;margin:0 0 30pt;font-weight:bold}.essaybody{line-height:1.6}</style></head><body><div class="cover"><h1>THE MYSTERY OF DREAMS</h1><h2>'+title+'</h2><p><b>Student:</b> '+student+'</p><p><b>Class / Section:</b> '+section+'</p><p><b>Subject:</b> English Language Arts</p><p><b>Date:</b> '+date+'</p></div><div class="essaybody"><h2 class="essaytitle">'+title+'</h2>'+para+'</div></body></html>';download("Mystery_of_Dreams_Essay_"+s.name.replace(/[^a-z0-9]/gi,"_")+".doc","\ufeff"+doc,"application/msword;charset=utf-8")}

function showAnswers(){$("answers").innerHTML=qs.map((q,i)=>'<p><b>'+esc(q[0])+'</b><br>Your answer: '+esc(q[1][s.answers[i]])+'<br>Correct: '+esc(q[1][q[2]])+'</p>').join("")}
function stopGame(){if(frame)cancelAnimationFrame(frame);frame=0;g=null;keys={left:false,right:false,jump:false}}
function startGame(){stopGame();g={x:90,y:257,vy:0,score:0,hearts:4,t:0,objects:[],inv:0};frame=requestAnimationFrame(loop)}
const forms=[["went","goed"],["saw","seed"],["flew","flyed"],["woke","waked"],["felt","feeled"],["ran","runned"],["heard","heared"],["Finally","finaly"]];
function loop(){if(!g||s.step!==17)return;let c=$("arcade");if(!c)return;let x=c.getContext("2d"),z=g;z.t++;let gr=x.createLinearGradient(0,0,0,340);gr.addColorStop(0,"#142653");gr.addColorStop(1,"#5078a6");x.fillStyle=gr;x.fillRect(0,0,720,340);x.fillStyle="#fff9";for(let i=0;i<40;i++)x.fillRect((i*79+z.t*.4)%720,(i*53)%255,2,2);x.fillStyle="#c8eaff";x.fillRect(0,305,720,35);if(keys.left)z.x=Math.max(30,z.x-5);if(keys.right)z.x=Math.min(670,z.x+5);if(keys.jump&&z.y>=257)z.vy=-11;z.vy+=.55;z.y=Math.min(257,z.y+z.vy);z.inv=Math.max(0,z.inv-1);if(z.t%90===0){let good=Math.random()>.35,f=forms[Math.floor(Math.random()*forms.length)];z.objects.push({x:750,y:good?185+Math.random()*60:270,good,word:good?f[0]:f[1],speed:3.5})}for(let o of z.objects){o.x-=o.speed;x.fillStyle=o.good?"#c6ffe3":"#ffc3c3";x.beginPath();x.roundRect(o.x-15,o.y-25,Math.max(70,x.measureText(o.word).width+40),42,10);x.fill();x.fillStyle="#15253b";x.font="bold 19px system-ui";x.fillText(o.word,o.x,o.y+2);if(Math.abs(z.x-o.x)<43&&Math.abs(z.y-o.y)<35&&!z.inv){o.x=-100;if(o.good)z.score++;else{z.hearts--;z.inv=40}}}z.objects=z.objects.filter(o=>o.x>-100);x.font="43px system-ui";x.globalAlpha=z.inv&&z.t%8<4?.35:1;x.fillText("🧑‍🚀",z.x-25,z.y+16);x.globalAlpha=1;$("hud").textContent="⭐ "+z.score+" / 6 • ❤️ "+z.hearts;if(z.score>=6){stopGame();s.gameDone=true;s.gameScore=6;s.step=18;s.max=Math.max(s.max,s.step);save();alert("🎉 Dreamland grammar runner complete! Time to finish your essay.");render();return}if(z.hearts<=0){alert("Try again! The dreamland runner is restarting.");startGame();return}frame=requestAnimationFrame(loop)}
window.addEventListener("keydown",e=>{if(g&&["ArrowLeft","ArrowRight","ArrowUp","Space","KeyA","KeyD"].includes(e.code)){e.preventDefault();keys[e.code==="ArrowLeft"||e.code==="KeyA"?"left":e.code==="ArrowRight"||e.code==="KeyD"?"right":"jump"]=true}});window.addEventListener("keyup",e=>{if(["ArrowLeft","ArrowRight","ArrowUp","Space","KeyA","KeyD"].includes(e.code))keys[e.code==="ArrowLeft"||e.code==="KeyA"?"left":e.code==="ArrowRight"||e.code==="KeyD"?"right":"jump"]=false});render();
